openapi: 3.1.0
info:
  title: HV-Tool API
  version: 0.3.1
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
  summary: Question-and-answer workflow for the general meeting (Hauptversammlung) of one company.
  description: |
    Single source of truth for the contract between the user interface, the application core and
    neighbouring systems. Every endpoint is implemented by the application core (`apps/api`) and, for
    the demo, by an in-process adapter that runs the same domain code inside the browser
    (`packages/domain`, see ADR 0002).

    Versioning follows ADR 0015 (Vertragsversionierung, proposed — "Versionierung nach ADR 0015,
    vorgeschlagen"): semantic versioning, every change recorded in `packages/contract/CHANGELOG.md`,
    new mandatory fields arrive optional first, removals are deprecated one cycle ahead, pre-declared
    operations live in `packages/contract/allowlist.json` with an expiry date. Two gates enforce this:
    `packages/contract/scripts/check.mjs` (version, changelog, allowlist form and expiry; run by
    `pnpm -r test`) and the operation-coverage gate of the API test suite
    (`apps/api/src/__tests__/operation-coverage.setup.ts`, since 0.3.0: every `operationId` is
    exercised by a test or pre-declared in the allowlist, and no pre-declared operation is exercised).

    Meeting scope (Jahrgang, since 0.3.0, ADR 0011 and Plan 3 "Jahrgang und Tagesordnung"): every
    speaker, contribution, question and event belongs to one meeting (`meetingId`). Canonical paths
    are `/v1/meetings/{meetingId}/…` for everything that is a collection of a meeting; an item that
    has a globally unique id of its own (`/speakers/{speakerId}`, `/contributions/{contributionId}`,
    `/questions/{questionId}/…`) is addressed by that id alone and is canonical as it is. The
    un-prefixed collection paths of 0.1/0.2 (`/meeting`, `/agenda-items`, `/units`, `/speakers`,
    `/speakers/order`, `/contributions`, `/questions`, `/stage`) stay served as an alias for the
    current meeting (aktuelle HV) until contract 0.5 and are marked `deprecated` since 0.3.0.
    `/events` and `/stream` are global (the sequence number is global and gap-free); `/stream` takes
    an optional `meetingId` filter, `/events` gets it with 0.4.0 (slice 043; the unchanged service
    would accept and ignore it today). The current meeting behind the alias paths is the meeting in
    status `running` with the latest `date` (several running: the latest `date` wins, ties: the latest
    `MeetingCreated`); when none is running, the meeting with the latest `date` regardless of status;
    when no meeting exists at all, every alias answers 404 (from slice 025; until then the service
    serves its single built-in meeting).

    Authentication (since 0.3.0, ADR 0004): production uses the `session` cookie issued by the
    BFF endpoints under `/auth` (slice 029); the demo uses the `demoActor` header. The browser never
    holds a token. Operations reachable without any credential carry `security: []`: `/healthz`,
    `/readyz`, `/auth/login`, `/auth/callback`, `/auth/transparency-notice`. `/metrics` is for the
    scraper only and takes the `metricsBearer` token from the service configuration. `/healthz`,
    `/readyz`, `/metrics` and `/auth/*` live outside `/v1` (per-path `servers`).

    Compatibility within a major version: enumerations grow in minor versions (0.3.0: `Action` +12,
    `Event.type` +10, `Contribution.source` +`paper`, new `ReadinessCheckCode`) and optional fields
    are added. A client must ignore an unknown enum value in a response (skip the event, hide the
    action), ignore an unknown optional field and not fail on a documented status it has not seen
    before. A removal is deprecated one cycle ahead (ADR 0015). Request schemas of existing
    operations are never widened by a contract-only release: the service validates every request
    against this document, so a widening would take effect immediately (review 023).

    Conventions (see docs/ist-analyse-und-schnittstellen.md, section 6):
    - Writes carry an `Idempotency-Key`; replays return the original result.
    - Resources carry an `ETag`; state-changing calls send `If-Match` and receive `412` on conflict.
      `If-Match` is optional in 0.3.0 and becomes mandatory in 0.3.2 (slice 028, `428` without it).
    - Errors are RFC 9457 problem details.
    - Every response of a question includes `_actions`: the actions the calling actor may perform
      now. The interface renders only what the server allows; it never derives rights from role names.
    - Time is UTC, ISO 8601. The server clock is the only source of time for legally relevant events
      (`recordedAt`, ADR 0011); every response carries `X-Server-Time` (from slice 033) so clients
      can compute their offset (slice 032).
    - Vocabulary follows the house glossary (docs/glossar.md). German terms in parentheses.
  x-legal-notice: >
    This contract cites no statute. Legal references live only in the domain: from slice 011 on,
    every rule of the domain rule tables (transitions and guards in `packages/domain`) carries a
    `legalRef` entry (source, citation, docVersion, docHash, verified), collected in the generated
    register `docs/legal-trace.md`. Every entry is `verified: false` until the legal department has
    checked it (decision register entry E15, feedback requested by 15.01.2027); nothing in this
    document or in that register is a verified statement of law.
servers:
  - url: /v1
    description: >-
      Same-origin API. In the demo the path is served in-process. Meeting-scoped collections are
      canonical under `/meetings/{meetingId}/…`; the un-prefixed collection paths are the alias for
      the current meeting until 0.5 (see `info.description`).
tags:
  - { name: meeting, description: 'The general meeting (Hauptversammlung, Jahrgang) and its master data' }
  - { name: speakers, description: List of speakers (Wortmeldeliste) }
  - { name: contributions, description: Speeches (Redebeiträge) and their capture }
  - { name: questions, description: Individual questions (Einzelfragen) and their workflow }
  - { name: stage, description: Podium view (Bühne) and podium seats (Bühnenplätze) }
  - { name: events, description: Append-only event feed for neighbouring systems and the history }
  - { name: admin, description: 'Administration of a meeting (Jahrgang) — master data, podium seats, role assignments, configuration freeze' }
  - { name: auth, description: 'Sign-in through the BFF (ADR 0004): session cookie, never a token in the browser' }
  - { name: operations, description: 'Health, readiness and metrics for the platform (ADR 0013): no personal data, no question text' }
  - { name: demo, description: 'Demo-only operations, never deployed to production' }
security:
  - demoActor: []
  - session: []
paths:
  # ---- alias paths for the current meeting (aktuelle HV) — veraltet seit 0.3.0, entfallen mit 0.5 ----
  /meeting:
    get:
      tags: [meeting]
      operationId: getMeeting
      summary: Get the current meeting (alias)
      deprecated: true
      description: >-
        Alias for the current meeting (aktuelle HV): the same resource as `GET /meetings/{meetingId}`
        with the id of the current meeting — the meeting in status `running` with the latest `date`
        (several running: the latest `date` wins, ties: the latest `MeetingCreated`); when none is
        running, the meeting with the latest `date` regardless of status. `404` when no meeting exists
        at all (today's behaviour before the first seed; every other alias resolves the same way from
        slice 025). Veraltet seit 0.3.0, entfällt mit Vertrag 0.5 (Plan 3, "Jahrgang und
        Tagesordnung"; no slice in Plan 5 names the removal yet). Served unchanged until then.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /agenda-items:
    get:
      tags: [meeting]
      operationId: listAgendaItems
      summary: List agenda items (Tagesordnungspunkte) of the current meeting (alias)
      deprecated: true
      description: >-
        Alias for `GET /meetings/{meetingId}/agenda-items` of the current meeting. Veraltet seit 0.3.0,
        entfällt mit Vertrag 0.5.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /units:
    get:
      tags: [meeting]
      operationId: listUnits
      summary: List answering units (Fachbereiche) of the current meeting (alias)
      deprecated: true
      description: >-
        Alias for `GET /meetings/{meetingId}/units` of the current meeting. Veraltet seit 0.3.0,
        entfällt mit Vertrag 0.5.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Unit' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /speakers:
    get:
      tags: [speakers]
      operationId: listSpeakers
      summary: List speakers (Wortmeldeliste) of the current meeting, ordered by round and position (alias)
      deprecated: true
      description: >-
        Alias for `GET /meetings/{meetingId}/speakers` of the current meeting. Veraltet seit 0.3.0,
        entfällt mit Vertrag 0.5.
      parameters:
        - { $ref: '#/components/parameters/RoundFilter' }
        - { $ref: '#/components/parameters/SpeakerStatusFilter' }
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Speaker' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [speakers]
      operationId: registerSpeaker
      summary: Register a speaker (Wortmeldung aufnehmen) in the current meeting (alias)
      deprecated: true
      description: >-
        Alias for `POST /meetings/{meetingId}/speakers` of the current meeting. Veraltet seit 0.3.0,
        entfällt mit Vertrag 0.5.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SpeakerRegistration' } } }
      responses:
        '201': { description: Created, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Speaker' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /speakers/order:
    put:
      tags: [speakers]
      operationId: reorderSpeakers
      summary: Set the order of speakers within a round (Reihenfolge ändern) of the current meeting (alias)
      deprecated: true
      description: >-
        Alias for `PUT /meetings/{meetingId}/speakers/order` of the current meeting. Veraltet seit
        0.3.0, entfällt mit Vertrag 0.5.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SpeakerOrder' } } }
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Speaker' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  # ---- items with a global id: canonical as they are --------------------------------------------
  /speakers/{speakerId}:
    parameters: [ { $ref: '#/components/parameters/SpeakerId' } ]
    get:
      tags: [speakers]
      operationId: getSpeaker
      summary: Get a speaker
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Speaker' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [speakers]
      operationId: updateSpeaker
      summary: Change speaker status or round (Redner aufrufen, beenden, zurückziehen)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SpeakerUpdate' } } }
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Speaker' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /contributions:
    get:
      tags: [contributions]
      operationId: listContributions
      summary: List speeches (Redebeiträge) of the current meeting (alias)
      deprecated: true
      description: >-
        Alias for `GET /meetings/{meetingId}/contributions` of the current meeting. Veraltet seit
        0.3.0, entfällt mit Vertrag 0.5.
      parameters:
        - { $ref: '#/components/parameters/SpeakerIdFilter' }
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Contribution' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [contributions]
      operationId: captureContribution
      summary: Capture a speech (Redebeitrag erfassen) in the current meeting (alias)
      deprecated: true
      description: >-
        Alias for `POST /meetings/{meetingId}/contributions` of the current meeting. Veraltet seit
        0.3.0, entfällt mit Vertrag 0.5. Creates the immutable text of a speech. Questions are then
        atomised out of it with `captureQuestions`. Later, transcript segments arrive through the
        ingest interface and become contributions the same way.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ContributionCapture' } } }
      responses:
        '201': { description: Created, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Contribution' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /contributions/{contributionId}:
    parameters: [ { $ref: '#/components/parameters/ContributionId' } ]
    get:
      tags: [contributions]
      operationId: getContribution
      summary: Get a speech with its coverage (Restabdeckung)
      responses:
        '200': { description: 'OK — `ETag` is `Contribution.version`, the value `claimContribution`/`releaseContribution` send back as `If-Match` (optional here: a 0.2 operation)', headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Contribution' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /contributions/{contributionId}/questions:
    parameters: [ { $ref: '#/components/parameters/ContributionId' } ]
    post:
      tags: [questions]
      operationId: captureQuestions
      summary: Atomise a speech into individual questions (Einzelfragen erfassen)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questions]
              properties:
                questions:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/QuestionCapture' }
      responses:
        '201': { description: Created, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Question' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /contributions/{contributionId}/claim:
    parameters: [ { $ref: '#/components/parameters/ContributionId' } ]
    post:
      tags: [contributions]
      operationId: claimContribution
      summary: Take over a speech for atomisation (Redebeitrag übernehmen) — soft lock with expiry
      description: >-
        Since 0.3.0 (slice 028, register E36): a claim (Übernahme) is a soft lock — data, not a hard
        lock — with a server-side time to live (10 minutes by default); expiry releases it. Who holds
        the claim is visible in `claim` on the resource and in the events `ContributionClaimed` /
        `ContributionReleased`. Permission `contribution.claim`. `409` when another actor holds an
        unexpired claim (rule id from slice 028 in `ruleId`).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/ContributionUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /contributions/{contributionId}/release:
    parameters: [ { $ref: '#/components/parameters/ContributionId' } ]
    post:
      tags: [contributions]
      operationId: releaseContribution
      summary: Release a claimed speech (Übernahme zurückgeben)
      description: >-
        Since 0.3.0 (slice 028). Permission `contribution.claim`; only the holder releases (an
        override is a decision of slice 040, `admin.override`, not part of 0.3.0). `409` when the
        speech is not claimed or claimed by someone else.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/ContributionUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /questions:
    get:
      tags: [questions]
      operationId: listQuestions
      summary: List questions of the current meeting with filters (alias)
      deprecated: true
      description: >-
        Alias for `GET /meetings/{meetingId}/questions` of the current meeting. Veraltet seit 0.3.0,
        entfällt mit Vertrag 0.5.
      parameters:
        - { $ref: '#/components/parameters/QuestionStatusFilter' }
        - { $ref: '#/components/parameters/TrackFilter' }
        - { $ref: '#/components/parameters/UnitIdFilter' }
        - { $ref: '#/components/parameters/SpeakerIdFilter' }
        - { $ref: '#/components/parameters/ContributionIdFilter' }
        - { $ref: '#/components/parameters/AgendaItemIdFilter' }
        - { $ref: '#/components/parameters/FullTextFilter' }
        - { $ref: '#/components/parameters/QuestionLimit' }
        - { $ref: '#/components/parameters/QuestionOffset' }
      responses:
        '200': { $ref: '#/components/responses/QuestionList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /questions/{questionId}:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    get:
      tags: [questions]
      operationId: getQuestion
      summary: Get a question with its answer versions and allowed actions
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /questions/{questionId}/history:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    get:
      tags: [questions, events]
      operationId: getQuestionHistory
      summary: Full event history of a question (Vorgangshistorie)
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Event' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /questions/{questionId}/classification:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [questions]
      operationId: classifyQuestion
      summary: Classify a question (Klassifizieren) — answer track, agenda item, podium seat
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/Classification' } } }
      responses:
        '200': { $ref: '#/components/responses/QuestionUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /questions/{questionId}/assignment:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [questions]
      operationId: assignQuestion
      summary: Assign a question to an answering unit (Zuweisen an Fachbereich)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [unitId]
              properties:
                unitId: { type: string }
      responses:
        '200': { $ref: '#/components/responses/QuestionUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /questions/{questionId}/answers:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [questions]
      operationId: draftAnswer
      summary: Add an answer version (Antwortentwurf)
      description: >
        Every call creates a new, immutable answer version. If the question was already approved,
        the approval is bound to the earlier version and the question falls back to `answer_drafted`.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AnswerDraft' } } }
      responses:
        '200': { $ref: '#/components/responses/QuestionUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /questions/{questionId}/review-submissions:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [questions]

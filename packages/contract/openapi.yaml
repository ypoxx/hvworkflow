      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/QuestionUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /questions/{questionId}/closure:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [questions]
      operationId: closeQuestion
      summary: Close a delivered question (Abschließen)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/QuestionUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /questions/{questionId}/withdrawal:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [questions]
      operationId: withdrawQuestion
      summary: Withdraw a question (Zurückgezogen) — e.g. the shareholder withdrew it
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/QuestionUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /questions/{questionId}/merge:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [questions]
      operationId: mergeQuestion
      summary: Merge a duplicate into another question (Zusammenführen)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [intoQuestionId]
              properties:
                intoQuestionId: { type: string }
      responses:
        '200': { $ref: '#/components/responses/QuestionUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /questions/{questionId}/claim:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [questions]
      operationId: claimQuestion
      summary: Take over a question for drafting (Einzelfrage übernehmen) — soft lock with expiry
      description: >-
        Since 0.3.0 (slice 028, register E36): the assignment stays with the answering unit; the
        person is visible only through this claim (Übernahme, weiche Sperre), never through an
        automatic personal assignment (ADR 0013). Time to live 10 minutes by default; expiry releases.
        Permission `question.claim`. `409` when another actor holds an unexpired claim.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/QuestionUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /questions/{questionId}/release:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [questions]
      operationId: releaseQuestion
      summary: Release a claimed question (Übernahme zurückgeben)
      description: >-
        Since 0.3.0 (slice 028). Permission `question.claim`; only the holder releases. `409` when the
        question is not claimed or claimed by someone else.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/QuestionUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /stage:
    get:
      tags: [stage]
      operationId: getStage
      summary: Podium view (Bühne) of the current meeting — current question, queue, counters (alias)
      deprecated: true
      description: >-
        Alias for `GET /meetings/{meetingId}/stage` of the current meeting. Veraltet seit 0.3.0,
        entfällt mit Vertrag 0.5.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/StageView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ---- global feeds: sequence numbers are global, the meeting is a filter --------------------------
  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Append-only event feed. Poll with `after` = last seen sequence number.
      description: >-
        Global feed: `seq` is global and gap-free across meetings (ADR 0011), so this path has no
        meeting prefix and `lastSeq` stays the global cursor. Permission `event.read`. A `meetingId`
        filter arrives with 0.4.0 (slice 043, ahead of 035): not in 0.3.0, because the unchanged
        service would accept the parameter and silently return unfiltered events (review 023).
      parameters:
        - { $ref: '#/components/parameters/After' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 } }
      responses:
        '200':
          description: OK
          headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
          content:
            application/json:
              schema:
                type: object
                required: [items, lastSeq]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Event' } }
                  lastSeq: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
  /stream:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Realtime event stream (Server-Sent Events) with resumption
      description: >-
        Since 0.3.0 (slice 035, ADR 0014). `text/event-stream`: every message carries one `Event`
        as JSON in `data:` and its `seq` in `id:`; a comment line is sent as heartbeat every 15 s.
        Resume with `after` or the `Last-Event-ID` header (the browser sends it on reconnect). The
        same read permission as `listEvents` applies per delivered event (`event.read` plus the read
        scopes of slice 010): no event reaches a reader who may not read it. Polling `/events` stays
        the fallback. In-app alarms (`NotificationRaised`, slice 085) travel on this stream later.
      parameters:
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/MeetingIdFilter' }
        - { $ref: '#/components/parameters/LastEventId' }
      responses:
        '200':
          description: Stream opened; messages follow until the client closes the connection
          headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
          content:
            text/event-stream:
              schema: { type: string, description: 'SSE framing; each `data:` line is one `Event` JSON document' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # ---- meetings (Jahrgang) — canonical since 0.3.0 --------------------------------------------------
  /meetings:
    get:
      tags: [meeting]
      operationId: listMeetings
      summary: List meetings (Jahrgänge)
      description: >-
        Since 0.3.0 (slice 025). Every signed-in actor may read the list, like the meeting itself
        (Festlegung 1 of slice 010: master data needs no read permission of its own). Sorted by
        `date` descending.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/MeetingStatus' } }
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Meeting' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [meeting, admin]
      operationId: createMeeting
      summary: Create a meeting (Jahrgang anlegen), optionally cloned from an earlier one
      description: >-
        Since 0.3.0 (slice 040). Permission `admin.meetings.manage`. With `cloneFromMeetingId` the
        master data of that meeting (agenda items, units, podium seats) is copied; speakers,
        contributions, questions and events are never copied. Emits `MeetingCreated` (payload
        `clonedFromMeetingId` when cloned). A second legal entity is not modelled (ADR 0011, B-list).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeetingCreate' } } }
      responses:
        '201': { description: Created, headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [meeting]
      operationId: getMeetingById
      summary: Get a meeting (canonical form of `GET /meeting`)
      description: Since 0.3.0 (slice 025). The `ETag` is the meeting's `version` (admin writes send it as `If-Match`, slice 040).
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /meetings/{meetingId}/agenda-items:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [meeting]
      operationId: listMeetingAgendaItems
      summary: List agenda items (Tagesordnungspunkte) of a meeting
      description: Since 0.3.0 (slice 025); canonical form of `GET /agenda-items`.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin, meeting]
      operationId: replaceMeetingAgendaItems
      summary: Set the agenda (Tagesordnung) of a meeting — the whole list
      description: >-
        Since 0.3.0 (slice 040). Permission `agenda.manage`. The list replaces the agenda; an item
        that keeps its `id` keeps its progress timestamps and its questions. `409` after the
        configuration freeze (R-ADM-03, slice 040) or when an item to be removed already has questions.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AgendaItemInput' } } } }
      responses:
        '200': { description: OK — the agenda after the change; `ETag` is the meeting's new version, headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}/agenda-items/{agendaItemId}/opening:
    parameters: [ { $ref: '#/components/parameters/MeetingId' }, { $ref: '#/components/parameters/AgendaItemId' } ]
    post:
      tags: [meeting]
      operationId: openAgendaItem
      summary: Call an agenda item (Tagesordnungspunkt aufrufen) — emits `AgendaItemOpened`
      description: >-
        Since 0.3.0 (slice 025, rule table R-MTG). Permission `agenda.manage`. `409` when the meeting
        is not running or the item is already open (rule id in `ruleId`).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/AgendaItemUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /meetings/{meetingId}/agenda-items/{agendaItemId}/voting/opening:
    parameters: [ { $ref: '#/components/parameters/MeetingId' }, { $ref: '#/components/parameters/AgendaItemId' } ]
    post:
      tags: [meeting]
      operationId: openVoting
      summary: Open the voting on an agenda item (Abstimmung eröffnen) — emits `VotingOpened`
      description: Since 0.3.0 (slice 025, R-MTG). Permission `agenda.manage`. `409` when the item is not open.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/AgendaItemUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /meetings/{meetingId}/agenda-items/{agendaItemId}/voting/closure:
    parameters: [ { $ref: '#/components/parameters/MeetingId' }, { $ref: '#/components/parameters/AgendaItemId' } ]
    post:
      tags: [meeting]
      operationId: closeVoting
      summary: Close the voting on an agenda item (Abstimmung schließen) — emits `VotingClosed`
      description: Since 0.3.0 (slice 025, R-MTG). Permission `agenda.manage`. `409` when the voting is not open.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/AgendaItemUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /meetings/{meetingId}/units:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [meeting]
      operationId: listMeetingUnits
      summary: List answering units (Fachbereiche) of a meeting
      description: Since 0.3.0 (slice 025); canonical form of `GET /units`.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Unit' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin, meeting]
      operationId: replaceMeetingUnits
      summary: Set the answering units (Fachbereiche) of a meeting — the whole list
      description: >-
        Since 0.3.0 (slice 040). Permission `admin.units.manage`. A unit that keeps its `id` keeps its
        assignments; `409` after the configuration freeze (R-ADM-03) or when a unit to be removed
        still has assigned questions.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UnitInput' } } } }
      responses:
        '200': { description: OK — the units after the change; `ETag` is the meeting's new version, headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Unit' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}/stage-seats:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [stage, meeting]
      operationId: listMeetingStageSeats
      summary: List the podium seats (Bühnenplätze) of a meeting
      description: >-
        Since 0.3.0 (slice 040, ADR 0006): the seat list replaces the `StageAssignment` enum; the
        four enum values become the default seats of the seed. Readable by every signed-in actor
        (master data); classification sets `seatId` from it.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StageSeat' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin, stage]
      operationId: replaceMeetingStageSeats
      summary: Set the podium seats (Bühnenplätze) of a meeting with person and device per seat
      description: >-
        Since 0.3.0 (slice 040). Permission `admin.seats.manage`. `personId` and `deviceId` per seat
        are resolved in the service for the podium filter (ADR 0006: the context never comes from
        the client). `409` after the configuration freeze (R-ADM-03).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StageSeatInput' } } } }
      responses:
        '200': { description: OK — the seats after the change; `ETag` is the meeting's new version, headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/StageSeat' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}/role-assignments:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [admin]
      operationId: listRoleAssignments
      summary: List role assignments (Rollenzuordnungen) of a meeting
      description: >-
        Since 0.3.0 (slice 026, ADR 0004): the administered assignment table is the one truth for
        roles; identity-provider groups are only a suggestion (`/auth/me`). Permission
        `admin.roles.manage`. Revoked assignments are included with `revokedAt`.
      parameters:
        - { name: subjectId, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/RoleAssignment' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [admin]
      operationId: assignRole
      summary: Assign a role to a subject for this meeting (Rolle zuordnen) — emits `RoleAssigned`
      description: >-
        Since 0.3.0 (slice 026). Permission `admin.roles.manage`. `unitId` is optional and binds the
        role to one answering unit (an `expert` without a unit cannot read questions, slice 026).
        `expiresAt` defaults to the end of the meeting (auto-expiry). Emergency accounts are ordinary
        assignments flagged by the identity adapter (slice 029), never a separate path.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignmentCreate' } } }
      responses:
        '201': { description: Created, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}/role-assignments/{assignmentId}/revocation:
    parameters: [ { $ref: '#/components/parameters/MeetingId' }, { $ref: '#/components/parameters/AssignmentId' } ]
    post:
      tags: [admin]
      operationId: revokeRole
      summary: Revoke a role assignment (Rolle entziehen) — emits `RoleRevoked`
      description: >-
        Since 0.3.0 (slice 026). Permission `admin.roles.manage`. Revocation is a new event, never a
        change to the assignment event (rule 7). `409` when already revoked. Takes effect on the
        subject's next request; the session block list (slice 029) ends a running session.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200': { description: OK — the assignment with `revokedAt` set, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/RoleAssignment' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /meetings/{meetingId}/config-freeze:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    post:
      tags: [admin]
      operationId: freezeMeetingConfig
      summary: Freeze the configuration of a meeting (Konfigurationsfreeze) — emits `ConfigFrozen`
      description: >-
        Since 0.3.0 (slice 040; docs/rollen-und-rechtekonzept.md, "Eingefrorener Snapshot je
        HV-Jahrgang"). Permission `admin.config.freeze`. The service hashes the effective rights
        table, the transition table and the master data into `configHash`; after the freeze every
        master-data change is `409` R-ADM-03 unless the actor overrides with a reason (slice 040).
        `409` when already frozen.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/ConfigFreeze' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /meetings/{meetingId}/speakers:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [speakers]
      operationId: listMeetingSpeakers
      summary: List speakers (Wortmeldeliste) of a meeting, ordered by round and position
      description: Since 0.3.0 (slice 025); canonical form of `GET /speakers`. Permission `speaker.read`.
      parameters:
        - { $ref: '#/components/parameters/RoundFilter' }
        - { $ref: '#/components/parameters/SpeakerStatusFilter' }
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Speaker' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [speakers]
      operationId: registerMeetingSpeaker
      summary: Register a speaker (Wortmeldung aufnehmen) in a meeting
      description: Since 0.3.0 (slice 025); canonical form of `POST /speakers`. Permission `speaker.register`.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SpeakerRegistration' } } }
      responses:
        '201': { description: Created, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Speaker' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}/speakers/order:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    put:
      tags: [speakers]
      operationId: reorderMeetingSpeakers
      summary: Set the order of speakers within a round (Reihenfolge ändern) of a meeting
      description: Since 0.3.0 (slice 025); canonical form of `PUT /speakers/order`. Permission `speaker.reorder`.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SpeakerOrder' } } }
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Speaker' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}/contributions:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [contributions]
      operationId: listMeetingContributions
      summary: List speeches (Redebeiträge) of a meeting
      description: Since 0.3.0 (slice 025); canonical form of `GET /contributions`. Permission `contribution.read`.
      parameters:
        - { $ref: '#/components/parameters/SpeakerIdFilter' }
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Contribution' } } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [contributions]
      operationId: captureMeetingContribution
      summary: Capture a speech (Redebeitrag erfassen) in a meeting
      description: >-
        Since 0.3.0 (slice 025); canonical form of `POST /contributions`. Permission
        `contribution.capture`. `409` when the meeting does not accept captures any more (rule table
        R-MTG, slice 025). Unlike the alias, the body is `MeetingContributionCapture`: the paper path
        (`source: paper`) and the sender's time statement (`occurredAt` with `occurredAtSource`) exist
        only here.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeetingContributionCapture' } } }
      responses:
        '201': { description: Created, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Contribution' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}/questions:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [questions]
      operationId: listMeetingQuestions
      summary: List questions of a meeting with filters
      description: >-
        Since 0.3.0 (slice 025); canonical form of `GET /questions`. Permissions `question.read` or
        `question.read.delivered` (R-PERM-03 scope applies, slice 010).
      parameters:
        - { $ref: '#/components/parameters/QuestionStatusFilter' }
        - { $ref: '#/components/parameters/TrackFilter' }
        - { $ref: '#/components/parameters/UnitIdFilter' }
        - { $ref: '#/components/parameters/SpeakerIdFilter' }
        - { $ref: '#/components/parameters/ContributionIdFilter' }
        - { $ref: '#/components/parameters/AgendaItemIdFilter' }
        - { $ref: '#/components/parameters/FullTextFilter' }
        - { $ref: '#/components/parameters/QuestionLimit' }
        - { $ref: '#/components/parameters/QuestionOffset' }
      responses:
        '200': { $ref: '#/components/responses/QuestionList' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /meetings/{meetingId}/stage:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [stage]
      operationId: getMeetingStage
      summary: Podium view (Bühne) of a meeting — current question, queue, counters
      description: >-
        Since 0.3.0 (slice 025); canonical form of `GET /stage`. Permission `stage.read`. The
        per-seat filter (ADR 0006) is resolved in the service from the actor's seat, never from a
        client parameter (slices 040, 047); a `seat` query parameter is a 0.4.0 matter (slice 043).
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/StageView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ---- sign-in through the BFF (ADR 0004) — outside /v1 ---------------------------------------------
  /auth/login:
    servers: [ { url: /, description: 'Outside /v1: browser navigation, not an API call' } ]
    get:
      tags: [auth]
      operationId: login
      summary: Start the sign-in (Anmeldung) — redirects the browser to the identity provider
      description: >-
        Since 0.3.0 (slice 029, ADR 0004). Authorization Code flow runs server-side with a
        confidential client; the browser is redirected to the identity provider and never sees a
        token. No credential needed (`security: []`). `503` when no identity provider is configured
        (demo, `HV_DEMO=1`: the header `X-Actor` is the sign-in). A `2xx` response does not exist for
        this operation by design (lint warning accepted, see CHANGELOG 0.3.0).
      security: []
      parameters:
        - { name: returnTo, in: query, description: 'Relative path inside the application to return to after sign-in; anything else is ignored (open-redirect guard)', schema: { type: string, maxLength: 512 } }
      responses:
        '302': { description: Redirect to the identity provider, headers: { Location: { schema: { type: string, format: uri } }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/callback:
    servers: [ { url: /, description: 'Outside /v1: the identity provider redirects the browser here' } ]
    get:
      tags: [auth]
      operationId: completeLogin
      summary: Complete the sign-in — exchanges the code, sets the session cookie, redirects into the application
      description: >-
        Since 0.3.0 (slice 029). Validates `state`, exchanges `code` server-side, checks issuer,
        audience, expiry and signature (JWKS), resolves the roles from the assignment table (slice
        026; identity-provider groups are a suggestion only) and sets the HttpOnly `session` cookie.
        `400` on an invalid or replayed `state`/`code`; `403` when the subject has no role in any
        open meeting; `503` when no identity provider is configured. No `2xx` by design.
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302': { description: Signed in; redirect to `returnTo` or the application root, headers: { Location: { schema: { type: string } }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } } }
        '400': { description: Invalid or replayed authorization response, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /auth/logout:
    servers: [ { url: /, description: 'Outside /v1' } ]
    post:
      tags: [auth]
      operationId: logout
      summary: End the session (Abmelden) — clears the cookie and blocks the session id
      description: Since 0.3.0 (slice 029). Requires the session cookie and the CSRF token; a demo actor has no session to end.
      security: [ { session: [] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfToken' } ]
      responses:
        '204': { description: Signed out; the cookie is cleared, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    servers: [ { url: /, description: 'Outside /v1' } ]
    get:
      tags: [auth]
      operationId: getSession
      summary: Who am I — the signed-in actor, roles from the assignment table, session expiry
      description: >-
        Since 0.3.0 (slice 029). In the demo this is the `X-Actor` identity. `idpGroups` lists the
        identity provider's groups as a suggestion for the administrator; they never become a role by
        themselves (ADR 0004). `csrfToken` is sent as `X-CSRF-Token` on state-changing calls under the
        `session` scheme (slice 029; parameter `CsrfToken`).
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/transparency-notice:
    servers: [ { url: /, description: 'Outside /v1: read before sign-in' } ]
    get:
      tags: [auth]
      operationId: getTransparencyNotice
      summary: Transparency notice (Transparenzhinweis, Art. 13 GDPR — unverified, E15) for the sign-in page
      description: >-
        Since 0.3.0 (slice 029; shown by the sign-in page of slice 030 in German and English). The
        text is deployment configuration, not contract content; it is readable without any credential
        (`security: []`) because it is displayed before sign-in. Legal review of the text is pending
        (register E15): the interface shows it as unverified until then.
      security: []
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TransparencyNotice' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  # ---- platform (ADR 0013) — outside /v1 --------------------------------------------------------
  /healthz:
    servers: [ { url: /, description: 'Outside /v1: platform probe' } ]
    get:
      tags: [operations]
      operationId: getHealth
      summary: Liveness — the process answers
      description: 'Since 0.3.0 (slice 033). No credential (`security: []`), no data beyond `status`.'
      security: []
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /readyz:
    servers: [ { url: /, description: 'Outside /v1: platform probe' } ]
    get:
      tags: [operations]
      operationId: getReadiness
      summary: Readiness — clock/NTP status (slice 033), database and migration state (slice 027)
      description: >-
        Since 0.3.0 (slice 033). No credential (`security: []`). `503` with the same body when a check
        fails; the deploy smoke test of slice 037 rolls back on it.
      security: []
      responses:
        '200': { description: Ready, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Readiness' } } } }
        '503': { description: Not ready — at least one check failed, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Readiness' } } } }
  /metrics:
    servers: [ { url: /, description: 'Outside /v1: scraped by the monitoring stack' } ]
    get:
      tags: [operations]
      operationId: getMetrics
      summary: Metrics in Prometheus text exposition format — the five aggregate indicators, none per person
      description: >-
        Since 0.3.0 (slice 033, ADR 0013). Exactly the indicators of the generated evaluation
        catalogue (age of the oldest open question, backlog per unit, inflow per 5 min, questions in
        legal clearing > 10 min, events per minute); no indicator per subject, ever (allowlist gate
        of slice 033). Protected by the `metricsBearer` token from the service configuration: the
        consumer is the scraper, not an actor, so no `can()` decision and no `_actions` apply.
      security: [ { metricsBearer: [] } ]
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { text/plain: { schema: { type: string, description: 'Prometheus text exposition format 0.0.4' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  # ---- demo -----------------------------------------------------------------------------------------
  /demo/seed:
    post:
      tags: [demo]
      operationId: seedDemo
      summary: Replace all data with a synthetic corpus (demo only)
      x-demo-only: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                questions: { type: integer, minimum: 0, maximum: 5000, default: 800 }
                seed: { type: integer, default: 2027 }
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    demoActor:
      type: apiKey
      in: header
      name: X-Actor
      description: >
        Demo stand-in for the sign-in (only with `HV_DEMO=1`, slice 029 refuses the header outside
        the demo). Value `<actorId>:<role>`. The production adapter maps the session to the same
        actor context; nothing else in the system changes.
    session:
      type: apiKey
      in: cookie
      name: hv_session
      description: >
        Since 0.3.0 (ADR 0004, slice 029): HttpOnly, SameSite session cookie issued by
        `GET /auth/callback` after the server-side Authorization Code flow. 14 h with silent refresh,
        idle timeout, block list of subject ids without restart (kill switch). State-changing calls
        additionally send the CSRF token from `GET /auth/me` in the header `X-CSRF-Token`
        (`components/parameters/CsrfToken`, declared on every state-changing operation). The browser
        never holds a token.
    metricsBearer:
      type: http
      scheme: bearer
      description: >
        Since 0.3.0 (slice 033): static bearer token from the service configuration (slice 034),
        only for `GET /metrics`. Authenticates the scraper; it is not an actor.
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://idp.example.invalid/.well-known/openid-configuration
      x-deprecated: true
      description: >
        Deprecated — veraltet seit 0.3.0, entfällt mit Vertrag 0.5: a token in the browser
        contradicts ADR 0004 (the browser never holds a token); production authenticates with the
        `session` cookie issued by the BFF. Kept only so that no consumer of 0.2 breaks; never used by
        any operation. (`x-deprecated` because a security scheme has no `deprecated` field.)
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
      description: >-
        Client-generated key. A replay with the same key returns the original result. Keys survive a
        restart from slice 028 (persisted in the event envelope, `Event.idempotencyKey`).
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string }
      description: >-
        ETag of the resource the client last saw. Mismatch yields 412. Optional in 0.3.0; mandatory
        (428 without it) from 0.3.1 on every state-changing speaker, contribution and question
        operation except `deliverQuestion`, which checks the answer version hash instead (slice 028).
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema: { type: string }
      description: >-
        Since 0.3.0 (slice 029, ADR 0004): the CSRF token from `GET /auth/me` (`Session.csrfToken`),
        sent on every state-changing call made under the `session` scheme — the double-submit pattern:
        a cross-site form cannot add a custom request header, and a script from another origin forces
        a CORS preflight, so the header's presence plus the value check proves the request came from
        the application. The name `X-CSRF-Token` is the convention most frameworks and the OWASP
        cheat sheet use, so no client library needs configuration. Optional in 0.3.0 (the `session`
        scheme is not live); under `session` a missing or wrong token is 403 from slice 029 (rule id
        defined there); under `demoActor` it is ignored. Declared on every state-changing operation,
        `logout` included; not on `seedDemo` (demo only).
    SpeakerId: { name: speakerId, in: path, required: true, schema: { type: string } }
    ContributionId: { name: contributionId, in: path, required: true, schema: { type: string } }
    QuestionId: { name: questionId, in: path, required: true, schema: { type: string } }
    MeetingId: { name: meetingId, in: path, required: true, schema: { type: string }, description: 'Id of the meeting (Jahrgang), `Meeting.id`' }
    AgendaItemId: { name: agendaItemId, in: path, required: true, schema: { type: string } }
    AssignmentId: { name: assignmentId, in: path, required: true, schema: { type: string } }
    MeetingIdFilter: { name: meetingId, in: query, required: false, schema: { type: string }, description: 'Only events of this meeting (Jahrgangsfilter, ADR 0014); the cursor stays global' }
    After: { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 'Last seen global sequence number' }
    LastEventId: { name: Last-Event-ID, in: header, required: false, schema: { type: string }, description: 'Sent by the browser on reconnect; the same meaning as `after`' }
    RoundFilter: { name: round, in: query, schema: { type: integer, minimum: 1 } }
    SpeakerStatusFilter: { name: status, in: query, schema: { $ref: '#/components/schemas/SpeakerStatus' } }
    SpeakerIdFilter: { name: speakerId, in: query, schema: { type: string } }
    QuestionStatusFilter: { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/QuestionStatus' } }, style: form, explode: false }
    TrackFilter: { name: track, in: query, schema: { $ref: '#/components/schemas/Track' } }
    UnitIdFilter: { name: unitId, in: query, schema: { type: string } }
    ContributionIdFilter: { name: contributionId, in: query, schema: { type: string } }
    AgendaItemIdFilter: { name: agendaItemId, in: query, schema: { type: string } }
    FullTextFilter: { name: q, in: query, description: Full-text search over question and answer text, schema: { type: string } }
    QuestionLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
    QuestionOffset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
  headers:
    ETag:
      schema: { type: string }
      description: Opaque version tag, changes with every write.
    X-Server-Time:
      schema: { type: string, format: date-time }
      description: >-
        Since 0.3.0 (slice 033, ADR 0011, B4): the server clock at the time of the response (UTC,
        RFC 3339), taken from the injected clock. Clients compute their offset from it and warn from
        30 s drift (slice 032); a client clock is never the reference for a legally relevant time.
        Declared on every response because OpenAPI has no global response header; optional (no
        `required: true`) because the unchanged 0.3.0 service does not send it yet.
  responses:
    QuestionUpdated:
      description: Updated question with new ETag and current `_actions`
      headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } }
    QuestionList:
      description: OK
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content:
        application/json:
          schema:
            type: object
            required: [items, total]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/Question' } }
              total: { type: integer }
    ContributionUpdated:
      description: Updated speech with new ETag and current `_actions` (since 0.3.0)
      headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Contribution' } } }
    AgendaItemUpdated:
      description: The agenda item after the transition; `ETag` is the meeting's new version (since 0.3.0)
      headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/AgendaItem' } } }
    Unauthorized:
      description: >-
        No valid credential: no session cookie, an expired or blocked session, a wrong audience
        (slice 029) or a missing metrics token. Documented in 0.3.0 on exactly three operations —
        `logout`, `getSession` (`/auth/me`) and `getMetrics` — the ones that arrive with the `session`
        and `metricsBearer` schemes. The 401 the demo header path already produces on every other
        operation stays undocumented in 0.3.0; it is one of the five gaps of review 012 point 18
        (0.4.0, slice 043).
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: >-
        The actor may not perform this action (deny reason in `detail`, rule id in `ruleId`):
        R-PERM-01 write permission missing (Schreibrecht fehlt), R-PERM-02 read permission missing
        (Leserecht fehlt; documented since 0.2.0, enforced on the read operations from slice 010),
        R-PERM-03 read scope exceeded (Leseumfang überschritten; since 0.2.1, slice 010) — e.g. a
        `listQuestions` status filter naming a status outside the actor's `question.read.delivered`
        scope.
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Not found
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: The transition is not allowed from the current status (rule id in `ruleId`)
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionFailed:
      description: If-Match did not match the current ETag
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: Validation failed
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    ServiceUnavailable:
      description: The service cannot serve this now (e.g. no identity provider configured, a readiness check failed)
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details, extended with the rule id that produced the decision.
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        ruleId:
          type: string
          description: >-
            Rule id from the domain rule tables, e.g. R-TRANS-07. Permission denials: R-PERM-01 write
            permission missing (Schreibrecht fehlt), R-PERM-02 read permission missing (Leserecht fehlt;
            since 0.2.0, enforced from slice 010), R-PERM-03 read scope exceeded (Leseumfang
            überschritten; since 0.2.1, slice 010). Meeting lifecycle and agenda: R-MTG-01..06
            (slice 025). Administration after the configuration freeze: R-ADM-01..04 (slice 040).
    Role:
      type: string
      description: >
        Roles are only a bundle of permissions (see docs/rollen-und-rechtekonzept.md). The interface
        never branches on a role name; it reads `_actions`.
        `coordination` (since 0.2.0) is the working name (Arbeitsname) of the role that classifies and
        assigns; displayed as "Koordination", final name pending register entry E1. Its permission
        bundle arrives with slice 021; until then the server does not know the role.
      enum: [moderation, capture, expert, legal, approver, podium, admin, observer, coordination]
    Actor:
      type: object
      required: [id, role]
      properties:
        id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        displayName: { type: string }
        personId: { type: string, description: 'Since 0.3.0 (slice 026, ADR 0009): key into the person table; events carry it instead of a clear name' }
    Action:
      type: string
      description: >
        Permission identifiers (Rechtebezeichner), identical to the domain permission list. A
        permission is granted exclusively in `ROLE_PERMISSIONS` (`packages/domain/src/permissions.ts`,
        AGENTS.md rule 4) — never by comparing a role name in interface or server code.
        Since 0.2.0: the read permissions `speaker.read`, `contribution.read`, `stage.read`,
        `history.read` and `event.read` (next to `question.read`; the read operations check them from
        slice 010, denial = R-PERM-02) and `question.legal.clear` (legal clearing — Rechtsfreigabe —
        recorded as its own event `QuestionLegalCleared`; a recommendation bound to an answer version,
        not the approval, which stays `question.approve`; register E25; slice 021).
        Since 0.2.1: `question.read.delivered` — a scoped alternative to `question.read` for the
        observer role (Beobachter): it only unlocks a question in status `delivered` or `closed`
        (R-PERM-03, `READ_SCOPES` in `packages/domain/src/permissions.ts`), for `listQuestions` and
        `getQuestion`, and applies to every holder including admin (slice 010).
        Since 0.3.0 (identifiers only; granted in `ROLE_PERMISSIONS` by the implementing slice, deny
        by default until then): `contribution.claim` and `question.claim` (take over and release,
        slice 028); `agenda.manage` (agenda and its progress events, slice 025); `admin.meetings.manage`
        (create/clone a meeting), `admin.units.manage`, `admin.seats.manage`, `admin.config.freeze`
        (slice 040); `admin.roles.manage` (role assignments, slice 026).
      enum:
        - speaker.register
        - speaker.reorder
        - speaker.update
        - speaker.read
        - contribution.capture
        - contribution.read
        - contribution.claim
        - question.capture
        - question.classify
        - question.assign
        - question.claim
        - answer.draft
        - question.submit_review
        - question.legal.clear
        - question.approve
        - question.return
        - question.stage
        - question.deliver
        - question.close
        - question.withdraw
        - question.merge
        - question.read
        - question.read.delivered
        - stage.read
        - history.read
        - event.read
        - agenda.manage
        - admin.meetings.manage
        - admin.units.manage
        - admin.seats.manage
        - admin.roles.manage
        - admin.config.freeze
        - demo.seed
    MeetingStatus:
      type: string
      description: 'Lifecycle of a meeting (Jahrgang): preparation → running → closed (rule table R-MTG, slice 025; the actions come with slice 040)'
      enum: [preparation, running, closed]
    MeetingFormat:
      type: string
      description: >-
        Format profile of the meeting (Formatprofil, register E20 — built on the default, "auf
        Standard gebaut" in slice 023): `presence` (Präsenz-HV), `hybrid`, `virtual`. Default
        `presence`. In 0.3.0 the value is recorded only; the presence rules apply in every format
        until a format-specific slice (068) reads it.
      enum: [presence, hybrid, virtual]
      default: presence
    Meeting:
      type: object
      required: [id, title, date, status, currentRound, counts]
      properties:
        id: { type: string, description: 'The meeting id (`meetingId` on speakers, contributions, questions and events)' }
        title: { type: string, examples: ['Ordentliche Hauptversammlung 2027'] }
        legalEntity: { type: string }
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/MeetingStatus' }
        format: { $ref: '#/components/schemas/MeetingFormat' }
        currentRound: { type: integer, minimum: 1 }
        version: { type: integer, description: 'Since 0.3.0 (slice 040): optimistic-locking counter for administration writes, also the ETag of `GET /meetings/{meetingId}`' }
        clonedFromMeetingId: { type: string, description: 'Since 0.3.0 (slice 040): set when the master data was cloned from an earlier meeting' }
        configFrozenAt: { type: string, format: date-time, description: 'Since 0.3.0 (slice 040): set by the configuration freeze' }
        configHash: { type: string, description: 'Since 0.3.0 (slice 040): SHA-256 over rights table, transition table and master data at the freeze' }
        counts:
          type: object
          description: Aggregate counters for the header and the podium
          properties:
            speakers: { type: integer }
            questions: { type: integer }
            open: { type: integer }
            staged: { type: integer }
            delivered: { type: integer }
            byStatus:
              type: object
              description: Questions per workflow status (drives the process strip in the header)
              additionalProperties: { type: integer }
            byUnit:
              type: object
              description: 'Since 0.3.0 (slice 040): open questions per answering unit, keyed by `unitId`'
              additionalProperties: { type: integer }
            bySeat:
              type: object
              description: 'Since 0.3.0 (slice 040): staged questions per podium seat, keyed by `seatId`'
              additionalProperties: { type: integer }
    MeetingCreate:
      type: object
      description: 'Since 0.3.0 (slice 040): body of `createMeeting`'
      required: [title, date]
      properties:
        title: { type: string, minLength: 1 }
        date: { type: string, format: date }
        legalEntity: { type: string }
        format: { $ref: '#/components/schemas/MeetingFormat' }
        cloneFromMeetingId: { type: string, description: 'Copy agenda items, units and podium seats from this meeting (Jahrgang klonen)' }
    AgendaItem:
      type: object
      required: [id, number, title]
      properties:
        id: { type: string }
        number: { type: integer }
        title: { type: string }
        openedAt: { type: string, format: date-time, description: 'Since 0.3.0 (slice 025): set by `AgendaItemOpened`' }
        votingOpenedAt: { type: string, format: date-time, description: 'Since 0.3.0 (slice 025): set by `VotingOpened`' }
        votingClosedAt: { type: string, format: date-time, description: 'Since 0.3.0 (slice 025): set by `VotingClosed`' }
    AgendaItemInput:
      type: object
      description: 'Since 0.3.0 (slice 040): one item of `replaceMeetingAgendaItems`; without `id` the server assigns one'
      required: [number, title]
      properties:
        id: { type: string }
        number: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1 }
    Unit:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        shortName: { type: string }
    UnitInput:
      type: object
      description: 'Since 0.3.0 (slice 040): one item of `replaceMeetingUnits`; without `id` the server assigns one'
      required: [name]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1 }
        shortName: { type: string }
    StageSeat:
      type: object
      description: >-
        Since 0.3.0 (slice 040, ADR 0006): a podium seat (Bühnenplatz) of a meeting. Replaces the
        `StageAssignment` enum; the four enum values are the ids of the default seats in the seed
        (`supervisory_board_chair`, `ceo`, `cfo`, `board_member`). `personId` and `deviceId` let the
        service resolve which queue a podium device sees; the client never states its seat.
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string, description: 'Display label, e.g. "Vorstandsvorsitz"' }
        personId: { type: string }
        deviceId: { type: string }
        position: { type: integer, minimum: 1, description: Order on the podium }
    StageSeatInput:
      type: object
      description: 'Since 0.3.0 (slice 040): one item of `replaceMeetingStageSeats`; without `id` the server assigns one'
      required: [label]
      properties:
        id: { type: string }
        label: { type: string, minLength: 1 }
        personId: { type: string }
        deviceId: { type: string }
        position: { type: integer, minimum: 1 }
    RoleAssignment:
      type: object
      description: 'Since 0.3.0 (slice 026, ADR 0004): one row of the administered assignment table, projected from `RoleAssigned`/`RoleRevoked`'
      required: [id, meetingId, subjectId, role, assignedAt, assignedBy]
      properties:
        id: { type: string }
        meetingId: { type: string }
        subjectId: { type: string, description: 'Subject of the identity provider (pseudonymous id), or the demo actor id' }
        personId: { type: string, description: 'Key into the person table (ADR 0009), when known' }
        role: { $ref: '#/components/schemas/Role' }
        unitId: { type: string, description: 'Binds the role to one answering unit (optional)' }
        expiresAt: { type: string, format: date-time, description: 'Defaults to the end of the meeting; the role vanishes afterwards (auto-expiry)' }
        deputyForSubjectId: { type: string, description: 'Set when this assignment is one of the two deputies of another holder (slice 040)' }
        assignedAt: { type: string, format: date-time }
        assignedBy: { $ref: '#/components/schemas/Actor' }
        revokedAt: { type: string, format: date-time }
        revokedBy: { $ref: '#/components/schemas/Actor' }
    RoleAssignmentCreate:
      type: object
      description: 'Since 0.3.0 (slice 026): body of `assignRole`'
      required: [subjectId, role]
      properties:
        subjectId: { type: string, minLength: 1 }
        personId: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        unitId: { type: string }
        expiresAt: { type: string, format: date-time }
        deputyForSubjectId: { type: string }
    ConfigFreeze:
      type: object
      description: 'Since 0.3.0 (slice 040): result of `freezeMeetingConfig`, also mirrored on `Meeting.configFrozenAt`/`configHash`'
      required: [meetingId, frozenAt, frozenBy, configHash]
      properties:
        meetingId: { type: string }
        frozenAt: { type: string, format: date-time }
        frozenBy: { $ref: '#/components/schemas/Actor' }
        configHash: { type: string }
    Session:
      type: object
      description: 'Since 0.3.0 (slice 029): response of `GET /auth/me`'
      required: [actor]
      properties:
        actor: { $ref: '#/components/schemas/Actor' }
        subjectId: { type: string }
        personId: { type: string }
        roles: { type: array, items: { $ref: '#/components/schemas/Role' }, description: 'All roles from the assignment table valid now; `actor.role` is the active one' }
        expiresAt: { type: string, format: date-time, description: 'Session expiry (14 h with silent refresh, ADR 0004); absent for the demo actor' }
        idpGroups: { type: array, items: { type: string }, description: 'Groups reported by the identity provider — a suggestion for the administrator, never a role by itself (ADR 0004)' }
        csrfToken: { type: string, description: 'Token to send in the `X-CSRF-Token` header on state-changing calls under the `session` scheme (slice 029)' }
    TransparencyNotice:
      type: object
      description: 'Since 0.3.0 (slice 029): transparency notice (Transparenzhinweis, Art. 13 GDPR) for the sign-in page; text from configuration, two languages (rule 10); legal review pending (E15)'
      required: [version, text]
      properties:
        version: { type: string, description: 'Version of the configured text, shown next to it' }
        updatedAt: { type: string, format: date-time }
        text:
          type: object
          required: [de, en]
          properties:
            de: { type: string }
            en: { type: string }
        dataProtectionSummaryUrl: { type: string, format: uri, description: 'Link to the summary of the data protection impact assessment (DSFA) shown on the sign-in page (slice 030)' }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Readiness:
      type: object
      description: 'Since 0.3.0 (slice 033): readiness with one entry per check (`clock` for the NTP status; `db` and `migrations` from slice 027)'
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          additionalProperties:
            type: object
            required: [status]
            properties:
              status: { type: string, enum: [ok, fail] }
              code: { $ref: '#/components/schemas/ReadinessCheckCode' }
        serverTime: { type: string, format: date-time }
    ReadinessCheckCode:
      type: string
      description: >-
        Since 0.3.0 (slice 033): why a check failed, as a code — never free text, because `/readyz`
        answers without credential and a hostname, a port or a driver error string would leak (review
        023). Codes may be added in a later minor version; clients ignore unknown ones.
      enum: [not_configured, unreachable, timeout, migrations_pending, clock_unsynced, clock_drift]
    SpeakerStatus:
      type: string
      enum: [waiting, speaking, finished, withdrawn]
    Speaker:
      type: object
      # `kind` left the `required` list in 0.2.0 (deprecated, see below); enum and range stay so the
      # existing 422 validation keeps its meaning until slice 080 removes both fields.
      required: [id, number, displayName, round, position, status, version]
      properties:
        id: { type: string }
        meetingId: { type: string, description: 'Since 0.3.0 (slice 025): the meeting this request to speak belongs to. Pflicht ab 0.3.1, Scheibe 028.' }
        number: { type: integer, description: Running number of the request to speak }
        displayName: { type: string, description: Pseudonym in the demo; real name only via the register interface }
        personId: { type: string, description: 'Since 0.3.0 (slice 026, ADR 0009): key into the person table; the clear name is resolved on read for holders of `question.identity.reveal`' }
        organisation: { type: string }
        kind:
          type: string
          enum: [shareholder, proxy, association]
          deprecated: true
          description: >-
            Kind of speaker (Art). Deprecated — veraltet seit 0.2.0, entfällt in 080 (Feedback #15).
        round: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/SpeakerStatus' }
        requestedMinutes:
          type: integer
          deprecated: true
          description: >-
            Requested speaking time (Redezeit). Deprecated — veraltet seit 0.2.0, entfällt in 080 (Feedback #15).
        speakingStartedAt: { type: string, format: date-time }
        speakingEndedAt: { type: string, format: date-time }
        questionCount: { type: integer }
        version: { type: integer }
        _actions: { type: array, items: { $ref: '#/components/schemas/Action' } }
    SpeakerRegistration:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1 }
        organisation: { type: string }
        kind:
          type: string
          enum: [shareholder, proxy, association]
          deprecated: true
          description: >-
            Kind of speaker (Art). Deprecated — veraltet seit 0.2.0, entfällt in 080 (Feedback #15).
            No longer required since 0.2.0; the enum stays so an out-of-enum value is still a 422.
        round: { type: integer, minimum: 1 }
        requestedMinutes:
          type: integer
          minimum: 1
          deprecated: true
          description: >-
            Requested speaking time (Redezeit). Deprecated — veraltet seit 0.2.0, entfällt in 080 (Feedback #15).
    SpeakerUpdate:
      type: object
      properties:
        status: { $ref: '#/components/schemas/SpeakerStatus' }
        round: { type: integer, minimum: 1 }
        requestedMinutes:
          type: integer
          minimum: 1
          deprecated: true
          description: >-
            Requested speaking time (Redezeit). Deprecated — veraltet seit 0.2.0, entfällt in 080 (Feedback #15).
    SpeakerOrder:
      type: object
      description: Body of `reorderSpeakers` / `reorderMeetingSpeakers`
      required: [round, speakerIds]
      properties:
        round: { type: integer, minimum: 1 }
        speakerIds: { type: array, items: { type: string } }
    TextSpan:
      type: object
      description: Character offsets into the contribution text, half-open interval
      required: [start, end]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
    OccurredAtSource:
      type: string
      description: >-
        Since 0.3.0 (ADR 0011, B4): who stated `occurredAt`. Only `server` is authoritative
        (`recordedAt`, the server clock); `device` (a podium or capture device, e.g. an offline
        intention), `paper` (paper path: the time written on the sheet) and `transcript` (the
        transcription tool's timecode) are statements of the sender and are labelled as such in every
        export. A statement in the future is rejected (422).
      enum: [server, device, paper, transcript]
    RetentionClass:
      type: string
      description: >-
        Since 0.3.0 (ADR 0009, register E16): `record` (Niederschrift-relevant), `working` (working
        data), `technical`. Retention periods per class are a pending decision of legal and the data
        protection officer; until then nothing is deleted (no deletion logic in the beta).
      enum: [record, working, technical]
    Claim:
      type: object
      description: 'Since 0.3.0 (slice 028, E36): who took over a speech or question (Übernahme, weiche Sperre) and until when'
      required: [actorId, claimedAt, expiresAt]
      properties:
        actorId: { type: string }
        personId: { type: string }
        claimedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: 'Expiry releases the claim without any further event' }
    Contribution:
      type: object
      required: [id, speakerId, text, capturedAt, questionIds, coverage]
      properties:
        id: { type: string }
        meetingId: { type: string, description: 'Since 0.3.0 (slice 025). Pflicht ab 0.3.1, Scheibe 028.' }
        speakerId: { type: string }
        text: { type: string }
        capturedAt: { type: string, format: date-time, description: 'Server time of the capture (the same instant as the event''s `recordedAt`)' }
        occurredAt: { type: string, format: date-time, description: 'Since 0.3.0 (ADR 0011): the sender''s statement of when the speech happened, when it differs from `capturedAt` (paper, transcript, device)' }
        occurredAtSource: { $ref: '#/components/schemas/OccurredAtSource' }
        source:
          type: string
          enum: [manual, transcript, paper]
          default: manual
          description: 'Where the text came from. `paper` since 0.3.0 (paper path, slice 025; produced only through `captureMeetingContribution`) — a response-enum widening, see "Compatibility" in info.description.'
        questionIds: { type: array, items: { type: string } }
        coverage:
          type: object
          description: How much of the text is covered by captured questions (Restabdeckung)
          required: [coveredRatio, uncovered]
          properties:
            coveredRatio: { type: number, minimum: 0, maximum: 1 }
            uncovered: { type: array, items: { $ref: '#/components/schemas/TextSpan' } }
        version: { type: integer, description: 'Since 0.3.0 (slice 028): optimistic-locking counter, also the ETag. Pflicht ab 0.3.1, Scheibe 028.' }
        claim: { $ref: '#/components/schemas/Claim' }
        _actions:
          type: array
          description: 'Since 0.3.0: actions the calling actor may perform on this speech right now (claim, release, capture questions)'
          items: { $ref: '#/components/schemas/Action' }
    ContributionCapture:
      type: object
      description: >-
        Body of `captureContribution` (alias). Unchanged since 0.1.0 on purpose: the service validates
        requests against this document, so the paper path and the sender's time statement live only on
        `MeetingContributionCapture` (`captureMeetingContribution`, slice 025) until the core handles
        them (review 023).
      required: [speakerId, text]
      properties:
        speakerId: { type: string }
        text: { type: string, minLength: 1 }
        source: { type: string, enum: [manual, transcript] }
    MeetingContributionCapture:
      type: object
      description: >-
        Since 0.3.0 (slice 025): body of `captureMeetingContribution` — `ContributionCapture` plus the
        paper path (`source: paper`, Papierpfad) and the sender's time statement (ADR 0011). A stated
        `occurredAt` never becomes `recordedAt`; a value in the future is a 422. `occurredAt` and
        `occurredAtSource` come together or not at all (`dependentRequired` in both directions,
        enforced by the service's Ajv validator; the generated TypeScript types cannot express it).
      required: [speakerId, text]
      properties:
        speakerId: { type: string }
        text: { type: string, minLength: 1 }
        source: { type: string, enum: [manual, transcript, paper], description: '`paper` = paper path (Papierpfad, slice 025)' }
        occurredAt: { type: string, format: date-time, description: 'The sender''s statement of when the speech happened' }
        occurredAtSource:
          type: string
          enum: [device, paper, transcript]
          description: 'Source of the stated `occurredAt`; a client cannot claim `server`'
      dependentRequired:
        occurredAt: [occurredAtSource]
        occurredAtSource: [occurredAt]
    Track:
      type: string
      description: >
        The three answer tracks (Antwortpfade). `podium` = free answer by the board (Pfad A),
        `fast_track` = reference to an existing publication (Pfad B), `expert_track` = specialist
        answer followed by legal clearing (Pfad C).
      enum: [podium, fast_track, expert_track]
    StageAssignment:
      type: string
      deprecated: true
      description: >-
        Who answers on the podium (Bühnenzuordnung). Deprecated — veraltet seit 0.3.0, entfällt mit
        Vertrag 0.5 (ADR 0006): replaced by the podium seat list `StageSeat` and `seatId`; the four
        values are the ids of the default seats in the seed, so a value here equals the `seatId` of
        that default seat. Removal is a 0.5 matter (no slice in Plan 5 names it yet); slice 040 builds
        the seat list, the interface follows in 056.
      enum: [supervisory_board_chair, ceo, cfo, board_member]
    QuestionStatus:
      type: string
      description: >
        Workflow status. Transitions are defined as data in the domain transition table; the
        interface never hard-codes them.
      enum:
        - captured
        - classified
        - assigned
        - answer_drafted
        - in_review
        - approved
        - staged
        - delivered
        - closed
        - withdrawn
        - merged
    AnswerVersion:
      type: object
      required: [version, text, createdAt, createdBy]
      properties:
        version: { type: integer, minimum: 1 }
        text: { type: string }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/Actor' }
        sources:
          type: array
          description: References the answer relies on (publication, catalogue entry, document)
          items: { type: string }
    Approval:
      type: object
      required: [answerVersion, approvedAt, approvedBy]
      properties:
        answerVersion: { type: integer }
        approvedAt: { type: string, format: date-time }
        approvedBy: { $ref: '#/components/schemas/Actor' }
    Question:
      type: object
      required: [id, number, contributionId, speakerId, text, status, answers, version, createdAt, updatedAt, _actions]
      properties:
        id: { type: string }
        meetingId: { type: string, description: 'Since 0.3.0 (slice 025): question numbers F-n restart per meeting. Pflicht ab 0.3.1, Scheibe 028.' }
        number: { type: string, examples: ['F-0417'] }
        contributionId: { type: string }
        speakerId: { type: string }
        speakerDisplayName: { type: string }
        text: { type: string }
        span: { $ref: '#/components/schemas/TextSpan' }
        status: { $ref: '#/components/schemas/QuestionStatus' }
        track: { $ref: '#/components/schemas/Track' }
        agendaItemId: { type: string }
        stageAssignment:
          deprecated: true
          description: 'Deprecated — veraltet seit 0.3.0, entfällt mit Vertrag 0.5: use `seatId` (ADR 0006)'
          allOf: [ { $ref: '#/components/schemas/StageAssignment' } ]
        seatId: { type: string, description: 'Since 0.3.0 (slice 040, ADR 0006): the podium seat (Bühnenplatz) that answers; one of `listMeetingStageSeats`' }
        unitId: { type: string }
        claim: { $ref: '#/components/schemas/Claim' }
        answers: { type: array, items: { $ref: '#/components/schemas/AnswerVersion' } }
        approval: { $ref: '#/components/schemas/Approval' }
        returnReason: { type: string }
        stagePosition: { type: integer }
        deliveredAt: { type: string, format: date-time }
        mergedIntoId: { type: string }
        version: { type: integer, description: 'Optimistic-locking counter, also the ETag' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        _actions:
          type: array
          description: Actions the calling actor may perform on this question right now
          items: { $ref: '#/components/schemas/Action' }
    QuestionCapture:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        span: { $ref: '#/components/schemas/TextSpan' }
    Classification:
      type: object
      required: [track]
      properties:
        track: { $ref: '#/components/schemas/Track' }
        agendaItemId: { type: string }
        stageAssignment:
          deprecated: true
          description: 'Deprecated — veraltet seit 0.3.0, entfällt mit Vertrag 0.5 (ADR 0006). Its successor `Classification.seatId` arrives with 0.4.0 (slice 043, ahead of 040): not in 0.3.0, because the unchanged service would accept and silently drop it today (review 023). `Question.seatId` is already declared on the response.'
          allOf: [ { $ref: '#/components/schemas/StageAssignment' } ]
    AnswerDraft:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1 }
        sources: { type: array, items: { type: string } }
    StageView:
      type: object
      required: [current, queue, deliveredCount, openCount]
      properties:
        current:
          oneOf:
            - { $ref: '#/components/schemas/Question' }
            - { type: 'null' }
        queue: { type: array, items: { $ref: '#/components/schemas/Question' } }
        deliveredCount: { type: integer }
        openCount: { type: integer }
    QuestionLegalClearedPayload:
      type: object
      description: >
        Payload of `QuestionLegalCleared` (since 0.2.0): legal (Recht) has cleared one answer version
        (Rechtsfreigabe). The clearing is bound to that version like the approval is; it is a
        recommendation, not the approval itself, which stays with `question.approve` (register E25).
        Emitted by the core from slice 021; no operation of its own yet (it is declared through the
        allowlist when 021 needs it).
      required: [questionId, answerVersion]
      properties:
        questionId:
          type: string
          description: Same value as the event's `subjectId`, repeated so the payload is self-contained for neighbouring systems
        answerVersion: { type: integer, minimum: 1, description: The answer version the clearing is bound to }
        note: { type: string, description: Optional remark of the clearing lawyer (Anmerkung) }
    AgendaItemEventPayload:
      type: object
      description: 'Since 0.3.0 (slice 025): payload of `AgendaItemOpened`, `VotingOpened` and `VotingClosed`; the event''s `subjectId` is the meeting'
      required: [agendaItemId]
      properties:
        agendaItemId: { type: string }
        number: { type: integer, description: 'Agenda item number at the time of the event, for readers without the master data' }
    RoleAssignmentEventPayload:
      type: object
      description: 'Since 0.3.0 (slice 026, ADR 0004): payload of `RoleAssigned` and `RoleRevoked`; the event''s `subjectId` is the assignment id'
      required: [assignmentId, subjectId, role]
      properties:
        assignmentId: { type: string }
        subjectId: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        unitId: { type: string }
        expiresAt: { type: string, format: date-time }
        reason: { type: string, description: 'Revocation reason, when given' }
    PiiEnvelope:
      type: object
      description: >-
        Since 0.3.0 (slice 024, ADR 0009/0011): the only part of a payload that may carry personal
        data. `keyId` names the key of the meeting (per Jahrgang) behind the codec port; in the beta
        the codec is the identity codec, but `keyId` is set from the first event so switching the key
        on later is an export into a new database, never a change to the log. Every other field of the
        payload is free of personal data; events carry `personId`, never a clear name.
      required: [keyId]
      properties:
        keyId: { type: string }
      additionalProperties: true
    Event:
      type: object
      description: >
        One immutable fact. The sequence number is global and gap-free. Payload schemas are bound per
        event type additively: `QuestionLegalCleared` carries `QuestionLegalClearedPayload`,
        `AgendaItemOpened`/`VotingOpened`/`VotingClosed` carry `AgendaItemEventPayload`,
        `RoleAssigned`/`RoleRevoked` carry `RoleAssignmentEventPayload` (bound with nested
        `if`/`then`/`else`, invisible to the generated types); every other type keeps the open object.
        Envelope v2 (Umschlag, since 0.3.0, ADR 0011, filled by slice 024): `schemaVersion`,
        `meetingId`, `idempotencyKey`, `causationId`, `prevHash`/`hash` (SHA-256 over canonical JSON of
        the envelope without `hash`), `recordedAt` (authoritative, server clock), `occurredAt` with
        `occurredAtSource`, `retentionClass`, `legalHold`, `personId`, `payload.pii` with `keyId`. All
        of them optional in 0.3.0; the ones marked "Pflicht ab 0.3.1" become required with slice 028.
        A broken chain is a load error naming the `seq` (slice 024).
      required: [seq, id, type, at, actor, payload]
      properties:
        seq: { type: integer }
        id: { type: string }
        type:
          type: string
          enum:
            - MeetingCreated
            - SpeakerRegistered
            - SpeakersReordered
            - SpeakerUpdated
            - ContributionCaptured
            - ContributionClaimed
            - ContributionReleased
            - QuestionCaptured
            - QuestionClassified
            - QuestionAssigned
            - QuestionClaimed
            - QuestionReleased
            - AnswerDrafted
            - QuestionSubmittedForReview
            - QuestionLegalCleared
            - QuestionApproved
            - QuestionReturned
            - QuestionStaged
            - QuestionDelivered
            - QuestionClosed
            - QuestionWithdrawn
            - QuestionMerged
            - AgendaItemOpened
            - VotingOpened
            - VotingClosed
            - RoleAssigned
            - RoleRevoked
            - ConfigFrozen
        at: { type: string, format: date-time, description: 'Recorded time (server clock). Since 0.3.0 the same instant as `recordedAt`, which is the name ADR 0011 gives it; `at` stays for 0.x readers.' }
        actor: { $ref: '#/components/schemas/Actor' }
        subjectId: { type: string, description: Id of the aggregate the event belongs to }
        schemaVersion: { type: integer, minimum: 1, description: 'Since 0.3.0: envelope version, `2` from slice 024 (v1 events exist only in JSONL dev data and are upcast on load). Pflicht ab 0.3.1, Scheibe 028.' }
        meetingId: { type: string, description: 'Since 0.3.0 (ADR 0011): the meeting (Jahrgang) the event belongs to. Pflicht ab 0.3.1, Scheibe 028.' }
        idempotencyKey: { type: string, description: 'Since 0.3.0: the `Idempotency-Key` of the write that produced the event, when the client sent one; replays after a restart are answered from it (slice 028)' }
        causationId: { type: string, description: 'Since 0.3.0: id of the event that caused this one (e.g. the intention a podium device buffered offline), when any' }
        prevHash: { type: string, description: 'Since 0.3.0: `hash` of the previous event in the global chain; the first event carries the empty string. Pflicht ab 0.3.1, Scheibe 028.' }
        hash: { type: string, description: 'Since 0.3.0: SHA-256 (hex) over the canonical JSON of this envelope without `hash`. Pflicht ab 0.3.1, Scheibe 028.' }
        recordedAt: { type: string, format: date-time, description: 'Since 0.3.0 (ADR 0011): the authoritative time, always from the server clock (injected clock port, rule 8); never a device time. Pflicht ab 0.3.1, Scheibe 028.' }
        occurredAt: { type: string, format: date-time, description: 'Since 0.3.0: when the fact happened according to `occurredAtSource`; equals `recordedAt` for source `server`. Pflicht ab 0.3.1, Scheibe 028.' }
        occurredAtSource:
          description: 'Pflicht ab 0.3.1, Scheibe 028.'
          allOf: [ { $ref: '#/components/schemas/OccurredAtSource' } ]
        retentionClass:
          description: 'Pflicht ab 0.3.1, Scheibe 028.'
          allOf: [ { $ref: '#/components/schemas/RetentionClass' } ]
        legalHold: { type: boolean, description: 'Since 0.3.0 (ADR 0009): `false` in the beta; a hold is set by a later event, never by editing this one. Pflicht ab 0.3.1, Scheibe 028.' }
        personId: { type: string, description: 'Since 0.3.0 (ADR 0009): the person the event is about (e.g. the speaker), as a key into the person table; masked in the standard read path (ADR 0013, `event.read.personal` from slice 047)' }
        payload:
          type: object
          additionalProperties: true
          properties:
            pii: { $ref: '#/components/schemas/PiiEnvelope' }
      if: { required: [type], properties: { type: { const: QuestionLegalCleared } } }
      then: { properties: { payload: { $ref: '#/components/schemas/QuestionLegalClearedPayload' } } }
      else:
        if: { required: [type], properties: { type: { enum: [AgendaItemOpened, VotingOpened, VotingClosed] } } }
        then: { properties: { payload: { $ref: '#/components/schemas/AgendaItemEventPayload' } } }
        else:
          if: { required: [type], properties: { type: { enum: [RoleAssigned, RoleRevoked] } } }
          then: { properties: { payload: { $ref: '#/components/schemas/RoleAssignmentEventPayload' } } }

  # ---- sign-in through the BFF (ADR 0004) — outside /v1 ---------------------------------------------
  /auth/login:
    servers: [ { url: /, description: 'Outside /v1: browser navigation, not an API call' } ]
    get:
      tags: [auth]
      operationId: login
      summary: Start the sign-in (Anmeldung) — redirects the browser to the identity provider
      description: >-
        Since 0.3.0 (slice 029, ADR 0004). Authorization Code flow runs server-side with a
        confidential client; the browser is redirected to the identity provider and never sees a
        token. Since 0.3.7 (slice 029b), the redirect also sets a host-only `hv_auth_state` browser
        correlation cookie for the callback; it is distinct from the server-side OIDC state and
        expires within five minutes. No credential needed (`security: []`). `503` when no identity provider or no readable DE/EN transparency notice is configured
        (demo, `HV_DEMO=1`: the header `X-Actor` is the sign-in); `422` when `returnTo` is longer than
        512 characters. A `2xx` response does not exist for this operation by design (lint warning
        accepted, see CHANGELOG 0.3.0).
      security: []
      parameters:
        - name: returnTo
          in: query
          description: >-
            Relative path inside the application to return to after sign-in (open-redirect guard). Too
            long (over 512 characters) → 422, because the length limit protects the service and the
            state it keeps for the round trip; a foreign target → ignored: the service keeps the value
            only when it matches `SameOriginPath` — the same rule the `Location` of `completeLogin` is
            bound to — and otherwise redirects to `/`, so a stale bookmark never ends on an error page
            (architect's addendum after Codex on 2779e0b).
          schema: { type: string, maxLength: 512 }
      responses:
        '302':
          description: Redirect to the identity provider
          headers:
            # The identity provider's authorization URL from the configuration (slice 029). Not bound to
            # `https:` because the local and e2e Keycloak (031) runs on plain http on localhost.
            Location: { required: true, schema: { type: string, format: uri } }
            Set-Cookie:
              required: true
              x-required-cookie-lines: [hv_auth_state]
              description: >-
                Exactly one `Set-Cookie` header line for the short-lived browser correlation value.
                It is host-only, HttpOnly, Secure, SameSite=Lax and scoped to `/auth/callback`;
                no session is established by login. Validate each line through `Headers.getSetCookie()`.
              schema: { $ref: '#/components/schemas/AuthStateCookieLine' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Server-Time: { $ref: '#/components/headers/X-Server-Time' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/callback:
    servers: [ { url: /, description: 'Outside /v1: the identity provider redirects the browser here' } ]
    get:
      tags: [auth]
      operationId: completeLogin
      summary: Complete the sign-in — exchanges the code, sets the session cookie, redirects into the application
      description: >-
        Since 0.3.0 (slice 029). Validates `state`, exchanges `code` server-side, checks issuer,
        audience, expiry and signature (JWKS), resolves the roles from the assignment table (slice
        026; identity-provider groups are a suggestion only) and sets the HttpOnly `session` cookie.
        Since 0.3.7 (slice 029b), the callback also requires the browser-bound `hv_auth_state`
        correlation cookie set by login, consumes its server-side state atomically and clears the
        correlation cookie in a separate `Set-Cookie` header line.
        `400` on an invalid or replayed `state`/`code`; `403` when the subject has no role in any
        open meeting; `503` when no identity provider or no readable DE/EN transparency notice is configured. No `2xx` by design. The call
        carries no credential yet, so no problem `detail` names the subject, its e-mail address or
        the identity provider's error text (ADR 0009; prose, Codex round 5).
      security: []
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        '302':
          description: Signed in; redirect to `returnTo` or the application root
          headers:
            # Codex on 50cc738 (SECURITY): only a same-origin path, never an absolute or
            # protocol-relative URL — the open-redirect guard of `returnTo` as a schema.
            Location:
              required: true
              description: '`returnTo` of `login` when it matched `SameOriginPath`, else `/`'
              schema: { $ref: '#/components/schemas/SameOriginPath' }
            # Codex on 8ef3ad2: a 302 without the cookie would be a sign-in that signed no one in.
            Set-Cookie:
              required: true
              x-required-cookie-lines: [hv_session, hv_auth_state]
              description: >-
                Exactly two separate `Set-Cookie` header lines: one live `hv_session` cookie of the
                `session` scheme (ADR 0004), and one clearing `hv_auth_state` cookie with the same
                host-only `/auth/callback` scope used by login. Validate each line independently and
                require exactly one of each name through `Headers.getSetCookie()`; never parse the
                comma-joined `Headers.get()` value. The session value is at least 32 cookie octets
                (an unguessable session id, never empty), and the attributes `HttpOnly`, `Secure` and
                `SameSite=Lax` or `SameSite=Strict` are all present in any order (lookaheads); a
                `Max-Age=0` or negative `Max-Age` (a deleting cookie) is rejected. Codex on f611116:
                `Path=/` is required and no other `Path` may follow (set from `/auth/callback`, a cookie
                without it would be scoped to `/auth` and never reach `/v1`); `Domain` is forbidden
                (host-only cookie: no sibling or parent host receives the session); a second `SameSite`
                other than `Lax`/`Strict` is forbidden (the browser keeps the last one). Required
                attributes in the canonical case the service writes (a lower-case variant is rejected,
                never admitted); forbidden attributes in any case (RFC 6265 names are case-insensitive,
                so `domain=` cannot slip through). Codex on 929d0d7 (SECURITY): exactly one session
                cookie per response, never a second one that the browser could apply last. Each
                schema branch describes one header line. As a safety net the value contains no comma
                and no second `hv_session=`, which is possible because `Expires` is forbidden and
                lifetime is expressed only by `Max-Age` (RFC 6265 gives `Max-Age` precedence; `Expires`
                is the only attribute whose value contains a comma). Prose only: the randomness of the
                value.
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/SessionCookieLine' }
                  - { $ref: '#/components/schemas/ClearedAuthStateCookieLine' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Server-Time: { $ref: '#/components/headers/X-Server-Time' }
        '400':
          description: Invalid or replayed authorization response; clears browser correlation
          headers:
            Set-Cookie: { required: true, x-required-cookie-lines: [hv_auth_state], schema: { $ref: '#/components/schemas/ClearedAuthStateCookieLine' } }
            X-Server-Time: { $ref: '#/components/headers/X-Server-Time' }
          content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 400 } } } ] } } }
        '403':
          description: No active role or blocked subject; clears browser correlation
          headers:
            Set-Cookie: { required: true, x-required-cookie-lines: [hv_auth_state], schema: { $ref: '#/components/schemas/ClearedAuthStateCookieLine' } }
            X-Server-Time: { $ref: '#/components/headers/X-Server-Time' }
          content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 403 } } } ] } } }
        '503':
          description: Sign-in unavailable; clears browser correlation
          headers:
            Set-Cookie: { required: true, x-required-cookie-lines: [hv_auth_state], schema: { $ref: '#/components/schemas/ClearedAuthStateCookieLine' } }
            X-Server-Time: { $ref: '#/components/headers/X-Server-Time' }
          content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 503 } } } ] } } }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/logout:
    servers: [ { url: /, description: 'Outside /v1' } ]
    post:
      tags: [auth]
      operationId: logout
      summary: End the session (Abmelden) — clears the cookie and blocks the session id
      description: >-
        Since 0.3.0 (slice 029). Requires the session cookie and the CSRF token; a demo actor has no
        session to end. An empty `X-CSRF-Token` is a 422 (schema `minLength: 1`); a wrong one a 403.
      security: [ { session: [] } ]
      parameters: [ { $ref: '#/components/parameters/CsrfTokenRequired' } ]
      responses:
        '204':
          description: Signed out; the cookie is cleared
          headers:
            # Security sweep after Codex on 50cc738: "the cookie is cleared" as a schema.
            Set-Cookie:
              required: true
              description: >-
                Clears the `hv_session` cookie: empty value and `Max-Age=0`, with the same scope as the
                cookie it replaces — `Path=/` and no `Domain` (Codex on f611116; a browser only overwrites
                a cookie with the same name, path and domain, so a clearing cookie on another path would
                leave the session in place). Exactly one `hv_session` cookie in the response (Codex on
                929d0d7, SECURITY): a clearing cookie followed by a live replacement would sign the user
                back in; validated per header line, and as a safety net no comma, no second
                `hv_session=` and no `Expires` in the value (`Max-Age=0` only). Blocking the session id
                server-side (block list) is prose — it is not visible in the response.
              schema: { type: string, pattern: '^hv_session=(?=;|$)(?!.*,)(?!.*hv_session=)(?!.*;\s*[Ee][Xx][Pp][Ii][Rr][Ee][Ss]=)(?=.*;\s*Max-Age=0\s*(?:;|$))(?=.*;\s*Path=/\s*(?:;|$))(?!.*;\s*[Pp][Aa][Tt][Hh]=(?!/\s*(?:;|$)))(?!.*;\s*[Dd][Oo][Mm][Aa][Ii][Nn]=)' }
            Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
            X-Server-Time: { $ref: '#/components/headers/X-Server-Time' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/me:
    servers: [ { url: /, description: 'Outside /v1' } ]
    get:
      tags: [auth]
      operationId: getSession
      summary: Who am I — the signed-in actor, roles from the assignment table, session expiry
      description: >-
        Since 0.3.0 (slice 029). In the demo this is the `X-Actor` identity. `idpGroups` lists the
        identity provider's groups as a suggestion for the administrator; they never become a role by
        themselves (ADR 0004). `csrfToken` is sent as `X-CSRF-Token` on state-changing calls under the
        `session` scheme (slice 029; parameter `CsrfToken`).
      responses:
        '200': { description: 'OK — carries the CSRF token, so never stored by a cache', headers: { Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/NoActiveRole' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /auth/transparency-notice:
    servers: [ { url: /, description: 'Outside /v1: read before sign-in' } ]
    get:
      tags: [auth]
      operationId: getTransparencyNotice
      summary: Transparency notice (Transparenzhinweis, Art. 13 GDPR — unverified, E15) for the sign-in page
      description: >-
        Since 0.3.0 (slice 029; shown by the sign-in page of slice 030 in German and English). The
        text is deployment configuration, not contract content; it is readable without any credential
        (`security: []`) because it is displayed before sign-in. Legal review of the text is pending
        (register E15): the interface shows it as unverified until then.
      security: []
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/TransparencyNotice' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  # ---- platform (ADR 0013) — outside /v1 --------------------------------------------------------
  /healthz:
    servers: [ { url: /, description: 'Outside /v1: platform probe' } ]
    get:
      tags: [operations]
      operationId: getHealth
      summary: Liveness — the process answers
      description: 'Since 0.3.0 (slice 033). No credential (`security: []`), no data beyond `status`.'
      security: []
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /readyz:
    servers: [ { url: /, description: 'Outside /v1: platform probe' } ]
    get:
      tags: [operations]
      operationId: getReadiness
      summary: Readiness — clock/NTP status (slice 033), database and migration state (slice 027)
      description: >-
        Since 0.3.0; implemented in slice 027. No credential (`security: []`). `503` with the same
        body when a check fails; the deploy smoke test of slice 037 rolls back on it.
      security: []
      responses:
        # The status in the body agrees with the HTTP status (Codex on PR #25).
        # Codex round 5: `ready` also means every check is `ok`; `not_ready` means at least one is `fail`.
        '200':
          description: Ready — every check is `ok`
          headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Readiness' }
                  - type: object
                    properties:
                      status: { const: ready }
                      checks: { type: object, additionalProperties: { type: object, properties: { status: { const: ok } } } }
        '503':
          description: Not ready — at least one check is `fail`
          headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/Readiness' }
                  - type: object
                    properties:
                      status: { const: not_ready }
                      checks:
                        type: object
                        anyOf:
                          - { required: [clock], properties: { clock: { type: object, properties: { status: { const: fail } } } } }
                          - { required: [db], properties: { db: { type: object, properties: { status: { const: fail } } } } }
                          - { required: [migrations], properties: { migrations: { type: object, properties: { status: { const: fail } } } } }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  /metrics:
    servers: [ { url: /, description: 'Outside /v1: scraped by the monitoring stack' } ]
    get:
      tags: [operations]
      operationId: getMetrics
      summary: Metrics in Prometheus text exposition format — five business indicators and one technical count without labels, none per person
      description: >-
        Since 0.3.0 (slice 033, ADR 0013). Exactly the indicators of the generated evaluation
        catalogue: five business indicators (age of the oldest open question, backlog per unit,
        inflow per 5 min, questions in legal clearing > 10 min, events per minute) and one technical
        count without labels (`hv_auth_no_active_role_total`, since 0.3.9: responses 403 for a
        session without an active role, process-local, detection signal of slice 030); no indicator
        per person, ever (allowlist gate of slice 033b). Without a configured token every call is
        answered 401. Protected by the `metricsBearer` token from the service configuration: the
        consumer is the scraper, not an actor, so no `can()` decision and no `_actions` apply.
      security: [ { metricsBearer: [] } ]
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { text/plain: { schema: { type: string, description: 'Prometheus text exposition format 0.0.4' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
  # ---- demo -----------------------------------------------------------------------------------------
  /demo/seed:
    post:
      tags: [demo]
      operationId: seedDemo
      summary: Replace all data with a synthetic corpus (demo only)
      x-demo-only: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                questions: { type: integer, minimum: 0, maximum: 5000, default: 800 }
                seed: { type: integer, default: 2027 }
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PersistenceBusy' }
components:
  securitySchemes:
    demoActor:
      type: apiKey
      in: header
      name: X-Actor
      description: >
        Demo stand-in for the sign-in (only with `HV_DEMO=1`, slice 029 refuses the header outside
        the demo). Value `<actorId>:<role>`. The production adapter maps the session to the same
        actor context; nothing else in the system changes.
    session:
      type: apiKey
      in: cookie
      name: hv_session
      description: >
        Since 0.3.0 (ADR 0004, slice 029): HttpOnly, SameSite session cookie issued by
        `GET /auth/callback` after the server-side Authorization Code flow. 14 h with silent refresh,
        idle timeout, block list of subject ids without restart (kill switch). State-changing calls
        additionally send the CSRF token from `GET /auth/me` in the header `X-CSRF-Token`
        (`components/parameters/CsrfToken`, declared on every state-changing operation). The browser
        never holds a token.
    metricsBearer:
      type: http
      scheme: bearer
      description: >
        Since 0.3.0 (slice 033): static bearer token from the service configuration (slice 034),
        only for `GET /metrics`. Authenticates the scraper; it is not an actor.
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://idp.example.invalid/.well-known/openid-configuration
      x-deprecated: true
      description: >
        Deprecated — veraltet seit 0.3.0, entfällt mit Vertrag 0.5: a token in the browser
        contradicts ADR 0004 (the browser never holds a token); production authenticates with the
        `session` cookie issued by the BFF. Kept only so that no consumer of 0.2 breaks; never used by
        any operation. (`x-deprecated` because a security scheme has no `deprecated` field.)
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, minLength: 1, maxLength: 128 }
      description: >-
        Client-generated key. A confirmed replay with the same key returns its original business result after
        current authorization, with current masking and actions. Keys survive a restart from slice 028 (persisted in the event envelope, `Event.idempotencyKey`).
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema: { type: string }
      description: >-
        ETag of the resource the client last saw. Mismatch yields 412. Optional outside the operations explicitly using `IfMatchRequired`. `deliverQuestion`
        retains its optional check until the answer-version hash is introduced in slice 049.
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
      description: >-
        Required from 0.3.6 (slice 028) on this write. The value is the ETag of the resource
        named by the operation; missing yields 428, stale yields 412. `deliverQuestion` remains
        outside this requirement until its answer-version hash check in slice 049.
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: false
      schema: { type: string }
      description: >-
        Since 0.3.0 (slice 029, ADR 0004): the CSRF token from `GET /auth/me` (`SignedInSession.csrfToken`),
        sent on every state-changing call made under the `session` scheme — the double-submit pattern:
        a cross-site form cannot add a custom request header, and a script from another origin forces
        a CORS preflight, so the header's presence plus the value check proves the request came from
        the application. The name `X-CSRF-Token` is the convention most frameworks and the OWASP
        cheat sheet use, so no client library needs configuration. Optional in 0.3.0 (the `session`
        scheme is not live); under `session` a missing or wrong token is 403 from slice 029 (rule id
        defined there — OpenAPI cannot make a header required for one security scheme only, so the
        document keeps it optional and the service decides); under `demoActor` it is ignored.
        Declared on every state-changing operation except `logout`, which takes `CsrfTokenRequired`;
        not on `seedDemo` (demo only).
    CsrfTokenRequired:
      name: X-CSRF-Token
      in: header
      required: true
      schema: { type: string, minLength: 1 }
      description: >-
        Since 0.3.0 (Codex on 8ef3ad2): the same header as `CsrfToken`, required. Used by `logout`,
        the one operation whose only security scheme is `session` — there the token is never optional,
        so generated clients must type it as required. Deliberately no format pattern on the request
        (security sweep after Codex on 50cc738): a wrong token is a 403 with a rule id from slice 029,
        and a 422 naming the expected format would tell a forger what to send. The format binds the
        issuing side instead (`SignedInSession.csrfToken`).
    SpeakerId: { name: speakerId, in: path, required: true, schema: { type: string } }
    ContributionId: { name: contributionId, in: path, required: true, schema: { type: string } }
    QuestionId: { name: questionId, in: path, required: true, schema: { type: string } }
    MeetingId: { name: meetingId, in: path, required: true, schema: { type: string }, description: 'Id of the meeting (Jahrgang), `Meeting.id`' }
    AgendaItemId: { name: agendaItemId, in: path, required: true, schema: { type: string } }
    AssignmentId: { name: assignmentId, in: path, required: true, schema: { type: string } }
    MeetingIdFilter: { name: meetingId, in: query, required: false, schema: { type: string }, description: 'Only events of this meeting (Jahrgangsfilter, ADR 0014); the cursor stays global' }
    After: { name: after, in: query, schema: { type: integer, minimum: 0, default: 0 }, description: 'Last seen global sequence number' }
    StreamAfter:
      name: after
      in: query
      required: false
      schema: { type: integer, minimum: 0, maximum: 9007199254740991 }
      description: >-
        Since 0.3.11 (slice 035a), `/stream` only: the last global sequence number the client has seen.
        No default: without `after` and without `Last-Event-ID` the stream starts at the head (the
        shared `After` parameter with `default: 0` stays for `/events`). A value above the head is
        answered with `reset`; `Last-Event-ID` wins when both are present.
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema: { type: string, pattern: '^[0-9]{1,16}$', maxLength: 16 }
      description: >-
        Sent by the browser on reconnect; the same meaning as `after` (a global sequence number) and
        wins over it. Decimal digits only, at most 16 of them, and at most 9007199254740991 (the largest
        safe integer): a value that is not a non-negative integer, or lies above that bound, is a 422
        (the bound since 0.3.11, slice 035a).
    RoundFilter: { name: round, in: query, schema: { type: integer, minimum: 1 } }
    SpeakerStatusFilter: { name: status, in: query, schema: { $ref: '#/components/schemas/SpeakerStatus' } }
    SpeakerIdFilter: { name: speakerId, in: query, schema: { type: string } }
    QuestionStatusFilter: { name: status, in: query, schema: { type: array, items: { $ref: '#/components/schemas/QuestionStatus' } }, style: form, explode: false }
    TrackFilter: { name: track, in: query, schema: { $ref: '#/components/schemas/Track' } }
    UnitIdFilter: { name: unitId, in: query, schema: { type: string } }
    ContributionIdFilter: { name: contributionId, in: query, schema: { type: string } }
    AgendaItemIdFilter: { name: agendaItemId, in: query, schema: { type: string } }
    FullTextFilter: { name: q, in: query, description: Full-text search over question and answer text, schema: { type: string, maxLength: 200 } }
    QuestionLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 2000, default: 500 } }
    QuestionOffset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
  headers:
    ETag:
      # Entity-tag syntax of RFC 9110 (optionally weak); today's service sends `"v<version>"`.
      schema: { type: string, pattern: '^(?:W/)?"[!#-~]*"$' }
      description: Opaque version tag, changes with every write.
    ETagRequired:
      required: true
      schema: { type: string, pattern: '^(?:W/)?"[!#-~]*"$' }
      description: >-
        Since 0.3.0 (Codex round 5): the same opaque version tag as `ETag`, always sent. Used on the
        responses of operations new in 0.3.0 whose description promises an ETag (meeting, agenda,
        units, seats, freeze, agenda progress, speech claim/release), because the next write sends
        it back as `If-Match`. The 0.2 responses keep the optional `ETag`. `claimQuestion` and
        `releaseQuestion` are new in 0.3.0 but answer with the shared `QuestionUpdated` response and
        therefore the optional `ETag`: that response is the 200 of every 0.2 question write, and
        making its header required would change eleven 0.2 operations at once (the 0.2.1 service
        does send it; tightening all of them is a 0.4 question).
    CacheControlNoStore:
      required: true
      schema: { type: string, pattern: '(?:^|,)\s*no-store\s*(?:,|$)' }
      description: >-
        Since 0.3.0 (security sweep after Codex on 50cc738): `no-store` on every response of the sign-in
        path (`login`, `completeLogin`, `logout`, `getSession`) — they carry a `state`, a session cookie
        or the CSRF token, and no shared or browser cache may keep them. Other directives may accompany
        it (`private, no-store`).
    RetryAfter:
      required: true
      schema: { type: integer, minimum: 1, maximum: 60 }
      description: >-
        Since 0.3.10 (slice 034a): whole seconds after which the client may try again, 1 to 60. On `429`
        the time to the end of the current counting window; on `503` `PersistenceBusy` 2 (write queue
        or statement abort) or 30 (migrations pending). Since 0.3.12 (takt-040): on `/stream` 30 on
        every `503` `StreamUnavailable` (all three causes: global stream limit, migrations pending,
        persistence busy at open) and on the stream's own `429` (too many open streams per session or
        subject); a `429` from a read quota keeps the rule above. A stream already open never sends it:
        an `end` message carries no header. Sent as a plain integer, never as an HTTP date.
    X-Server-Time:
      schema: { type: string, format: date-time }
      description: >-
        Since 0.3.0 (slice 033, ADR 0011, B4): the server clock at the time of the response (UTC,
        RFC 3339), taken from the injected clock. Clients compute their offset from it and warn from
        30 s drift (slice 032); a client clock is never the reference for a legally relevant time.
        Declared on every response because OpenAPI has no global response header; optional (no
        `required: true`) because the unchanged 0.3.0 service does not send it yet.
  responses:
    QuestionUpdated:
      description: >-
        Updated question with new ETag and current `_actions`. Since 0.4.0 (rule from slice 043a,
        enforced from slice 044): `answers[].refusalJustification` only for holders of
        `question.refuse.propose` or `question.refuse.approve`, as on `getQuestion`.
      headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Question' } } }
    QuestionList:
      description: OK
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content:
        application/json:
          schema:
            type: object
            required: [items, total]
            properties:
              items: { type: array, items: { $ref: '#/components/schemas/Question' } }
              total: { type: integer }
    ContributionUpdated:
      description: Updated speech with new ETag and current `_actions` (since 0.3.0)
      headers: { ETag: { $ref: '#/components/headers/ETagRequired' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/Contribution' } } }
    AgendaItemUpdated:
      description: The agenda item after the transition; `ETag` is the meeting's new version (since 0.3.0)
      headers: { ETag: { $ref: '#/components/headers/ETagRequired' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/json: { schema: { $ref: '#/components/schemas/AgendaItem' } } }
    Unauthorized:
      description: >-
        No valid credential: no session cookie, an expired or blocked session, a wrong audience
        (slice 029), a missing metrics token, or — in the demo — a missing, malformed or unknown
        `X-Actor`. Documented on every operation new in 0.3.0 that has a non-empty `security` (Codex
        on 2779e0b: every status the generic layer produces from a contract property is documented,
        checked for every operation in `apps/api/src/__tests__/contract.test.ts`). Since 0.4.0 (slice
        043a, review 012 point 18) also documented on the 29 operations of 0.2, where it was a reasoned
        exception in the test helper before.
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 401 } } } ] } } }
    Forbidden:
      description: >-
        The actor may not perform this action (deny reason in `detail`, rule id in `ruleId`):
        R-PERM-01 write permission missing (Schreibrecht fehlt), R-PERM-02 read permission missing
        (Leserecht fehlt; documented since 0.2.0, enforced on the read operations from slice 010),
        R-PERM-03 read scope exceeded (Leseumfang überschritten; since 0.2.1, slice 010) — e.g. a
        `listQuestions` status filter naming a status outside the actor's `question.read.delivered`
        scope.
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 403 } } } ] } } }
    NoActiveRole:
      description: >-
        Since 0.3.8 (takt-023): a valid session that has no active role assignment any more (revoked,
        expired, meeting closed). Carries the session's `csrfToken`, so the client can still call
        `POST /auth/logout`; every `/v1` write of this session keeps failing at the role resolution,
        so the token is usable for sign-out only. Never stored by a cache.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheControlNoStore' }
        X-Server-Time: { $ref: '#/components/headers/X-Server-Time' }
      content:
        application/problem+json:
          schema:
            allOf:
              - { $ref: '#/components/schemas/Problem' }
              - type: object
                required: [csrfToken]
                properties:
                  status: { const: 403 }
                  csrfToken: { type: string, pattern: '^[A-Za-z0-9_-]{32,}$', description: 'Same token as `SignedInSession.csrfToken`; send it as `X-CSRF-Token` on `POST /auth/logout`' }
    NotFound:
      description: Not found
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 404 } } } ] } } }
    Conflict:
      description: The transition is not allowed from the current status (rule id in `ruleId`)
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 409 } } } ] } } }
    PreconditionFailed:
      description: If-Match did not match the current ETag
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 412 } } } ] } } }
    PreconditionRequired:
      description: An If-Match header is required for this state-changing operation (slice 028)
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 428 } } } ] } } }
    Unprocessable:
      description: >-
        Validation failed: the request body, a query parameter or a header parameter does not match
        its contract schema (`validateOperation` in the service), or the body is not valid JSON. Since
        0.3.0 documented on every operation with a request body or a parameter that can fail its
        schema (Codex on 2779e0b); since 0.4.0 also on `listQuestions`, `returnQuestion` and
        `withdrawQuestion` (review 012 point 18, slice 043a).
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 422 } } } ] } } }
    RequestTimeout:
      description: >-
        Since 0.3.10 (slice 034a): the request took longer than the service's time budget. With the
        Postgres persistence a `408` means nothing was committed, and a retry with the same
        `Idempotency-Key` executes exactly once. `detail` is a fixed sentence, never the limit.
        Not sent by `GET /auth/login`, `GET /auth/callback` and `POST /auth/logout`, which have
        their own upper bounds.
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 408 } } } ] } } }
    PayloadTooLarge:
      description: >-
        Since 0.3.10 (slice 034a): the request body exceeds 262 144 bytes (256 KiB). The limit applies
        to every body, also where this document declares no `requestBody`. When the caller's source has
        already used up its quota, `429` is sent instead. `detail` is a fixed sentence.
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 413 } } } ] } } }
    TooManyRequests:
      description: >-
        Since 0.3.10 (slice 034a): a quota of the service is used up for the current window (per subject
        for writes and reads, per source for requests without a session, sign-in starts, probes and
        CORS preflights). No event is written and no `Idempotency-Key` is consumed. `Retry-After` names
        the seconds to the end of the window. `detail` is a fixed sentence, never the limit or the source.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Server-Time: { $ref: '#/components/headers/X-Server-Time' }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 429 } } } ] } } }
    PersistenceBusy:
      description: >-
        Since 0.3.10 (slice 034a): the persistence cannot serve now: the write queue waited longer than
        the lock limit, a statement was aborted, or migrations are pending. `detail` is
        "Persistence is busy." or "Migrations are pending."; `Retry-After` is 2 or 30. Nothing was
        written, no `Idempotency-Key` is consumed, and no database text is included. (A `500` with the
        detail "Persistence outcome is unknown." is different: see `info.description`.)
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Server-Time: { $ref: '#/components/headers/X-Server-Time' }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 503 } } } ] } } }
    StreamUnavailable:
      description: >-
        Since 0.3.11 (slice 035a), `/stream` only, one response for all three causes: the service's
        global limit of open streams is reached, migrations are pending, or the persistence is busy at
        open (the causes of `PersistenceBusy`; wording aligned with `RetryAfter` in 0.4.0, takt-040). `Retry-After` is required; `detail` is a fixed sentence per cause, never the
        limit, a host name or database text. Nothing was opened; the client retries after the given
        seconds with its cursor.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-Server-Time: { $ref: '#/components/headers/X-Server-Time' }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 503 } } } ] } } }
    InternalError:
      description: >-
        Since 0.4.0 (slice 043a, follow-up list 035b): an internal error. Documented on every
        operation, inside and outside `/v1`, because the service's global error handler (`onError`)
        answers any unexpected exception of any route this way. `detail` is exactly one of four fixed
        sentences: "Event seq N: integrity check failed." (the hash chain of the event log is broken at
        global sequence number N); "Persistence outcome is unknown." (the service's own timer fired
        while the events or the COMMIT were on the wire, so the write may have been committed: the
        client reads the state again before it writes anew, or repeats only with the same
        `Idempotency-Key`); "Persistence is unavailable." (the persistence failed; nothing was
        committed); "An unexpected error occurred." (any other exception). None of them carries
        `Retry-After`. The `seq` in the first sentence is disclosed on purpose: the global sequence
        number is no secret, every reader receives it anyway as the `id` of the `change` and `cursor`
        messages on `/stream` (R-PERM-04). Beyond that no `detail` carries a stack trace, connection
        data or any other internal identifier.
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 500 } } } ] } } }
    ServiceUnavailable:
      description: >-
        The service cannot serve this now (e.g. no identity provider configured). Used only on
        operations without credential (`login`, `completeLogin`, `getHealth`), so `detail` is a fixed
        sentence per cause, never a host name, a driver or identity-provider error text (review 023,
        Codex round 5; prose — a schema cannot inspect free text; `/readyz` uses codes instead).
      headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
      content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 503 } } } ] } } }
  schemas:
    AuthStateCookieLine:
      type: string
      description: >-
        One login correlation cookie line. The Base64url value is at least 43 characters; `Max-Age`
        is 1–300 seconds. The canonical attribute order also rejects Domain, Expires and duplicates.
      pattern: '^hv_auth_state=[A-Za-z0-9_-]{43,}; Max-Age=(?:[1-9]|[1-9][0-9]|[12][0-9]{2}|300); Path=/auth/callback; HttpOnly; Secure; SameSite=Lax$'
    ClearedAuthStateCookieLine:
      type: string
      description: >-
        One callback clearing cookie line with the same host-only path and attributes as login.
      pattern: '^hv_auth_state=; Max-Age=0; Path=/auth/callback; HttpOnly; Secure; SameSite=Lax$'
    SessionCookieLine:
      type: string
      description: One live host-only session cookie line; never a deleting cookie.
      pattern: '^hv_session=[!#-+\--:<-\[\]-~]{32,}(?!.*,)(?!.*hv_session=)(?!.*;\s*[Ee][Xx][Pp][Ii][Rr][Ee][Ss]=)(?=.*;\s*Path=/\s*(?:;|$))(?!.*;\s*[Pp][Aa][Tt][Hh]=(?!/\s*(?:;|$)))(?!.*;\s*[Dd][Oo][Mm][Aa][Ii][Nn]=)(?=.*;\s*HttpOnly\s*(?:;|$))(?=.*;\s*Secure\s*(?:;|$))(?=.*;\s*SameSite=(?:Lax|Strict)\s*(?:;|$))(?!.*;\s*[Ss][Aa][Mm][Ee][Ss][Ii][Tt][Ee]=(?!(?:Lax|Strict)\s*(?:;|$)))(?!.*;\s*[Mm][Aa][Xx]-[Aa][Gg][Ee]=\s*(?:0|-))'
    SameOriginPath:
      type: string
      maxLength: 512
      # Starts with one `/`, never `//` or `/\` (protocol-relative in browsers), no backslash, no
      # whitespace or control character anywhere (header splitting, browser normalisation).
      pattern: '^/(?![/\\])[^\\\x00-\x20\x7f]*$'
      description: >-
        Since 0.3.0 (Codex on 50cc738, SECURITY): a path inside the application, same origin — the
        open-redirect rule shared by `login` (`returnTo`) and the `Location` of `completeLogin`.
    Sha256Hex:
      type: string
      pattern: '^[0-9a-f]{64}$'
      description: 'Since 0.3.0 (Codex on 50cc738): a SHA-256 digest as 64 lower-case hex digits'
    SubjectId:
      type: string
      minLength: 1
      maxLength: 255
      pattern: '^[^@\s]+$'
      description: >-
        Since 0.3.0 (security sweep after Codex on 50cc738): pseudonymous subject id of the identity
        provider (OIDC `sub`, at most 255 characters) or the demo actor id — never an e-mail address
        (no `@`) and no whitespace (ADR 0009). That it is no clear name is prose: a schema cannot tell
        a name from an opaque id.
    Problem:
      type: object
      description: >-
        RFC 9457 problem details, extended with the rule id that produced the decision. `status`
        equals the HTTP status; since 0.3.0 every problem response binds it with `const` (Codex round
        5; today's service builds the HTTP status from this field, so no response changes).
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        ruleId:
          type: string
          description: >-
            Rule id from the domain rule tables, e.g. R-TRANS-07. Permission denials: R-PERM-01 write
            permission missing (Schreibrecht fehlt), R-PERM-02 read permission missing (Leserecht fehlt;
            since 0.2.0, enforced from slice 010), R-PERM-03 read scope exceeded (Leseumfang
            überschritten; since 0.2.1, slice 010). Meeting lifecycle and agenda: R-MTG-01..06
            (slice 025). Administration: R-ADM-01 configuration of a closed meeting is immutable,
            R-ADM-02 referenced master data stays (both since 0.4.1, slice 040b); the range
            R-ADM-01..09 and R-MTG-08/09 belongs to slice 040 (the configuration freeze R-ADM-03 from
            slice 040d).
            Speaker state table: R-SPK-00..05 and R-SPK-GUARD-01 (slice 080, documented on
            `updateSpeaker` since 0.4.0).
    Role:
      type: string
      description: >
        Roles are only a bundle of permissions (see docs/rollen-und-rechtekonzept.md). The interface
        never branches on a role name; it reads `_actions`.
        `coordination` (since 0.2.0) is the working name (Arbeitsname) of the role that classifies and
        assigns; displayed as "Koordination", final name pending register entry E1. Its permission
        bundle is built since slice 021 (`ROLE_PERMISSIONS`).
      enum: [moderation, capture, expert, legal, approver, podium, admin, observer, coordination]
    Actor:
      type: object
      description: >-
        The acting person as a projection (answer versions, approvals, role assignments, the
        session): `displayName` is resolved on read (from slice 026 through the person table and the
        right `question.identity.reveal`). Events use `EventActor` instead — from envelope v2 (slice 024)
        an event carries no clear name (ADR 0009/0011).
      required: [id, role]
      properties:
        id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        displayName: { type: string }
        personId: { type: string, description: 'Since 0.3.0 (slice 026, ADR 0009): key into the person table' }
    EventActor:
      type: object
      description: >-
        Actor of the stored original Event. Historical pre-v2 events may contain `displayName`,
        which is deprecated but retained in the original schema for compatibility with stored logs.
        Envelope v2 forbids it (`dependentSchemas` on Event). The standard EventRead projection
        excludes both `displayName` and `personId` (slice 026, ADR 0009/0013/0015).
      required: [id, role]
      properties:
        id: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        displayName:
          type: string
          deprecated: true
          description: 'Deprecated — veraltet seit 0.3.0, entfällt mit Scheibe 024 (envelope v2: an event with `schemaVersion` must not carry it), removed from the schema with 0.5; present today only on pre-v2 events'
        personId: { type: string, description: 'Since 0.3.0 (slice 026, ADR 0009): key into the person table; masked in the standard read path (ADR 0013)' }
    Action:
      type: string
      description: >
        Permission identifiers (Rechtebezeichner), identical to the domain permission list. A
        permission is granted exclusively in `ROLE_PERMISSIONS` (`packages/domain/src/permissions.ts`,
        AGENTS.md rule 4) — never by comparing a role name in interface or server code.
        Since 0.2.0: the read permissions `speaker.read`, `contribution.read`, `stage.read`,
        `history.read` and `event.read` (next to `question.read`; the read operations check them from
        slice 010, denial = R-PERM-02) and `question.legal.clear` (legal clearing — Rechtsfreigabe —
        recorded as its own event `QuestionLegalCleared`; a recommendation bound to an answer version,
        not the approval, which stays `question.approve`; register E25; slice 021).
        Since 0.2.1: `question.read.delivered` — a scoped alternative to `question.read` for the
        observer role (Beobachter): it only unlocks a question in status `delivered` or `closed`
        (R-PERM-03, `READ_SCOPES` in `packages/domain/src/permissions.ts`), for `listQuestions` and
        `getQuestion`, and applies to every holder including admin (slice 010).
        Since 0.3.0 (identifiers only; granted in `ROLE_PERMISSIONS` by the implementing slice, deny
        by default until then): `contribution.claim` and `question.claim` (take over and release,
        slice 028); `agenda.manage` (agenda and its progress events, slice 025); `admin.meetings.manage`
        (create/clone a meeting), `admin.units.manage`, `admin.seats.manage`, `admin.config.freeze`
        (slice 040); `admin.roles.manage` (role assignments, slice 026). Added after Codex on
        50cc738, for slices without a contract lane that 0.4.0 (slice 043) does not list either:
        `question.identity.reveal` (clear names on read, slice 026 grants and checks it; 043 lists it
        but comes after 026), `admin.override` (change after the configuration freeze with a reason,
        slice 040), `question.read.protected` and `event.read.personal` (confidentiality level and
        personal history under four eyes, slice 047).
        Since 0.4.0 (identifiers only; granted in `ROLE_PERMISSIONS` by slice 044, deny by default
        until then; never granted to admin): `question.refuse.propose` (propose a refusal,
        `proposeRefusal`) and `question.refuse.approve` (approve a refusal, `approveRefusal`; slice
        043a, ADR 0012). Holding one of them is also what lets a reader see `refusalJustification` on
        `Question.answers`.
        Since 0.4.3 (slice 048): `question.forward` (forward a question to another answering unit with
        a reason code, `forwardQuestion`); granted in `ROLE_PERMISSIONS` by slice 048, never to admin.
        It narrows the general "Weiterleiten" of the rights concept §2.4 to "an anderen Fachbereich".
        Since 0.4.5 (slice 061): `cockpit.read` (read the control desk figures, `getMeetingCockpit`);
        granted in `ROLE_PERMISSIONS` by slice 061 to moderation, coordination and admin; holders hold
        unscoped `question.read`.
      enum:
        - speaker.register
        - speaker.reorder
        - speaker.update
        - speaker.read
        - contribution.capture
        - contribution.read
        - contribution.claim
        - question.capture
        - question.classify
        - question.assign
        - question.forward
        - question.claim
        - answer.draft
        - question.submit_review
        - question.legal.clear
        - question.approve
        - question.return
        - question.stage
        - question.deliver
        - question.close
        - question.withdraw
        - question.merge
        - question.read
        - question.read.delivered
        - stage.read
        - history.read
        - event.read
        - cockpit.read
        - agenda.manage
        - admin.meetings.manage
        - admin.units.manage
        - admin.seats.manage
        - admin.roles.manage
        - admin.config.freeze
        - question.identity.reveal
        - admin.override
        - question.read.protected
        - event.read.personal
        - question.refuse.propose
        - question.refuse.approve
        - demo.seed
    MeetingStatus:
      type: string
      description: >-
        Lifecycle of a meeting (Jahrgang): MeetingCreated projects preparation from slice 025,
        MeetingStarted projects running, MeetingClosed projects closed. DebateClosed does not close
        the meeting; it records only the end of the general debate. R-MTG in slice 025 checks the
        transitions. Public actions arrive in later slices.
      enum: [preparation, running, closed]
    MeetingFormat:
      type: string
      description: >-
        Format profile of the meeting (Formatprofil, register E20 — built on the default, "auf
        Standard gebaut" in slice 023): `presence` (Präsenz-HV), `hybrid`, `virtual`. Default
        `presence`. In 0.3.0 the value is recorded only; the presence rules apply in every format
        until a format-specific slice (068) reads it.
      enum: [presence, hybrid, virtual]
      default: presence
    Meeting:
      type: object
      required: [id, title, date, status, currentRound, version, speakerListVersion, counts]
      properties:
        id: { type: string, description: 'The meeting id (`meetingId` on speakers, contributions, questions and events)' }
        title: { type: string, examples: ['Ordentliche Hauptversammlung 2027'] }
        legalEntity: { type: string }
        date: { type: string, format: date }
        status: { $ref: '#/components/schemas/MeetingStatus' }
        format: { $ref: '#/components/schemas/MeetingFormat' }
        currentRound: { type: integer, minimum: 1 }
        version: { type: integer, description: 'Since 0.3.0, projected from slice 025: optimistic-locking counter for meeting and agenda writes, also the ETag of `GET /meetings/{meetingId}`' }
        speakerListVersion: { type: integer, minimum: 1, description: 'Since 0.3.6 (slice 028): per-meeting version of the complete speaker list, also the ETag of GET /speakers and its canonical path.' }
        debateClosedAt: { type: string, format: date-time, description: 'Since 0.3.2 (takt-016): authoritative recorded time of DebateClosed. Optional; the closing operation follows with slice 087 after the remainder-list guard.' }
        clonedFromMeetingId: { type: string, description: 'Since 0.3.0 (slice 040): set when the master data was cloned from an earlier meeting' }
        configFrozenAt: { type: string, format: date-time, description: 'Since 0.3.0 (slice 040): set by the configuration freeze' }
        configHash: { $ref: '#/components/schemas/Sha256Hex', description: 'Since 0.3.0 (slice 040): SHA-256 (lower-case hex) over rights table, transition table and master data at the freeze' }
        counts:
          type: object
          description: Aggregate counters for the header and the podium
          properties:
            speakers: { type: integer }
            questions: { type: integer }
            open: { type: integer }
            staged: { type: integer }
            delivered: { type: integer }
            byStatus:
              type: object
              description: Questions per workflow status (drives the process strip in the header)
              additionalProperties: { type: integer }
            byUnit:
              type: object
              description: 'Since 0.3.0 (slice 040), projected since 0.4.1 (slice 040b): open questions per answering unit, keyed by `unitId`. Every unit of the meeting is a key, also with 0. A question whose `unitId` is not a unit of the meeting counts under no key, so the sum can be smaller than `open`'
              additionalProperties: { type: integer }
            bySeat:
              type: object
              description: 'Since 0.3.0 (slice 040), projected since 0.4.1 (slice 040b): questions on the podium per seat, keyed by `seatId`. Every seat of the meeting is a key, also with 0. A question whose `seatId` is not a seat of the meeting (an older log with a derived `seatId` and no seat list) counts under no key, so the sum can be smaller than `staged`. Aggregates per seat, never a figure per person'
              additionalProperties: { type: integer }
      # A freeze is a pair (Codex round 5): the time without the hash proves nothing, and vice versa.
      dependentRequired:
        configFrozenAt: [configHash]
        configHash: [configFrozenAt]
    MeetingCreate:
      type: object
      description: 'Since 0.3.0 (slice 040): body of `createMeeting`'
      required: [title, date]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        date: { type: string, format: date }
        legalEntity: { type: string, maxLength: 200 }
        format: { $ref: '#/components/schemas/MeetingFormat' }
        cloneFromMeetingId: { type: string, maxLength: 128, description: 'Copy agenda items, units and podium seats from this meeting (Jahrgang klonen)' }
    AgendaItem:
      type: object
      required: [id, number, title]
      properties:
        id: { type: string }
        number: { type: integer }
        title: { type: string }
        openedAt: { type: string, format: date-time, description: 'Since 0.3.0 (slice 025): set by `AgendaItemOpened`' }
        votingOpenedAt: { type: string, format: date-time, description: 'Since 0.3.0 (slice 025): set by `VotingOpened`' }
        votingClosedAt: { type: string, format: date-time, description: 'Since 0.3.0 (slice 025): set by `VotingClosed`' }
      # Progress is ordered (R-MTG, slice 025): no voting before the item was called, no closing before
      # opening. The order of the three instants themselves is prose — JSON Schema cannot compare values.
      dependentRequired:
        votingOpenedAt: [openedAt]
        votingClosedAt: [votingOpenedAt, openedAt]
    AgendaItemInput:
      type: object
      description: 'Since 0.3.0 (slice 040): one item of `replaceMeetingAgendaItems`; without `id` the server assigns one'
      required: [number, title]
      properties:
        id: { type: string, maxLength: 128 }
        number: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 500 }
    Unit:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        shortName: { type: string }
    UnitInput:
      type: object
      description: 'Since 0.3.0 (slice 040): one item of `replaceMeetingUnits`; without `id` the server assigns one'
      required: [name]
      properties:
        id: { type: string, maxLength: 128 }
        name: { type: string, minLength: 1, maxLength: 200 }
        shortName: { type: string, maxLength: 32 }
    StageSeat:
      type: object
      description: >-
        Since 0.3.0 (slice 040, ADR 0006): a podium seat (Bühnenplatz) of a meeting. Replaces the
        `StageAssignment` enum; the four enum values are the ids of the default seats in the seed
        (`supervisory_board_chair`, `ceo`, `cfo`, `board_member`). `personId` and `deviceId` let the
        service resolve which queue a podium device sees; the client never states its seat. Since
        0.4.1 (slice 040b): `personId` (a key into the person table, ADR 0009) and `deviceId` (a
        technical id of the podium device) are present only for holders of `admin.seats.manage`
        (`listMeetingStageSeats`, `replaceMeetingStageSeats`); `EventRead` never carries `personId`.
      required: [id, label]
      properties:
        id: { type: string }
        label: { type: string, description: 'Display label, e.g. "Vorstandsvorsitz"' }
        personId: { type: string }
        deviceId: { type: string }
        position: { type: integer, minimum: 1, description: Order on the podium }
    StageSeatInput:
      type: object
      description: 'Since 0.3.0 (slice 040): one item of `replaceMeetingStageSeats`; without `id` the server assigns one'
      required: [label]
      properties:
        id: { type: string, maxLength: 128 }
        label: { type: string, minLength: 1, maxLength: 100 }
        personId: { type: string, maxLength: 128 }
        deviceId: { type: string, maxLength: 128 }
        position: { type: integer, minimum: 1 }
    RoleAssignment:
      type: object
      description: 'Since 0.3.0 (slice 026, ADR 0004): one row of the administered assignment table, projected from `RoleAssigned`/`RoleRevoked`'
      required: [id, meetingId, subjectId, role, assignedAt, assignedBy]
      properties:
        id: { type: string }
        meetingId: { type: string }
        subjectId: { $ref: '#/components/schemas/SubjectId', description: 'Subject of the identity provider (pseudonymous id), or the demo actor id' }
        personId: { type: string, description: 'Key into the person table (ADR 0009), when known' }
        role: { $ref: '#/components/schemas/Role' }
        unitId: { type: string, description: 'Binds the role to one answering unit (optional)' }
        expiresAt: { type: string, format: date-time, description: 'Defaults to the end of the meeting; the role vanishes afterwards (auto-expiry)' }
        deputyForSubjectId: { $ref: '#/components/schemas/SubjectId', description: 'Set when this assignment is one of the two deputies of another holder (slice 040)' }
        assignedAt: { type: string, format: date-time }
        assignedBy: { $ref: '#/components/schemas/Actor' }
        revokedAt: { type: string, format: date-time }
        revokedBy: { $ref: '#/components/schemas/Actor' }
      dependentRequired:
        revokedAt: [revokedBy]
        revokedBy: [revokedAt]
    RoleAssignmentCreate:
      type: object
      description: 'Since 0.3.0 (slice 026): body of `assignRole`'
      required: [subjectId, role]
      properties:
        subjectId: { $ref: '#/components/schemas/SubjectId' }
        personId: { type: string, maxLength: 128 }
        role: { $ref: '#/components/schemas/Role' }
        unitId: { type: string, maxLength: 128 }
        expiresAt: { type: string, format: date-time }
        deputyForSubjectId: { $ref: '#/components/schemas/SubjectId' }
    ConfigFreeze:
      type: object
      description: 'Since 0.3.0 (slice 040): result of `freezeMeetingConfig`, also mirrored on `Meeting.configFrozenAt`/`configHash`'
      required: [meetingId, frozenAt, frozenBy, configHash]
      properties:
        meetingId: { type: string }
        frozenAt: { type: string, format: date-time }
        frozenBy: { $ref: '#/components/schemas/Actor' }
        configHash: { $ref: '#/components/schemas/Sha256Hex' }
    Session:
      description: >-
        Since 0.3.0 (slice 029): response of `GET /auth/me`. Two variants, told apart by `scheme` —
        the name of the security scheme that authenticated the call (Codex round 5): `demoActor` has
        no session and therefore no token and no expiry; `session` always carries `subjectId`,
        `roles`, `expiresAt` and `csrfToken`, so a client under the cookie scheme can rely on the token.
      oneOf:
        - { $ref: '#/components/schemas/DemoSession' }
        - { $ref: '#/components/schemas/SignedInSession' }
      discriminator:
        propertyName: scheme
        mapping:
          demoActor: '#/components/schemas/DemoSession'
          session: '#/components/schemas/SignedInSession'
    DemoSession:
      type: object
      description: '`GET /auth/me` under the `demoActor` header (only with `HV_DEMO=1`): the header identity; nothing to refresh, nothing to protect against CSRF'
      required: [scheme, actor]
      properties:
        scheme: { type: string, const: demoActor }
        actor: { $ref: '#/components/schemas/Actor' }
        roles: { type: array, minItems: 1, maxItems: 1, items: { $ref: '#/components/schemas/Role' }, description: 'The one role of the header (equal to `actor.role` — prose, JSON Schema cannot compare values), for symmetry with the session variant' }
        subjectId: { $ref: '#/components/schemas/SubjectId', description: 'The actor id of the header, equal to `actor.id` (prose — JSON Schema cannot compare values); declared so a client can read `subjectId` under both schemes' }
        # No identity provider and no person table behind a header identity (Opus recheck on 8ef3ad2).
        idpGroups: false
        personId: false
        # No session, so nothing that belongs to one (Codex round 5): a client that finds a token here
        # would send it, and one that finds an expiry would schedule a refresh that cannot happen.
        csrfToken: false
        expiresAt: false
    SignedInSession:
      type: object
      description: '`GET /auth/me` under the `session` cookie (slice 029, ADR 0004)'
      required: [scheme, actor, subjectId, roles, expiresAt, csrfToken]
      properties:
        scheme: { type: string, const: session }
        actor: { $ref: '#/components/schemas/Actor' }
        subjectId: { $ref: '#/components/schemas/SubjectId', description: 'Subject of the identity provider (pseudonymous id)' }
        personId: { type: string, description: 'Key into the person table (ADR 0009), when known' }
        roles: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Role' }, description: 'All roles from the assignment table valid now; `actor.role` is the active one. A subject without any role never gets a session (403 at `completeLogin`).' }
        expiresAt: { type: string, format: date-time, description: 'Session expiry (14 h with silent refresh, ADR 0004)' }
        idpGroups: { type: array, items: { type: string }, description: 'Groups reported by the identity provider — a suggestion for the administrator, never a role by itself (ADR 0004)' }
        csrfToken: { type: string, pattern: '^[A-Za-z0-9_-]{32,}$', description: 'Token to send in the `X-CSRF-Token` header on state-changing calls under the `session` scheme (slice 029). At least 32 base64url characters (≥ 192 bits when random; security sweep after Codex on 50cc738), so it survives a header without quoting' }
    TransparencyNotice:
      type: object
      description: 'Since 0.3.0 (slice 029): transparency notice (Transparenzhinweis, Art. 13 GDPR) for the sign-in page; text from configuration, two languages (rule 10); legal review pending (E15)'
      required: [version, text]
      properties:
        version: { type: string, minLength: 1, description: 'Version of the configured text, shown next to it' }
        updatedAt: { type: string, format: date-time }
        text:
          type: object
          description: 'Both languages non-empty (rule 10; Codex round 5): the sign-in page never shows a blank notice'
          required: [de, en]
          properties:
            de: { type: string, minLength: 1 }
            en: { type: string, minLength: 1 }
        dataProtectionSummaryUrl: { type: string, format: uri, description: 'Link to the summary of the data protection impact assessment (DSFA) shown on the sign-in page (slice 030)' }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok] }
    Readiness:
      type: object
      description: >-
        Since 0.3.0 (implemented in slice 027): readiness with exactly the three checks `clock`
        (NTP status added in 033), `db` and `migrations` (027) — all three required (Codex round
        5) and no other names (`additionalProperties: false`), because `/readyz` answers without
        credential. `ready` means every check is `ok`, `not_ready` means at least one is `fail`; both
        are bound to the HTTP status at the operation (200 / 503). With the JSONL development adapter
        (027 keeps it) `db` is `ok` when the log file is readable and writable and `migrations` is
        `ok` (nothing to migrate); `not_configured` for `db` means no event store is configured.
        Since 0.3.5, `clock` may also report `not_configured` until the NTP adapter in 033.
      required: [status, checks]
      properties:
        status: { type: string, enum: [ready, not_ready] }
        checks:
          type: object
          required: [clock, db, migrations]
          # Each check names only the codes that can be its own (Opus recheck on 8ef3ad2, point a):
          # a clock check never fails with `unreachable`, a database check never with `clock_drift`.
          properties:
            clock:
              allOf:
                - { $ref: '#/components/schemas/ReadinessCheck' }
                - { properties: { code: { enum: [not_configured, clock_unsynced, clock_drift, timeout] } } }
            db:
              allOf:
                - { $ref: '#/components/schemas/ReadinessCheck' }
                - { properties: { code: { enum: [not_configured, unreachable, timeout] } } }
            migrations:
              allOf:
                - { $ref: '#/components/schemas/ReadinessCheck' }
                - { properties: { code: { enum: [migrations_pending, not_configured, unreachable, timeout] } } }
          # A closed list: `/readyz` answers without credential (review 023).
          additionalProperties: false
        serverTime: { type: string, format: date-time }
    ReadinessCheck:
      description: >-
        One readiness check: `ok` carries no code, `fail` always carries one (Codex round 5). Both
        variants are closed (`additionalProperties: false`, Codex on 8ef3ad2): `/readyz` answers
        without credential, so no `detail`, host name or driver text can ride along. Which codes a
        check may carry is narrowed per check on `Readiness.checks`.
      oneOf:
        - type: object
          required: [status]
          properties:
            status: { type: string, const: ok }
            code: false
          additionalProperties: false
        - type: object
          required: [status, code]
          properties:
            status: { type: string, const: fail }
            code: { $ref: '#/components/schemas/ReadinessCheckCode' }
          additionalProperties: false
    ReadinessCheckCode:
      type: string
      description: >-
        Since 0.3.0 (slice 033): why a check failed, as a code — never free text, because `/readyz`
        answers without credential and a hostname, a port or a driver error string would leak (review
        023). Codes may be added in a later minor version; clients ignore unknown ones.
      enum: [not_configured, unreachable, timeout, migrations_pending, clock_unsynced, clock_drift]
    SpeakerStatus:
      type: string
      enum: [waiting, speaking, finished, withdrawn]
    Speaker:
      type: object
      required: [id, meetingId, number, displayName, round, position, status, version]
      properties:
        id: { type: string }
        meetingId: { type: string, description: 'Since 0.3.0 (slice 025): the meeting this request to speak belongs to. Pflicht ab 0.3.6, Scheibe 028.' }
        number: { type: integer, description: Running number of the request to speak }
        displayName: { type: string, description: 'Since 0.3.4 (slice 026): clear name from the person table for actors with `question.identity.reveal`; otherwise `Redner <number>`.' }
        personId: { type: string, description: 'Since 0.3.0 (slice 026, ADR 0009): key into the person table; the clear name is resolved on read for holders of `question.identity.reveal`' }
        organisation: { type: string }
        round: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/SpeakerStatus' }
        speakingStartedAt: { type: string, format: date-time }
        speakingEndedAt: { type: string, format: date-time }
        questionCount: { type: integer }
        version: { type: integer }
        _actions: { type: array, items: { $ref: '#/components/schemas/Action' } }
    SpeakerRegistration:
      type: object
      description: >-
        Body of `registerSpeaker` / `registerMeetingSpeaker`. Since 0.4.0 (slice 043a) without `kind`
        and `requestedMinutes` (deprecated since 0.2.0, ignored by the core since slice 080); a client
        that still sends them is not rejected, the values are ignored and never written.
      required: [displayName]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 200 }
        organisation: { type: string, maxLength: 200 }
        round: { type: integer, minimum: 1 }
    SpeakerUpdate:
      type: object
      description: >-
        Body of `updateSpeaker`. Since 0.4.0 (slice 043a) without `requestedMinutes` (deprecated since
        0.2.0, ignored by the core since slice 080; still not rejected) and with `reason`.
      properties:
        status: { $ref: '#/components/schemas/SpeakerStatus' }
        round: { type: integer, minimum: 1 }
        reason:
          type: string
          enum: [follow_up]
          description: >-
            Since 0.4.0 (slice 043a; served since slice 080): why a finished request to speak reopens.
            Required for `finished → waiting` (R-SPK-05, a follow-up question — Nachfrage); without it
            that change is `409` R-SPK-GUARD-01. On any other change the reason is dropped and never
            written. Any other value is a `422`.
    SpeakerOrder:
      type: object
      description: Body of `reorderSpeakers` / `reorderMeetingSpeakers`
      required: [round, speakerIds]
      properties:
        round: { type: integer, minimum: 1 }
        speakerIds: { type: array, maxItems: 2000, items: { type: string, maxLength: 128 } }
    TextSpan:
      type: object
      description: Character offsets into the contribution text, half-open interval
      required: [start, end]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }
    OccurredAtSource:
      type: string
      description: >-
        Since 0.3.0 (ADR 0011, B4): who stated `occurredAt`. Only `server` is authoritative
        (`recordedAt`, the server clock); `device` (a podium or capture device, e.g. an offline
        intention), `paper` (paper path: the time written on the sheet) and `transcript` (the
        transcription tool's timecode) are statements of the sender and are labelled as such in every
        export. A statement in the future is rejected (422).
      enum: [server, device, paper, transcript]
    RetentionClass:
      type: string
      description: >-
        Since 0.3.0 (ADR 0009, register E16): `record` (Niederschrift-relevant), `working` (working
        data), `technical`. Retention periods per class are a pending decision of legal and the data
        protection officer; until then nothing is deleted (no deletion logic in the beta).
      enum: [record, working, technical]
    Claim:
      type: object
      description: 'Since 0.3.0 (slice 028, E36): who took over a speech or question (Übernahme, weiche Sperre) and until when. `expiresAt` lies after `claimedAt` (prose — JSON Schema cannot compare values)'
      required: [actorId, claimedAt, expiresAt]
      properties:
        actorId: { type: string }
        personId: { type: string }
        claimedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: 'Expiry releases the claim without any further event' }
    Contribution:
      type: object
      required: [id, meetingId, speakerId, text, capturedAt, questionIds, coverage, version]
      properties:
        id: { type: string }
        meetingId: { type: string, description: 'Since 0.3.0 (slice 025). Pflicht ab 0.3.6, Scheibe 028.' }
        speakerId: { type: string }
        text: { type: string }
        capturedAt: { type: string, format: date-time, description: 'Server time of the capture (the same instant as the event''s `recordedAt`)' }
        occurredAt: { type: string, format: date-time, description: 'Since 0.3.0 (ADR 0011): the sender''s statement of when the speech happened, when it differs from `capturedAt` (paper, transcript, device)' }
        occurredAtSource:
          type: string
          enum: [device, paper, transcript]
          description: 'Source of the stated `occurredAt`, as sent with `captureMeetingContribution` — never `server` (Opus recheck on 8ef3ad2): the server time of the capture is `capturedAt`'
        source:
          type: string
          enum: [manual, transcript, paper]
          default: manual
          description: 'Where the text came from. `paper` since 0.3.0 (paper path, slice 025; produced only through `captureMeetingContribution`) — a response-enum widening, see "Compatibility" in info.description.'
        lateEntry: { type: boolean, description: 'Since 0.3.2 (takt-016): true when the speech was captured after debateClosedAt under R-MTG-03 with an earlier source time and a reason. Optional until slice 025 emits it.' }
        questionIds: { type: array, items: { type: string } }
        coverage:
          type: object
          description: How much of the text is covered by captured questions (Restabdeckung)
          required: [coveredRatio, uncovered]
          properties:
            coveredRatio: { type: number, minimum: 0, maximum: 1 }
            uncovered: { type: array, items: { $ref: '#/components/schemas/TextSpan' } }
        version: { type: integer, description: 'Since 0.3.0 (slice 028): optimistic-locking counter, also the ETag. Pflicht ab 0.3.6, Scheibe 028.' }
        claim: { $ref: '#/components/schemas/Claim' }
        _actions:
          type: array
          description: 'Since 0.3.0: actions the calling actor may perform on this speech right now (claim, release, capture questions)'
          items: { $ref: '#/components/schemas/Action' }
      dependentRequired:
        occurredAt: [occurredAtSource]
        occurredAtSource: [occurredAt]
    ContributionCapture:
      type: object
      description: >-
        Body of `captureContribution` (alias). Unchanged since 0.1.0 on purpose: the service validates
        requests against this document, so the paper path and the sender's time statement live only on
        `MeetingContributionCapture` (`captureMeetingContribution`, slice 025) until the core handles
        them (review 023).
      required: [speakerId, text]
      properties:
        speakerId: { type: string, maxLength: 128 }
        text: { type: string, minLength: 1, maxLength: 60000 }
        source: { type: string, enum: [manual, transcript] }
    MeetingContributionCapture:
      type: object
      description: >-
        Since 0.3.0 (slice 025): body of `captureMeetingContribution` — `ContributionCapture` plus the
        paper path (`source: paper`, Papierpfad) and the sender's time statement (ADR 0011). A stated
        `occurredAt` never becomes `recordedAt`; a value in the future is a 422. `occurredAt` and
        `occurredAtSource` come together or not at all (`dependentRequired` in both directions,
        enforced by the service's Ajv validator; the generated TypeScript types cannot express it).
      required: [speakerId, text]
      properties:
        speakerId: { type: string, maxLength: 128 }
        text: { type: string, minLength: 1, maxLength: 60000 }
        source: { type: string, enum: [manual, transcript, paper], description: '`paper` = paper path (Papierpfad, slice 025)' }
        lateEntryReason: { type: string, minLength: 1, maxLength: 500, description: 'Since 0.3.2 (takt-016): reason for a paper or transcript entry after the debate closed. Optional in the schema; R-MTG-03 requires non-blank text in that state.' }
        occurredAt: { type: string, format: date-time, description: 'The sender''s statement of when the speech happened' }
        occurredAtSource:
          type: string
          enum: [device, paper, transcript]
          description: 'Source of the stated `occurredAt`; a client cannot claim `server`'
      dependentRequired:
        occurredAt: [occurredAtSource]
        occurredAtSource: [occurredAt]
    Track:
      type: string
      description: >
        The three answer tracks (Antwortpfade). `podium` = free answer by the board (Pfad A),
        `fast_track` = reference to an existing publication (Pfad B), `expert_track` = specialist
        answer followed by legal clearing (Pfad C).
      enum: [podium, fast_track, expert_track]
    StageAssignment:
      type: string
      deprecated: true
      description: >-
        Who answers on the podium (Bühnenzuordnung). Deprecated — veraltet seit 0.3.0, entfällt mit
        Vertrag 0.5 (ADR 0006): replaced by the podium seat list `StageSeat` and `seatId`; the four
        values are the ids of the default seats in the seed, so a value here equals the `seatId` of
        that default seat. Removal is a 0.5 matter (no slice in Plan 5 names it yet); slice 040 builds
        the seat list, the interface follows in 056.
      enum: [supervisory_board_chair, ceo, cfo, board_member]
    QuestionStatus:
      type: string
      description: >
        Workflow status. Transitions are defined as data in the domain transition table; the
        interface never hard-codes them.
      enum:
        - captured
        - classified
        - assigned
        - answer_drafted
        - in_review
        - approved
        - staged
        - delivered
        - closed
        - withdrawn
        - merged
    AnswerKind:
      type: string
      description: >-
        Since 0.4.0 (slice 043a, ADR 0012 model A): the kind of an answer version. `answer` — an
        ordinary answer; `refusal_no_claim` — refusal path A (Verweigerungspfad A, "kein
        Auskunftsanspruch": the shareholder has no right to the information); `refusal_with_ground` —
        refusal path B (Verweigerungspfad B, "Verweigerung trotz Anspruchs": refusal despite a right,
        with a ground from the catalogue, `listRefusalGrounds`). Refusal paths A/B are not the answer
        tracks A/B/C (`Track`): a refusal can arise on any track. Built on the default ("auf Standard
        gebaut", slice 043a; owner's go of 03.10.2026); E15 and ADR 0012 stay open.
      enum: [answer, refusal_no_claim, refusal_with_ground]
    AnswerVersion:
      type: object
      description: >-
        One immutable answer version. Since 0.4.0 (slice 043a, filled from slice 044) a version may be
        a refusal: `answerKind` (absent = `answer`), `refusalGroundId`, `refusalGroundHash` and
        `refusalJustification`. Invariants (schema): an answer carries none of the three `refusal*`
        fields; refusal path B carries `refusalGroundId` and `refusalGroundHash`; refusal path A
        carries neither. `refusalJustification` is never required, because it is masked (see there).
      required: [version, text, createdAt, createdBy]
      properties:
        version: { type: integer, minimum: 1 }
        text: { type: string, description: 'The wording read out on the podium; for a refusal the refusal wording, prefilled from `RefusalGround.stageText`' }
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: '#/components/schemas/Actor' }
        sources:
          type: array
          description: References the answer relies on (publication, catalogue entry, document)
          items: { type: string }
        answerKind:
          description: 'Since 0.4.0 (slice 043a): the kind of this version; absent means `answer`'
          allOf: [ { $ref: '#/components/schemas/AnswerKind' } ]
        refusalGroundId: { type: string, maxLength: 128, description: 'Since 0.4.0 (slice 043a): `RefusalGround.id` of the chosen ground (refusal path B only)' }
        refusalGroundHash:
          description: >-
            Since 0.4.0 (slice 043a): `RefusalGround.hash` of the chosen entry at the time of the
            proposal — the audit path of the catalogue. It proves which wording and which citation the
            refusal was proposed on; from slice 044 an approval against a changed entry is `409`
            R-GUARD-11. Not masked: the ground is catalogue data.
          allOf: [ { $ref: '#/components/schemas/Sha256Hex' } ]
        refusalJustification:
          type: string
          description: >-
            Since 0.4.0 (slice 043a, masking enforced from slice 044): the justification of a refusal, a
            legal assessment (SG2). Present only for readers holding `question.refuse.propose` or
            `question.refuse.approve` (never through `question.legal.clear`, never an administrator);
            absent for every other reader of `Question.answers`, always absent in `StageView`, and never
            part of an `EventRead`. Never matched by the full-text search `q`.
        body:
          description: >-
            Since 0.4.4 (slice 055, ADR 0005): the answer as a normalised block document, on every version.
            For a version without a stored document (before 0.4.4, refusals) derived from `text`: one paragraph
            per non-empty line, without marks. Never masked, never personal data in the sense of `PiiEnvelope`
            (the same content as `text`).
          allOf: [ { $ref: '#/components/schemas/AnswerBody' } ]
      # Refusal invariants (slice 043a). Each branch defines the properties it names, so a `required`
      # always refers to a property of its own sub-schema.
      allOf:
        # Without `required`, the condition holds when `answerKind` is absent or `answer`.
        - if: { properties: { answerKind: { const: answer } } }
          then:
            properties:
              refusalGroundId: false
              refusalGroundHash: false
              refusalJustification: false
        - if: { required: [answerKind], properties: { answerKind: { const: refusal_with_ground } } }
          then:
            required: [refusalGroundId, refusalGroundHash]
            properties:
              refusalGroundId: { type: string }
              refusalGroundHash: { type: string }
        - if: { required: [answerKind], properties: { answerKind: { const: refusal_no_claim } } }
          then:
            properties:
              refusalGroundId: false
              refusalGroundHash: false
    LegalRef:
      type: object
      description: >-
        Since 0.4.0 (slice 043a): the trace of a rule or catalogue entry to its legal source, the same
        form as the domain type `LegalRef` (`packages/domain/src/rules.ts`). `source` names an entry of
        the closed domain list `LegalSource`; the contract keeps it an open string so that a new source
        costs no contract cycle. Deliberately wider than today's domain type: `docHash` may be a string
        and `verified` may be `true`, the values the legal review (slice 076) sets. Until then every
        entry is `verified: false` (E15) and the interface shows it as unverified.
      required: [source, citation, docVersion, docHash, verified]
      properties:
        source: { type: string, description: 'An entry of the domain list `LegalSource`' }
        citation: { type: string, description: 'The citation (Normzitat), as content' }
        docVersion: { type: [string, 'null'], description: 'Version of the cited document, when known' }
        docHash: { type: [string, 'null'], description: 'Hash of the cited document, set by the legal review (076)' }
        verified: { type: boolean, description: '`true` only after the legal department has checked the entry (E15, 076)' }
    RefusalGround:
      type: object
      description: >-
        Since 0.4.0 (slice 043a): one entry of the catalogue of refusal grounds (Verweigerungsgrund),
        returned by `listRefusalGrounds`. Code data from slice 044, maintained by the legal review
        (076). Texts are content in the meeting's content language (E21: `de`), not interface strings.
      required: [id, title, stageText, legalRef, hash]
      properties:
        id: { type: string, maxLength: 128 }
        title: { type: string, description: 'Short title of the ground' }
        stageText: { type: string, description: 'Wording block for the podium (Formulierungsbaustein); prefills `RefusalProposal.text`' }
        legalRef: { $ref: '#/components/schemas/LegalRef' }
        hash:
          description: >-
            SHA-256 as 64 lower-case hex digits over the UTF-8 bytes of the canonical form after RFC 8785
            (JSON Canonicalization Scheme) of this `RefusalGround` entry without the field `hash` itself
            (so the definition is not circular). An answer version keeps it as `refusalGroundHash`.
          allOf: [ { $ref: '#/components/schemas/Sha256Hex' } ]
    RefusalProposal:
      type: object
      description: >-
        Since 0.4.0 (slice 043a): body of `proposeRefusal`. Closed (`additionalProperties: false`): a
        refusal carries exactly these fields. A ground on refusal path A is a category error and a
        `422`. On refusal path B the schema requires neither ground nor justification: their absence is
        `409` R-GUARD-09 of slice 044, not a `422`. An unknown `refusalGroundId` is a `422` (slice 044).
      required: [answerKind, text]
      additionalProperties: false
      properties:
        answerKind: { type: string, enum: [refusal_no_claim, refusal_with_ground], description: 'The refusal path; never `answer` (an answer is drafted with `draftAnswer`)' }
        text: { type: string, minLength: 1, maxLength: 20000, description: 'The wording for the podium; the interface prefills it from `RefusalGround.stageText`. Since 0.4.4 (slice 055) the service removes control and format characters (`Cc` except tab, line feed, carriage return; every `Cf`) and applies NFC before trimming; a lone surrogate is `422`.' }
        refusalGroundId: { type: string, maxLength: 128, description: 'The chosen ground (refusal path B only)' }
        refusalJustification: { type: string, minLength: 1, maxLength: 4000, description: 'The justification, a legal assessment (SG2); masked on every read path as described on `AnswerVersion.refusalJustification`. Since 0.4.4 (slice 055) the same character filter as `text` applies before the checks; a justification that is empty afterwards counts as missing, a lone surrogate is `422`.' }
        sources: { type: array, maxItems: 50, items: { type: string, maxLength: 2000 } }
      if: { required: [answerKind], properties: { answerKind: { const: refusal_no_claim } } }
      then: { properties: { refusalGroundId: false } }
    RefusalApproval:
      type: object
      description: 'Since 0.4.0 (slice 043a): body of `approveRefusal`, like the body of `approveQuestion`, but closed'
      required: [answerVersion]
      additionalProperties: false
      properties:
        answerVersion: { type: integer, minimum: 1 }
    Approval:
      type: object
      required: [answerVersion, approvedAt, approvedBy]
      properties:
        answerVersion: { type: integer }
        approvedAt: { type: string, format: date-time }
        approvedBy: { $ref: '#/components/schemas/Actor' }
    LegalClearanceRequest:
      type: object
      properties:
        answerVersion: { type: integer, minimum: 1 }
        note: { type: string, maxLength: 500 }
    LegalClearance:
      type: object
      required: [clearedAt, clearedBy]
      properties:
        answerVersion: { type: integer, minimum: 1 }
        clearedAt: { type: string, format: date-time }
        clearedBy: { $ref: '#/components/schemas/Actor' }
    Question:
      type: object
      required: [id, meetingId, number, contributionId, speakerId, text, status, answers, version, createdAt, updatedAt, _actions]
      properties:
        id: { type: string }
        meetingId: { type: string, description: 'Since 0.3.0 (slice 025): question numbers F-n restart per meeting. Pflicht ab 0.3.6, Scheibe 028.' }
        number: { type: string, examples: ['F-0417'] }
        contributionId: { type: string }
        speakerId: { type: string }
        speakerDisplayName: { type: string }
        text: { type: string }
        span: { $ref: '#/components/schemas/TextSpan' }
        status: { $ref: '#/components/schemas/QuestionStatus' }
        track: { $ref: '#/components/schemas/Track' }
        agendaItemId: { type: string }
        stageAssignment:
          deprecated: true
          description: 'Deprecated — veraltet seit 0.3.0, entfällt mit Vertrag 0.5: use `seatId` (ADR 0006)'
          allOf: [ { $ref: '#/components/schemas/StageAssignment' } ]
        seatId: { type: string, description: 'Since 0.3.0 (slice 040, ADR 0006), set since 0.4.1 (slice 040b): the podium seat (Bühnenplatz) that answers; one of `listMeetingStageSeats`. `Classification.seatId` when classified with it, otherwise the value of `stageAssignment`' }
        unitId: { type: string }
        claim: { $ref: '#/components/schemas/Claim' }
        answers: { type: array, items: { $ref: '#/components/schemas/AnswerVersion' } }
        approval: { $ref: '#/components/schemas/Approval' }
        legalClearance: { $ref: '#/components/schemas/LegalClearance' }
        returnReason: { type: string }
        stagePosition: { type: integer }
        deliveredAt: { type: string, format: date-time }
        mergedIntoId: { type: string }
        version: { type: integer, description: 'Optimistic-locking counter, also the ETag' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        _actions:
          type: array
          description: Actions the calling actor may perform on this question right now
          items: { $ref: '#/components/schemas/Action' }
      # Codex round 5: the deprecated enum and its successor never disagree. The four enum values are
      # the ids of the default seats, so when both are present they are the same string; a question on
      # any other seat carries `seatId` only. The service sets `seatId` since 0.4.1 (slice 040b).
      if: { required: [stageAssignment, seatId], properties: { stageAssignment: { type: string }, seatId: { type: string } } }
      then:
        anyOf:
          - { properties: { stageAssignment: { const: supervisory_board_chair }, seatId: { const: supervisory_board_chair } } }
          - { properties: { stageAssignment: { const: ceo }, seatId: { const: ceo } } }
          - { properties: { stageAssignment: { const: cfo }, seatId: { const: cfo } } }
          - { properties: { stageAssignment: { const: board_member }, seatId: { const: board_member } } }
    QuestionCapture:
      type: object
      required: [text]
      properties:
        text: { type: string, minLength: 1, maxLength: 4000 }
        span: { $ref: '#/components/schemas/TextSpan' }
    Classification:
      type: object
      required: [track]
      properties:
        track: { $ref: '#/components/schemas/Track' }
        agendaItemId: { type: string, maxLength: 128 }
        stageAssignment:
          deprecated: true
          description: 'Deprecated — veraltet seit 0.3.0, entfällt mit Vertrag 0.5 (ADR 0006): use `seatId` (since 0.4.1, slice 040b). Sent alone it works as before (no check against the seat list), so older clients and logs stay valid; sent together with `seatId` both must be equal, otherwise `422`.'
          allOf: [ { $ref: '#/components/schemas/StageAssignment' } ]
        seatId:
          type: string
          maxLength: 128
          description: >-
            Since 0.4.1 (slice 040b, ADR 0006; the contract line of slice 040 under rule 1 of slice
            043a): the podium seat (Bühnenplatz) that answers; must be the `id` of a seat of the
            question's meeting (`listMeetingStageSeats`), otherwise `422`. When `stageAssignment` is
            sent as well, both must be equal, otherwise `422`. The question then carries this value as
            `Question.seatId`, and `Question.stageAssignment` only when the value is one of the four
            `StageAssignment` values. A classification without `seatId` and without `stageAssignment`
            removes both from the question.
    AnswerDraft:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 20000
          description: >-
            The answer wording. Since 0.4.4 (slice 055) the service removes control and format characters
            (Unicode `Cc` except tab, line feed and carriage return, every `Cf`) and applies NFC before trimming;
            a lone surrogate is `422`. With `body` this field must still meet its form but is neither checked
            nor stored (see `body`).
        sources: { type: array, maxItems: 50, items: { type: string, maxLength: 2000 } }
        body:
          description: >-
            Since 0.4.4 (slice 055, ADR 0005): the answer as an open block document. With `body` the service
            normalises it (`AnswerBodyInput`) and stores as `text` the plain-text projection of the normalised
            document; the submitted `text` stays required (0.4.x is additive), must meet its form and is then
            neither checked nor stored. Without `body` as before (with the character filter of `text`). A retry
            with the same `Idempotency-Key` returns the first result for a valid `body`, also when it differs
            from the first (R-IDEM-01).
          allOf: [ { $ref: '#/components/schemas/AnswerBodyInput' } ]
    AnswerMark:
      type: string
      description: >-
        Since 0.4.4 (slice 055): a mark of the house format after ADR 0005; no font choice (E6). A new mark is
        additive; a mark that is later withdrawn stays described here as a value (stored events keep it) and is
        removed when a version is read.
      enum: [bold, italic, highlight]
    AnswerInline:
      type: object
      description: 'Since 0.4.4 (slice 055): one run of text with its marks, part of the stored form `AnswerBody`'
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 20000 }
        marks: { type: array, uniqueItems: true, maxItems: 3, items: { $ref: '#/components/schemas/AnswerMark' } }
    AnswerParagraph:
      type: object
      description: 'Since 0.4.4 (slice 055): a paragraph of the stored form `AnswerBody`'
      required: [type, content]
      additionalProperties: false
      properties:
        type: { type: string, const: paragraph }
        content: { type: array, minItems: 1, maxItems: 20000, items: { $ref: '#/components/schemas/AnswerInline' } }
    AnswerList:
      type: object
      description: 'Since 0.4.4 (slice 055): a bulleted list of the stored form `AnswerBody`; no numbering, no nesting (E6)'
      required: [type, items]
      additionalProperties: false
      properties:
        type: { type: string, const: list }
        items:
          type: array
          minItems: 1
          maxItems: 10000
          items: { type: array, minItems: 1, maxItems: 20000, items: { $ref: '#/components/schemas/AnswerInline' } }
    AnswerBlock:
      description: 'Since 0.4.4 (slice 055): one block of the stored form; `type` separates the two kinds'
      oneOf:
        - { $ref: '#/components/schemas/AnswerParagraph' }
        - { $ref: '#/components/schemas/AnswerList' }
    AnswerBody:
      type: object
      description: >-
        Since 0.4.4 (slice 055, ADR 0005): the normalised stored form of an answer version. `text` of the
        version is its plain-text projection: the runs of a paragraph or list item joined, the items of a list
        separated by one line feed, the blocks by two line feeds, the whole in NFC, no bullet characters. The
        structural limits follow from the text limit of 20000 code points and never apply on their own, so
        every valid version has a valid document. `language` is the content language of the wording (E21:
        only `de`).
      required: [language, blocks]
      additionalProperties: false
      properties:
        language: { type: string, enum: [de] }
        blocks: { type: array, minItems: 1, maxItems: 10000, items: { $ref: '#/components/schemas/AnswerBlock' } }
    AnswerInlineInput:
      type: object
      description: 'Since 0.4.4 (slice 055): one run of the open input form; marks are open strings'
      required: [text]
      additionalProperties: false
      properties:
        text: { type: string, minLength: 0, maxLength: 20000 }
        marks: { type: array, maxItems: 16, items: { type: string, minLength: 1, maxLength: 32 } }
    AnswerBlockInput:
      type: object
      description: 'Since 0.4.4 (slice 055): one block of the open input form; the block type is an open string'
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, minLength: 1, maxLength: 32 }
        content: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/AnswerInlineInput' } }
        items:
          type: array
          maxItems: 1000
          items: { type: array, maxItems: 2000, items: { $ref: '#/components/schemas/AnswerInlineInput' } }
    AnswerBodyInput:
      type: object
      description: >-
        Since 0.4.4 (slice 055, ADR 0005): the open input form of an answer document (`AnswerDraft.body`).
        The core applies the whitelist (rules N1 to N10 of ADR 0005): an unknown block type becomes
        paragraphs, an unknown mark is dropped and its text stays; control and format characters are removed.
        `422` when no text remains, the plain-text projection exceeds 20000 code points or a lone surrogate
        occurs.
      required: [blocks]
      additionalProperties: false
      properties:
        language: { type: string, enum: [de] }
        blocks: { type: array, minItems: 1, maxItems: 2000, items: { $ref: '#/components/schemas/AnswerBlockInput' } }
    StageView:
      type: object
      description: 'Podium view. Since 0.4.0 (slice 043a, enforced from slice 044): `answers[].refusalJustification` is always absent here, for every reader'
      required: [current, queue, deliveredCount, openCount]
      properties:
        current:
          oneOf:
            - { $ref: '#/components/schemas/Question' }
            - { type: 'null' }
        queue: { type: array, items: { $ref: '#/components/schemas/Question' } }
        deliveredCount: { type: integer }
        openCount: { type: integer }
    Cockpit:
      type: object
      additionalProperties: false
      description: >-
        Since 0.4.5 (slice 061): the control desk figures of one meeting (`getMeetingCockpit`). Every
        leaf path is listed with its source in the report `leitstand` of the evaluation catalogue
        (`apps/api/src/metrics/catalog.json`). "Open" is the catalogue definition of slice 033b: status
        not in delivered, closed, withdrawn, merged.
      required: [meetingId, asOf, meetingStatus, totals, openByStatus, openByUnit, openUnassigned, oldestOpen, inflow, legalReview]
      properties:
        meetingId: { type: string, maxLength: 200 }
        asOf: { type: string, format: date-time, description: 'Computation time from the service clock' }
        meetingStatus: { $ref: '#/components/schemas/MeetingStatus' }
        debateClosedAt: { type: string, format: date-time }
        totals:
          type: object
          additionalProperties: false
          required: [captured, open, staged, answered]
          properties:
            captured: { type: integer, minimum: 0, description: 'All questions of the meeting' }
            open: { type: integer, minimum: 0, description: 'Questions without a final status (033b "open")' }
            staged: { type: integer, minimum: 0, description: 'Questions on the podium queue' }
            answered: { type: integer, minimum: 0, description: 'Questions read out: delivered and closed' }
        openByStatus:
          type: object
          additionalProperties: false
          description: Open questions per station (the seven open statuses)
          required: [captured, classified, assigned, answer_drafted, in_review, approved, staged]
          properties:
            captured: { type: integer, minimum: 0 }
            classified: { type: integer, minimum: 0 }
            assigned: { type: integer, minimum: 0 }
            answer_drafted: { type: integer, minimum: 0 }
            in_review: { type: integer, minimum: 0 }
            approved: { type: integer, minimum: 0 }
            staged: { type: integer, minimum: 0 }
        openByUnit:
          type: object
          description: Open questions per answering unit id of the meeting; every unit is a key, also with 0
          maxProperties: 200
          additionalProperties: { type: integer, minimum: 0 }
        openUnassigned: { type: integer, minimum: 0, description: 'Open questions without an answering unit' }
        oldestOpen:
          type: object
          additionalProperties: false
          required: [ageSeconds, items]
          properties:
            ageSeconds: { type: integer, minimum: 0, description: 'Age of the oldest open question since capture; 0 without one; independent of the reference filter' }
            items:
              type: array
              maxItems: 4
              description: Oldest first, ties by `number`; only questions the reader may read
              items: { $ref: '#/components/schemas/CockpitOldestRef' }
        inflow:
          type: object
          additionalProperties: false
          required: [binSeconds, bins, last5m]
          properties:
            binSeconds: { type: integer, enum: [300] }
            bins:
              type: array
              minItems: 12
              maxItems: 12
              description: >-
                Captures per 300 s window over the last hour; `bins[11]` = `last5m` (age 0 to 300 s
                inclusive), `bins[i]` for i < 11 counts ages in (300·(11−i), 300·(12−i)]
              items: { type: integer, minimum: 0 }
            last5m: { type: integer, minimum: 0, description: 'As `hv_questions_captured_last_5m`' }
        legalReview:
          type: object
          additionalProperties: false
          required: [over10m, items]
          properties:
            over10m: { type: integer, minimum: 0, description: 'As `hv_questions_in_legal_review_over_10m`' }
            items:
              type: array
              maxItems: 50
              description: Longest waiting first; only questions the reader may read
              items: { $ref: '#/components/schemas/CockpitReviewRef' }
    CockpitOldestRef:
      type: object
      additionalProperties: false
      description: 'Since 0.4.5 (slice 061): a reference to an open question in `Cockpit.oldestOpen`; no text, no speaker, no actor'
      required: [id, number, status, ageSeconds, statusAgeSeconds]
      properties:
        id: { type: string, maxLength: 200 }
        number: { type: string, maxLength: 200 }
        status: { $ref: '#/components/schemas/QuestionStatus' }
        unitId: { type: string, maxLength: 200 }
        ageSeconds: { type: integer, minimum: 0, description: 'Seconds since capture' }
        statusAgeSeconds: { type: integer, minimum: 0, description: 'Seconds since the last status change' }
    CockpitReviewRef:
      type: object
      additionalProperties: false
      description: 'Since 0.4.5 (slice 061): a reference to a question in legal clearing over 10 minutes; no text, no speaker, no actor'
      required: [id, number, status, ageSeconds, statusAgeSeconds, reviewAgeSeconds]
      properties:
        id: { type: string, maxLength: 200 }
        number: { type: string, maxLength: 200 }
        status: { $ref: '#/components/schemas/QuestionStatus' }
        unitId: { type: string, maxLength: 200 }
        ageSeconds: { type: integer, minimum: 0, description: 'Seconds since capture' }
        statusAgeSeconds: { type: integer, minimum: 0, description: 'Seconds since the last status change' }
        reviewAgeSeconds: { type: integer, minimum: 0, description: 'Waiting time in legal clearing by the 033b definition; a new refusal proposal restarts it' }
    QuestionLegalClearedPayload:
      type: object
      description: >
        Payload of `QuestionLegalCleared` (since 0.2.0): legal (Recht) has cleared the current
        answer version (Rechtsfreigabe), or a podium question without an answer. The clearing is
        a recommendation, not the approval itself, which stays with `question.approve` (register E25).
        Emitted by `clearQuestionLegally` from slice 021c.
      required: [questionId]
      properties:
        questionId:
          type: string
          description: Same value as the event's `subjectId`, repeated so the payload is self-contained for neighbouring systems
        answerVersion: { type: integer, minimum: 1, description: The answer version the clearing is bound to }
        note: { type: string, description: 'Optional remark of the clearing lawyer (Anmerkung). Since 0.4.2 (slice 044a): only in the stored original; absent from every `EventRead`, for every reader (see `EventRead`)' }
    ForwardReasonCode:
      type: string
      description: >-
        Since 0.4.3 (slice 048): the reason for forwarding a question to another answering unit, as a
        closed code. Deliberately no free text and no personal data, also not for `other` (owner
        question 5 of spec 048), so the payload of `QuestionForwarded` keeps the envelope invariant
        "new payload fields outside `pii` are free of personal data". `wrong_unit`: the question was
        assigned to the wrong unit. `expertise_elsewhere`: the expertise for the answer lies with
        another unit. `capacity`: the unit cannot answer in time. `other`: any other reason.
      enum: [wrong_unit, expertise_elsewhere, capacity, other]
    ForwardRequest:
      type: object
      description: 'Since 0.4.3 (slice 048): body of `forwardQuestion`. Closed (`additionalProperties: false`): the target unit and a reason code, nothing else'
      required: [unitId, reasonCode]
      additionalProperties: false
      properties:
        unitId: { type: string, minLength: 1, maxLength: 128, description: 'The target answering unit (Fachbereich) of the meeting; never a person' }
        reasonCode: { $ref: '#/components/schemas/ForwardReasonCode' }
    QuestionForwardedPayload:
      type: object
      description: >-
        Since 0.4.3 (slice 048): payload of `QuestionForwarded`, written by `forwardQuestion`; the
        event's `subjectId` is the question. Free of personal data, unmasked in `EventRead`, never part
        of `Question`. Closed, so no free text can join the reason on the read path. `fromUnitId` is
        absent when the question had no unit before. The status is not in the payload: it stays, the
        transition table says so.
      required: [unitId, reasonCode]
      additionalProperties: false
      properties:
        unitId: { type: string, minLength: 1, maxLength: 128, description: 'The answering unit the question was forwarded to' }
        fromUnitId: { type: string, maxLength: 128, description: 'The answering unit that held the question before' }
        reasonCode: { $ref: '#/components/schemas/ForwardReasonCode' }
    AgendaItemEventPayload:
      type: object
      description: 'Since 0.3.0 (slice 025): payload of `AgendaItemOpened`, `VotingOpened` and `VotingClosed`; the event''s `subjectId` is the meeting. `number` is required (Codex round 5) because it is there for readers without the master data — an optional copy would fail exactly them'
      required: [agendaItemId, number]
      properties:
        agendaItemId: { type: string }
        number: { type: integer, minimum: 1, description: 'Agenda item number at the time of the event, for readers without the master data' }
    RoleAssignedPayload:
      type: object
      description: >-
        Since 0.3.0 (slice 026, ADR 0004): payload of `RoleAssigned`; the event's `subjectId` is the
        assignment id, the event's `personId` the person when known. Carries every field
        `RoleAssignment` projects that is not in the envelope (`deputyForSubjectId` included, Codex
        round 5). One payload per event type (split in round 5), so a field of one type cannot appear
        on the other.
      required: [assignmentId, subjectId, role]
      properties:
        assignmentId: { type: string }
        subjectId: { $ref: '#/components/schemas/SubjectId', description: 'Pseudonymous subject id of the identity provider or the demo actor id — never a name or an e-mail address (ADR 0009)' }
        role: { $ref: '#/components/schemas/Role' }
        unitId: { type: string }
        expiresAt: { type: string, format: date-time }
        deputyForSubjectId: { $ref: '#/components/schemas/SubjectId' }
        reason: false
    RoleRevokedPayload:
      type: object
      description: 'Since 0.3.0 (slice 026): payload of `RoleRevoked`; the event''s `subjectId` is the assignment id. `reason` is the administrator''s text from `revokeRole` and holds no personal data (ADR 0009; prose — a schema cannot inspect free text)'
      required: [assignmentId, subjectId, role]
      properties:
        assignmentId: { type: string }
        subjectId: { $ref: '#/components/schemas/SubjectId', description: 'Pseudonymous subject id, as on `RoleAssigned`' }
        role: { $ref: '#/components/schemas/Role' }
        reason: { type: string, minLength: 1, description: 'Revocation reason, when given' }
        unitId: false
        expiresAt: false
        deputyForSubjectId: false
    AgendaItemsReplacedPayload:
      type: object
      description: >-
        Since 0.4.1 (slice 040b): payload of `AgendaItemsReplaced` (`replaceMeetingAgendaItems`); the
        event's `subjectId` is the meeting. The whole agenda after the change, server ids filled in.
        Progress timestamps are not part of it: an item that keeps its `id` keeps them in the
        projection.
      required: [agendaItems]
      properties:
        agendaItems:
          type: array
          items:
            type: object
            required: [id, number, title]
            properties:
              id: { type: string }
              number: { type: integer, minimum: 1 }
              title: { type: string }
    UnitsReplacedPayload:
      type: object
      description: 'Since 0.4.1 (slice 040b): payload of `UnitsReplaced` (`replaceMeetingUnits`); the event''s `subjectId` is the meeting. The whole unit list after the change, server ids filled in'
      required: [units]
      properties:
        units: { type: array, items: { $ref: '#/components/schemas/Unit' } }
    StageSeatsReplacedPayload:
      type: object
      description: >-
        Since 0.4.1 (slice 040b): payload of `StageSeatsReplaced` (`replaceMeetingStageSeats`); the
        event's `subjectId` is the meeting. The whole seat list after the change, server ids filled
        in. The stored original keeps `personId` and `deviceId`; `EventRead` removes `personId` from
        every seat (`StageSeatRead`), and only holders of `event.read` read `deviceId` there.
      required: [stageSeats]
      properties:
        stageSeats: { type: array, items: { $ref: '#/components/schemas/StageSeat' } }
    StageSeatRead:
      description: >-
        Since 0.4.1 (slice 040b): a podium seat inside an `EventRead` payload (`StageSeatsReplaced`,
        `MeetingCreated`). Like `StageSeat`, but `personId` is never present (ADR 0009/0013; the
        core's `maskEvent` removes it at any depth).
      allOf: [ { $ref: '#/components/schemas/StageSeat' } ]
      properties:
        personId: false
    MeetingCreatedReadPayload:
      type: object
      description: >-
        Since 0.4.1 (slice 040b): the part of the `MeetingCreated` payload that `EventRead` binds. The
        payload stays open otherwise; its optional `stageSeats` (seed, cloning from slice 040c) has the
        form of `StageSeatsReplacedPayload.stageSeats`, read without `personId`.
      additionalProperties: true
      properties:
        stageSeats: { type: array, items: { $ref: '#/components/schemas/StageSeatRead' } }
    PiiEnvelope:
      type: object
      description: >-
        Since 0.3.0 (slice 024, ADR 0009/0011): the only part of a payload that may carry personal
        data. `keyId` names the key of the meeting (per Jahrgang) behind the codec port; in the beta
        the codec is the identity codec, but `keyId` is set from the first event so switching the key
        on later is an export into a new database, never a change to the log. Every other field of the
        payload is free of personal data; events carry `personId`, never a clear name.
      required: [keyId]
      properties:
        keyId: { type: string }
      additionalProperties: true
    StreamTopic:
      type: string
      enum: [meeting, speakers, contributions, questions, stage, roles]
      description: >-
        Since 0.3.11 (slice 035a): an area of the read views a `change` message touches. `meeting` —
        the meeting and its counters (`getMeeting`); `speakers` — the list of speakers; `contributions` —
        speeches; `questions` — questions, their history and answer versions; `stage` — the podium view
        (`getStage`); `roles` — role assignments (for readers without `admin.roles.manage` only their
        own). The client reloads the read views of a topic it receives. A client ignores an unknown
        topic (additive enum values may appear within 0.3.x).
    StreamChange:
      type: object
      description: >-
        Since 0.3.11 (slice 035a): `data` of the SSE message `change`. A change signal without content
        for a reader without `event.read`: which areas changed and, where the reader may read them,
        which items. It merges all events of one delivery; its SSE `id` is `seq`.
      required: [seq, topics]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1, maximum: 9007199254740991, description: 'Global sequence number of the last event this message covers (for a catch-up: the head)' }
        topics: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/StreamTopic' } }
        subjects:
          type: array
          maxItems: 100
          uniqueItems: true
          items: { type: string }
          description: >-
            Ids of the changed items the reader may read (questions, speakers, contributions, role
            assignments). Counter changes never carry an id. Absent when no readable item is named or
            when more than 100 would be named; the client then reloads the topics as a whole.
        meetingId: { type: string, description: 'The meeting (Jahrgang) the covered events belong to, when it is one' }
        replay: { type: boolean, const: true, description: 'Present only on the single `change` of a catch-up (`(cursor, head]`)' }
    StreamCursor:
      type: object
      description: >-
        Since 0.3.11 (slice 035a): `data` of the SSE message `cursor`; its SSE `id` is `seq`. Sent first
        on a stream opened without a cursor, right after a completed catch-up, and with the heartbeat
        when the head moved on through events the reader cannot see.
      required: [seq]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 0, maximum: 9007199254740991, description: 'The current head: the highest global sequence number (0 while the log is empty)' }
    StreamReset:
      type: object
      description: >-
        Since 0.3.11 (slice 035a): `data` of the SSE message `reset`, sent **without** an SSE `id`. The
        cursor cannot be resumed (catch-up over 1000 events, cursor beyond the head, or an item may have
        left the reader's read scope). The service closes the stream. The client discards its state and
        reconnects without `after` and without `Last-Event-ID`; an `EventSource` client creates a new
        instance for that. `lastSeq` is informative and never a cursor.
      required: [lastSeq]
      additionalProperties: false
      properties:
        lastSeq: { type: integer, minimum: 0, maximum: 9007199254740991, description: 'The head when the reset was sent; not to be used as a cursor' }
    StreamEnd:
      type: object
      description: >-
        Since 0.3.11 (slice 035a): `data` of the SSE message `end`, sent without an SSE `id`; the service
        closes the stream after it. Reasons: `session` (session expired or signed out), `forbidden` (no
        active role assignment any more), `roles_changed` (role assignments changed), `rotate` (the
        service ends long connections), `unavailable` (the service cannot deliver reliably now). After
        `roles_changed`, `rotate` and `unavailable` the client reconnects with its last `id`.
      required: [reason]
      additionalProperties: false
      properties:
        reason: { type: string, enum: [session, forbidden, roles_changed, rotate, unavailable] }
    EventRead:
      type: object
      description: >-
        Standard read projection of a stored Event (slice 026, ADR 0009/0013/0015), returned by
        question history, the global event feed and each SSE `event` message of `/stream` (readers with
        `event.read`; since 0.3.11 other readers receive `StreamChange` instead). The original Event is
        unchanged in the append-only log. This projection omits personId, payload.pii, historical
        clear-name fields, hash and prevHash. sourceHash identifies the stored original; it is not a
        digest of this redacted JSON and cannot be recomputed from it. Only the complete stored
        original can be checked against the hash chain. seq remains the global cursor. Since 0.4.2
        (slice 044a, SG2): `payload.pii` stays absent as before, and with it the justification of a
        refusal (`pii.refusalJustification`); and `payload.note` of a `QuestionLegalCleared` (the remark
        of the clearing lawyer) is absent from every event read path (`getQuestionHistory`,
        `listEvents`, `event` messages of `streamEvents`), for every reader and for every legal
        clearance, not only for refusals, because the remark can carry the legal assessment behind a
        refusal. The removal is bound to that event type, not to the key: a `note` in another payload
        is not affected, so the schema carries no `note: false`. The stored original keeps the remark
        under the hash chain (rule 7). Built on the default ("auf Standard gebaut").
      required: [seq, id, type, at, actor, subjectId, payload, redacted, sourceHash]
      additionalProperties: false
      properties:
        seq: { type: integer, minimum: 1 }
        id: { type: string }
        type: { $ref: '#/components/schemas/Event/properties/type' }
        at: { type: string, format: date-time }
        actor:
          type: object
          required: [id, role]
          additionalProperties: false
          properties:
            id: { type: string }
            role: { $ref: '#/components/schemas/Role' }
        subjectId: { type: string }
        schemaVersion: { type: integer, minimum: 2 }
        meetingId: { type: string }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128 }
        causationId: { type: string }
        recordedAt: { type: string, format: date-time }
        occurredAt: { type: string, format: date-time }
        occurredAtSource: { $ref: '#/components/schemas/OccurredAtSource' }
        retentionClass: { $ref: '#/components/schemas/RetentionClass' }
        legalHold: { type: boolean }
        redacted: { type: boolean, const: true }
        sourceHash:
          description: SHA-256 of the complete stored original Event, never of this redacted read projection.
          allOf: [ { $ref: '#/components/schemas/Sha256Hex' } ]
        payload:
          type: object
          additionalProperties: true
          properties:
            pii: false
            personId: false
            displayName: false
            organisation: false
            answer:
              type: object
              additionalProperties: true
              properties:
                createdBy:
                  type: object
                  additionalProperties: true
                  properties:
                    personId: false
                    displayName: false
                # Since 0.4.0 (slice 043a, SG2): the justification of a refusal never leaves the service
                # through an event read path, for any reader; `maskEvent` does not know the reader.
                refusalJustification: false
                # Since 0.4.4 (slice 055): the stored document is the closed stored form.
                body: { $ref: '#/components/schemas/AnswerBody' }
      allOf:
        - if: { required: [type], properties: { type: { const: QuestionLegalCleared } } }
          then: { properties: { payload: { $ref: '#/components/schemas/QuestionLegalClearedPayload' } } }
        - if: { required: [type], properties: { type: { enum: [AgendaItemOpened, VotingOpened, VotingClosed] } } }
          then: { required: [subjectId], properties: { payload: { $ref: '#/components/schemas/AgendaItemEventPayload' } } }
        - if: { required: [type], properties: { type: { enum: [MeetingStarted, MeetingClosed, DebateClosed] } } }
          then: { required: [subjectId] }
        - if: { required: [type], properties: { type: { enum: [MeetingStarted, MeetingClosed] } } }
          then: { properties: { payload: { type: object, maxProperties: 0 } } }
        - if: { required: [type], properties: { type: { const: RoleAssigned } } }
          then: { required: [subjectId], properties: { payload: { $ref: '#/components/schemas/RoleAssignedPayload' } } }
        - if: { required: [type], properties: { type: { const: RoleRevoked } } }
          then: { required: [subjectId], properties: { payload: { $ref: '#/components/schemas/RoleRevokedPayload' } } }
        # Since 0.4.1 (slice 040b): master-data events. A seat in a read payload never carries
        # `personId` (`StageSeatRead`), for `StageSeatsReplaced` and for the optional seat list of
        # `MeetingCreated` alike, so the masking rule for seats stands in one place.
        - if: { required: [type], properties: { type: { const: AgendaItemsReplaced } } }
          then: { required: [subjectId], properties: { subjectId: { type: string }, payload: { $ref: '#/components/schemas/AgendaItemsReplacedPayload' } } }
        - if: { required: [type], properties: { type: { const: UnitsReplaced } } }
          then: { required: [subjectId], properties: { subjectId: { type: string }, payload: { $ref: '#/components/schemas/UnitsReplacedPayload' } } }
        - if: { required: [type], properties: { type: { const: StageSeatsReplaced } } }
          then:
            required: [subjectId]
            properties:
              subjectId: { type: string }
              payload:
                allOf: [ { $ref: '#/components/schemas/StageSeatsReplacedPayload' } ]
                properties: { stageSeats: { items: { $ref: '#/components/schemas/StageSeatRead' } } }
        - if: { required: [type], properties: { type: { const: MeetingCreated } } }
          then: { properties: { payload: { $ref: '#/components/schemas/MeetingCreatedReadPayload' } } }
        # Since 0.4.3 (slice 048): the forward payload is closed on the read path, so "no free text
        # with the reason code" is contract, not prose.
        - if: { required: [type], properties: { type: { const: QuestionForwarded } } }
          then: { properties: { payload: { $ref: '#/components/schemas/QuestionForwardedPayload' } } }
    Event:
      type: object
      description: >
        One immutable stored fact, distinct from the redacted EventRead response. The sequence number is global and gap-free. Payload schemas are bound per
        event type additively: `QuestionLegalCleared` carries `QuestionLegalClearedPayload`,
        `AgendaItemOpened`/`VotingOpened`/`VotingClosed` carry `AgendaItemEventPayload`,
        `RoleAssigned` carries `RoleAssignedPayload`, `RoleRevoked` `RoleRevokedPayload`, and since 0.4.1
        (slice 040b) `AgendaItemsReplaced`, `UnitsReplaced` and `StageSeatsReplaced` carry
        `AgendaItemsReplacedPayload`, `UnitsReplacedPayload` and `StageSeatsReplacedPayload` (bound with nested
        `if`/`then`/`else`, invisible to the generated types); the three master-data events name the
        meeting in `subjectId`, carry the whole list and raise `Meeting.version`. Since 0.4.1 (slice
        040b) `MeetingCreated` may carry an optional `stageSeats` list in the same form as
        `StageSeatsReplaced` (seed; cloning from slice 040c); without it the meeting has no seats.
        In `EventRead` no seat carries `personId` (`StageSeatRead`). `MeetingStarted` and `MeetingClosed`
        name the meeting in `subjectId` and have empty payloads. `DebateClosed` also names the meeting
        in `subjectId` but projects only its recorded time to `Meeting.debateClosedAt`; all other payloads
        remain open objects. A late `ContributionCaptured` carries `lateEntry: true` and the
        `lateEntryReason` in its payload (R-MTG-03, slice 025). Since 0.4.0 (slice 043a, written from
        slice 044): the `AnswerDrafted` payload of a refusal (`proposeRefusal`) carries in `answer` the
        fields `answerKind`, `refusalGroundId`, `refusalGroundHash` and a snapshot `refusalGround`
        (`title`, `stageText`, `legalRef` of the catalogue entry at the proposal, from which the hash
        can be recomputed). Since 0.4.2 (slice 044a; correction of the 0.4.0 wording, which placed the
        justification in `answer`): the justification of a refusal is never written into `answer`; it
        stands only in `payload.pii` (`PiiEnvelope`) as `pii.refusalJustification`, next to `pii.keyId`
        (the meeting), so it is personal data under ADR 0009 and never reaches an `EventRead`. The
        same payload carries `toStatus`, the target status taken from the transition table (a value of
        `QuestionStatus`, `in_review` for a proposal); only `proposeRefusal` writes it, an
        `AnswerDrafted` without `toStatus` (every `draftAnswer`) leads to `answer_drafted` as before,
        and the projection treats a value outside `QuestionStatus` the same way. The `AnswerDrafted` of
        `proposeRefusal` and the `QuestionApproved` of `approveRefusal` carry `retentionClass`
        `record` (Niederschrift-relevant, DSFA V7); every other answer event keeps `working` for now.
        Built on the defaults ("auf Standard gebaut", ADR 0012 proposed, not read by legal). Since 0.4.4
        (slice 055) `AnswerDrafted.answer.body` is the stored form `AnswerBody` (a `draftAnswer` with `body`).
        A bound payload schema for `AnswerDrafted` follows with slice 043c.
        Envelope v2 (Umschlag, since 0.3.0, ADR 0011, filled by slice 024): `schemaVersion`,
        `meetingId`, `idempotencyKey`, `causationId`, `prevHash`/`hash` (SHA-256 over canonical JSON of
        the envelope without `hash`), `recordedAt` (authoritative, server clock), `occurredAt` with
        `occurredAtSource`, `retentionClass`, `legalHold`, `personId`, `payload.pii` with `keyId`. All
        of them optional in 0.3.0; the ones marked "Pflicht ab 0.3.6" become required with slice 028.
        Invariants the schema enforces (`dependentRequired`, `dependentSchemas`): `occurredAt` and
        `occurredAtSource` come together; `hash` and `prevHash` come together; a `schemaVersion`
        requires the v2 envelope of slice 024 (`prevHash`, `hash`, `recordedAt`, `occurredAt`,
        `occurredAtSource`, `retentionClass`, `legalHold`; `meetingId` joins with 0.3.6, because the
        core carries it only from 025) and forbids `actor.displayName` and binds the genesis
        (`prevHash` empty exactly at `seq` 1, a SHA-256 from `seq` 2 on); conversely none of those seven
        fields appears without `schemaVersion`, so a half envelope never validates; the agenda and
        role events require `subjectId`. A stored v1 event is upcast on load before EventRead is
        served; HTTP responses never carry schemaVersion 1. Prose only, because JSON
        Schema cannot compare two values: `at` equals `recordedAt`; for source `server`, `occurredAt`
        equals `recordedAt`; `legalHold` is `false` in the beta. A broken chain is a load error naming
        the `seq` (slice 024). New payload fields outside `pii` are free of personal data from slice
        026. Historical `SpeakerRegistered` payloads can retain `displayName` and `organisation` in
        the stored original; EventRead removes them without changing that original or its hash.
      required: [seq, id, type, at, actor, payload, schemaVersion, meetingId, prevHash, hash, recordedAt, occurredAt, occurredAtSource, retentionClass, legalHold]
      properties:
        seq: { type: integer, minimum: 1, description: 'Global, gap-free, starting at 1 (the first event of the log). Gap-freeness across events is prose (a single-item schema cannot see its neighbours); the service checks it on load (slice 024).' }
        id: { type: string }
        type:
          type: string
          enum:
            - MeetingCreated
            - MeetingStarted
            - MeetingClosed
            - SpeakerRegistered
            - SpeakersReordered
            - SpeakerUpdated
            - ContributionCaptured
            - ContributionClaimed
            - ContributionReleased
            - QuestionCaptured
            - QuestionClassified
            - QuestionAssigned
            - QuestionForwarded
            - QuestionClaimed
            - QuestionReleased
            - AnswerDrafted
            - QuestionSubmittedForReview
            - QuestionLegalCleared
            - QuestionApproved
            - QuestionReturned
            - QuestionStaged
            - QuestionDelivered
            - QuestionClosed
            - QuestionWithdrawn
            - QuestionMerged
            - AgendaItemOpened
            - VotingOpened
            - VotingClosed
            - DebateClosed
            - RoleAssigned
            - RoleRevoked
            - IdempotencyRecorded
            - ConfigFrozen
            - AgendaItemsReplaced
            - UnitsReplaced
            - StageSeatsReplaced
        at: { type: string, format: date-time, description: 'Recorded time (server clock). Since 0.3.0 the same instant as `recordedAt`, which is the name ADR 0011 gives it; `at` stays for 0.x readers.' }
        actor: { $ref: '#/components/schemas/EventActor' }
        subjectId: { type: string, description: Id of the aggregate the event belongs to }
        schemaVersion: { type: integer, minimum: 2, description: 'Since 0.3.0: envelope version, `2` from slice 024. Never `1` on the wire (minimum 2, Opus recheck on 8ef3ad2): v1 events exist only in JSONL dev data and are upcast on load, so an event without `schemaVersion` is a 0.2 event of the unchanged service. Pflicht ab 0.3.6, Scheibe 028.' }
        meetingId: { type: string, description: 'Since 0.3.0 (ADR 0011): the meeting (Jahrgang) the event belongs to. Pflicht ab 0.3.6, Scheibe 028.' }
        idempotencyKey: { type: string, minLength: 1, maxLength: 128, description: 'Since 0.3.0: the `Idempotency-Key` of the write that produced the event, when the client sent one; replays after a restart are answered from it (slice 028)' }
        commandId: { type: string, description: 'Since 0.3.6 (slice 028): non-personal identifier shared by all events of one committed command.' }
        commandOperation: { type: string, description: 'Since 0.3.6 (slice 028): stable fachliche operation for reconstructing an idempotent result; never request body or personal content.' }
        commandResource: { type: string, description: 'Since 0.3.6 (slice 028): stable resource scope for an idempotent command, without personal content.' }
        causationId: { type: string, description: 'Since 0.3.0: id of the event that caused this one (e.g. the intention a podium device buffered offline), when any' }
        prevHash: { type: string, pattern: '^(?:[0-9a-f]{64})?$', description: 'Since 0.3.0: `hash` of the previous event in the global chain; the first event (`seq` 1) carries the empty string (genesis), every later one 64 lower-case hex digits (Codex on 50cc738 and f611116; bound to `seq` under `dependentSchemas.schemaVersion`). Pflicht ab 0.3.6, Scheibe 028.' }
        hash: { $ref: '#/components/schemas/Sha256Hex', description: 'Since 0.3.0: SHA-256 (lower-case hex, Codex on 50cc738) over the canonical JSON of this envelope without `hash`. Pflicht ab 0.3.6, Scheibe 028.' }
        recordedAt: { type: string, format: date-time, description: 'Since 0.3.0 (ADR 0011): the authoritative time, always from the server clock (injected clock port, rule 8); never a device time. Pflicht ab 0.3.6, Scheibe 028.' }
        occurredAt: { type: string, format: date-time, description: 'Since 0.3.0: when the fact happened according to `occurredAtSource`; equals `recordedAt` for source `server`. Pflicht ab 0.3.6, Scheibe 028.' }
        occurredAtSource:
          description: 'Pflicht ab 0.3.6, Scheibe 028.'
          allOf: [ { $ref: '#/components/schemas/OccurredAtSource' } ]
        retentionClass:
          description: 'Pflicht ab 0.3.6, Scheibe 028.'
          allOf: [ { $ref: '#/components/schemas/RetentionClass' } ]
        legalHold: { type: boolean, description: 'Since 0.3.0 (ADR 0009): `false` in the beta; a hold is set by a later event, never by editing this one. Pflicht ab 0.3.6, Scheibe 028.' }
        personId: { type: string, description: 'Since 0.3.0 (ADR 0009): the person the event is about (e.g. the speaker), as a key into the person table; masked in the standard read path (ADR 0013, `event.read.personal` from slice 047)' }
        payload:
          type: object
          additionalProperties: true
          properties:
            pii: { $ref: '#/components/schemas/PiiEnvelope' }
      # Envelope invariants (Codex round 5): the two times come together or not at all; a hash is only
      # meaningful with its predecessor (the first event's `prevHash` is the empty string); a
      # `schemaVersion` marks a complete v2 envelope as slice 024 writes it. `meetingId` is not in that
      # list: the core gets it with 025, after 024; it becomes required with 0.3.6 (028). The reverse
      # also holds (Opus recheck on 8ef3ad2, point b): a v2-only field never appears without
      # `schemaVersion`, so no half envelope passes — safe, because the 0.2.1 service sends none of them.
      dependentRequired:
        occurredAt: [occurredAtSource, schemaVersion]
        occurredAtSource: [occurredAt, schemaVersion]
        hash: [prevHash, schemaVersion]
        prevHash: [hash, schemaVersion]
        recordedAt: [schemaVersion]
        retentionClass: [schemaVersion]
        legalHold: [schemaVersion]
        schemaVersion: [prevHash, hash, recordedAt, occurredAt, occurredAtSource, retentionClass, legalHold]
      # A v2 envelope never carries a clear name of the actor (ADR 0009/0011; `EventActor.displayName`).
      # Genesis (Codex on f611116): in a v2 envelope `prevHash` is empty exactly at `seq` 1 and a
      # SHA-256 from `seq` 2 on. Under `dependentSchemas.schemaVersion`, so the events of today's
      # service (no envelope, no `prevHash`) are untouched.
      dependentSchemas:
        schemaVersion:
          properties:
            actor: { properties: { displayName: false } }
          if: { required: [seq], properties: { seq: { const: 1 } } }
          then: { properties: { prevHash: { const: '' } } }
          else: { properties: { prevHash: { $ref: '#/components/schemas/Sha256Hex' } } }
      if: { required: [type], properties: { type: { const: QuestionLegalCleared } } }
      then: { properties: { payload: { $ref: '#/components/schemas/QuestionLegalClearedPayload' } } }
      else:
        if: { required: [type], properties: { type: { enum: [AgendaItemOpened, VotingOpened, VotingClosed] } } }
        # Agenda, lifecycle, debate and role events name their aggregate (meeting or assignment)
        # in `subjectId`; DebateClosed is a fixture-only fact until the guarded operation in 087.
        then: { required: [subjectId], properties: { subjectId: { type: string }, payload: { $ref: '#/components/schemas/AgendaItemEventPayload' } } }
        else:
          if: { required: [type], properties: { type: { enum: [MeetingStarted, MeetingClosed, DebateClosed] } } }
          then:
            required: [subjectId]
            properties: { subjectId: { type: string } }
            if: { required: [type], properties: { type: { enum: [MeetingStarted, MeetingClosed] } } }
            then: { properties: { payload: { type: object, maxProperties: 0 } } }
          else:
            if: { required: [type], properties: { type: { const: RoleAssigned } } }
            then: { required: [subjectId], properties: { subjectId: { type: string }, payload: { $ref: '#/components/schemas/RoleAssignedPayload' } } }
            else:
              if: { required: [type], properties: { type: { const: RoleRevoked } } }
              then: { required: [subjectId], properties: { subjectId: { type: string }, payload: { $ref: '#/components/schemas/RoleRevokedPayload' } } }
              # Since 0.4.1 (slice 040b): the master-data events name the meeting in `subjectId` and
              # carry the whole list.
              else:
                if: { required: [type], properties: { type: { const: AgendaItemsReplaced } } }
                then: { required: [subjectId], properties: { subjectId: { type: string }, payload: { $ref: '#/components/schemas/AgendaItemsReplacedPayload' } } }
                else:
                  if: { required: [type], properties: { type: { const: UnitsReplaced } } }
                  then: { required: [subjectId], properties: { subjectId: { type: string }, payload: { $ref: '#/components/schemas/UnitsReplacedPayload' } } }
                  else:
                    if: { required: [type], properties: { type: { const: StageSeatsReplaced } } }
                    then: { required: [subjectId], properties: { subjectId: { type: string }, payload: { $ref: '#/components/schemas/StageSeatsReplacedPayload' } } }

    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [questions, stage]
      operationId: stageQuestion
      summary: Put an approved question on the podium queue (Auf die Bühne legen)
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/QuestionUpdated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /questions/{questionId}/delivery:
    parameters: [ { $ref: '#/components/parameters/QuestionId' } ]
    post:
      tags: [questions, stage]
      operationId: deliverQuestion

      summary: Propose a refusal (Verweigerung vorschlagen) as a new answer version
      description: >-
        Since 0.4.0 (slice 043a; pre-declared in `allowlist.json`, served from slice 044). Permission
        `question.refuse.propose` (R-PERM-01 otherwise). Creates a new, immutable answer version with
        `answerKind` `refusal_no_claim` (refusal path A) or `refusal_with_ground` (refusal path B),
        written as `AnswerDrafted`; no new event type, because a refusal is technically an answer
        version (ADR 0012). The answer version keeps `refusalGroundHash`, the `hash` of the chosen
        catalogue entry at the time of the proposal, and the event payload a snapshot
        `answer.refusalGround` (`title`, `stageText`, `legalRef`). The status transition follows the
        transition table of slice 044. A ground on path A is a `422` of the schema; an unknown
        `refusalGroundId` is a `422`. A missing ground or justification on path B is not a schema
        error but `409` R-GUARD-09 (slice 044). `refusalJustification` is masked as described in
        `info.description` ("Refusal"). Since 0.4.2 (slice 044a, built on the default "auf Standard
        gebaut"): the proposal leads straight to `in_review` (transition R-TRANS-15 from `classified`,
        `assigned`, `answer_drafted`, `in_review` or `approved`, text tracks only, R-GUARD-03); the
        event is `AnswerDrafted` with `toStatus` and the justification under `payload.pii` (see
        `Event`). `422` covers form and length — checked by the request validator of the service and
        again by the core, because the demo runs the core without the validator (ADR 0002): an
        `answerKind` other than the two refusal paths, an empty or over-long `text`, an over-long or
        non-string `refusalJustification` or `refusalGroundId`, `sources` that are not strings, a
        ground on path A — and, checked by the core only, a `refusalGroundId` that is not in the
        catalogue. A missing or blank (whitespace only) justification is never a `422` but `409`
        R-GUARD-09, on path A and on path B alike; so the validator answers `422` for an empty string
        (`minLength`) where the core answers `409` for a blank one. No `detail` repeats the text, the
        justification or a remark.

openapi: 3.1.0
info:
  title: HV-Tool API
  version: 0.4.5
  license: { name: Proprietary, identifier: LicenseRef-Proprietary }
  summary: Question-and-answer workflow for the general meeting (Hauptversammlung) of one company.
  description: |
    Single source of truth for the contract between the user interface, the application core and
    neighbouring systems. Every endpoint is implemented by the application core (`apps/api`) and, for
    the demo, by an in-process adapter that runs the same domain code inside the browser
    (`packages/domain`, see ADR 0002).

    Versioning follows ADR 0015 (Vertragsversionierung, proposed — "Versionierung nach ADR 0015,
    vorgeschlagen"): semantic versioning, every change recorded in `packages/contract/CHANGELOG.md`,
    new mandatory fields arrive optional first, removals are deprecated one cycle ahead, pre-declared
    operations live in `packages/contract/allowlist.json` with an expiry date. Two gates enforce this:
    `packages/contract/scripts/check.mjs` (version, changelog, allowlist form and expiry; run by
    `pnpm -r test`) and the operation-coverage gate of the API test suite
    (`apps/api/src/__tests__/operation-coverage.setup.ts`, since 0.3.0: every `operationId` is
    exercised by a test or pre-declared in the allowlist, and no pre-declared operation is exercised).

    Meeting scope (Jahrgang, since 0.3.0, ADR 0011 and Plan 3 "Jahrgang und Tagesordnung"): every
    speaker, contribution, question and event belongs to one meeting (`meetingId`). Canonical paths
    are `/v1/meetings/{meetingId}/…` for everything that is a collection of a meeting; an item that
    has a globally unique id of its own (`/speakers/{speakerId}`, `/contributions/{contributionId}`,
    `/questions/{questionId}/…`) is addressed by that id alone and is canonical as it is. The
    un-prefixed collection paths of 0.1/0.2 (`/meeting`, `/agenda-items`, `/units`, `/speakers`,
    `/speakers/order`, `/contributions`, `/questions`, `/stage`) stay served as an alias for the
    current meeting (aktuelle HV) until contract 0.5 and are marked `deprecated` since 0.3.0.
    `/events` and `/stream` are global (the sequence number is global and gap-free); `/stream` takes
    an optional `meetingId` filter, `/events` gets it as the contract line of the slice that serves
    it (not in 0.4.0: the unchanged service would accept and ignore it, see "Compatibility"). The
    current meeting behind the alias paths is the meeting in
    status `running` with the latest `date` (several running: the latest `date` wins, ties: the latest
    `MeetingCreated`); when none is running, the meeting with the latest `date` regardless of status;
    when no meeting exists at all, every alias answers 404 (from slice 025; until then the service
    serves its single built-in meeting).

    Authentication (since 0.3.0, ADR 0004): production uses the `session` cookie issued by the
    BFF endpoints under `/auth` (slice 029); the demo uses the `demoActor` header. The browser never
    holds a token. Operations reachable without any credential carry `security: []`: `/healthz`,
    `/readyz`, `/auth/login`, `/auth/callback`, `/auth/transparency-notice`. `/metrics` is for the
    scraper only and takes the `metricsBearer` token from the service configuration. `/healthz`,
    `/readyz`, `/metrics` and `/auth/*` live outside `/v1` (per-path `servers`).

    Compatibility within a major version: the 0.3.x cycle is closed. 0.4.0 (slice 043a) is the one
    non-additive step of the 0.4 cycle (ADR 0015): it removes the fields deprecated since 0.2.0
    (`kind` and `requestedMinutes` on `Speaker`, `SpeakerRegistration` and `SpeakerUpdate`) and
    narrows `SpeakerUpdate` by the enumerated `reason`. A client that still sends a removed field is
    not rejected: no existing schema forbids unknown properties, and the core writes only named
    fields, so the value is ignored. Within 0.4.x the additive rules of 0.3.x apply unchanged:
    additive enum values within the cycle may appear in patch releases (ADR 0015; precedent 0.2.1;
    the 0.3.0 package added `Action` +12, `Event.type` +10, `Contribution.source` +`paper` and
    `ReadinessCheckCode`); optional fields are added. A client must ignore an unknown enum value in
    a response (skip the event, hide the action), ignore an unknown optional field and not fail on
    a documented status it has not seen before. A removal is deprecated one cycle ahead (ADR 0015);
    the alias paths, `StageAssignment` and `EventActor.displayName` stay until 0.5. Request schemas
    of existing operations are never widened by a contract-only release: the service validates
    every request against this document and passes the raw body on, so a widening would take effect
    immediately while the core silently drops the field (review 023). A later request field
    therefore arrives as the contract line of the slice that implements it, written by the
    architect before any code, and is always optional; where a rule needs the field, a guard of that
    slice enforces it with `409` and a rule id, never the schema.

    Refusal (since 0.4.0, slice 043a; behaviour from slice 044; Verweigerung, ADR 0012 model A):
    a refusal is a kind of answer, not a status of its own. An answer version carries `answerKind`
    (`answer`, `refusal_no_claim` = refusal path A "no right to information", `refusal_with_ground` =
    refusal path B "refusal despite a right", with a ground from the catalogue); the eleven statuses
    stay, and four-eyes approval (R-GUARD-06) and the legal gate before the podium (R-GUARD-07) apply
    to a refusal as to any answer. Refusal
    paths A/B are not the answer tracks (`Track`). A refusal is proposed with `proposeRefusal`
    (permission `question.refuse.propose`) and approved with `approveRefusal`
    (`question.refuse.approve`), never through `draftAnswer` or `approveQuestion`: those two
    request schemas carry no `answerKind`, so a refusal can never slip in as an ordinary answer. The
    catalogue of grounds is read with `listRefusalGrounds`; every entry carries `hash`, and the
    answer version keeps that hash as `refusalGroundHash` at the time of the proposal (the audit
    path of the catalogue; from slice 044 an approval against a changed entry is `409` R-GUARD-11).
    The justification (`refusalJustification`) is a legal assessment (SG2) and reaches only holders
    of `question.refuse.propose` or `question.refuse.approve`, never through `question.legal.clear`
    and never an administrator: on `Question.answers` (`getQuestion`, `listQuestions`,
    `listMeetingQuestions` and every `QuestionUpdated` response) it is absent for every other
    reader; in `StageView` (`getStage`, `getMeetingStage`) it is always absent; in `EventRead`
    (`getQuestionHistory`, `listEvents`, `event` messages of `streamEvents`) it is absent for every
    reader (schema `false`); the full-text search `q` never matches it. The stored original event
    keeps it under the hash chain (rule 7), since 0.4.2 (slice 044a) only in `payload.pii`, never in
    `payload.answer` (see `Event`). The three operations are pre-declared in
    `allowlist.json` (slice 044) and not served before then.

    Conventions (see docs/ist-analyse-und-schnittstellen.md, section 6):
    - Writes may carry an `Idempotency-Key`; after authentication and current rights checks, a
      confirmed replay returns the original fachliche result with current identity masking and
      `_actions`. A revoked or expired role gets 403, not a cached response (slice 028).
    - Resources carry an `ETag`; state-changing calls send `If-Match` and receive `412` on conflict.
      `If-Match` is optional in 0.3.0 and becomes mandatory in 0.3.6 (slice 028, `428` without it).
    - Errors are RFC 9457 problem details.
    - Every response of a question includes `_actions`: the actions the calling actor may perform
      now. The interface renders only what the server allows; it never derives rights from role names.
    - Time is UTC, ISO 8601. The server clock is the only source of time for legally relevant events
      (`recordedAt`, ADR 0011); every response carries `X-Server-Time` (from slice 033) so clients
      can compute their offset (slice 032).
    - Vocabulary follows the house glossary (docs/glossar.md). German terms in parentheses.

    Limits (since 0.3.10, slice 034a): a request body is limited to 262 144 bytes (`413`); a request
    that exceeds the service's time budget is answered `408` (with Postgres: nothing was committed;
    not for the sign-in paths, which have their own bounds). Quotas per subject (writes, reads) and
    per source (requests without a session, sign-in starts, probes, CORS preflights) answer `429` with
    `Retry-After` (whole seconds, 1 to 60); the values are configurable, the defaults live in the
    service. `503` `PersistenceBusy` (`Retry-After` 2 or 30) means the persistence is busy or
    migrations are pending; nothing was written. `500` "Persistence outcome is unknown." means a
    write may have been committed: the client reads the state again before it writes anew, or repeats
    only with the same `Idempotency-Key`. Since 0.4.0 every operation documents `500`
    (`InternalError`, with its four fixed `detail` texts). Every response of the service carries the security headers
    `Content-Security-Policy`, `X-Content-Type-Options`, `X-Frame-Options`, `Referrer-Policy`,
    `Cross-Origin-Resource-Policy`, `Cross-Origin-Opener-Policy`, `Strict-Transport-Security` and
    `Cache-Control: no-store`. Double-click protection: a client creates exactly one
    `Idempotency-Key` per user intention (key press), reuses it when it repeats after `408`, `429`,
    `503`, `5xx` or a network error, and never uses it for a second intention; `429` and `503` consume
    no key, and neither does `408` in the service with Postgres. Length and list limits of request
    schemas were added in this release (see the CHANGELOG).

    Stream (since 0.3.11, slice 035a; served from slice 035b): `/stream` delivers per reader what the
    reader may read at delivery time (rule R-PERM-04). A reader with `event.read` receives the masked
    events (`EventRead`), everyone else content-free change signals (`StreamChange`) naming topics and
    readable ids only. Without a cursor the stream starts at the head and sends `cursor` first; a
    cursor that cannot be resumed yields `reset` without `id`, after which the client reconnects
    without a cursor (an `EventSource` client with a new instance). `end` closes a stream with a fixed
    reason. The semantics of the pre-declared, never served 0.3.0 operation are replaced by this
    release (see the CHANGELOG).
  x-legal-notice: >
    This contract cites no statute. Legal references live only in the domain: from slice 011 on,
    every rule of the domain rule tables (transitions and guards in `packages/domain`) carries a
    `legalRef` entry (source, citation, docVersion, docHash, verified), collected in the generated
    register `docs/legal-trace.md`. Every entry is `verified: false` until the legal department has
    checked it (decision register entry E15, feedback requested by 15.01.2027); nothing in this
    document or in that register is a verified statement of law. Since 0.4.0 the refusal catalogue
    (`listRefusalGrounds`) returns such domain `legalRef` entries as data (`LegalRef`); the contract
    defines their form, not their content.
servers:
  - url: /v1
    description: >-
      Same-origin API. In the demo the path is served in-process. Meeting-scoped collections are
      canonical under `/meetings/{meetingId}/…`; the un-prefixed collection paths are the alias for
      the current meeting until 0.5 (see `info.description`).
tags:
  - { name: meeting, description: 'The general meeting (Hauptversammlung, Jahrgang) and its master data' }
  - { name: speakers, description: List of speakers (Wortmeldeliste) }
  - { name: contributions, description: Speeches (Redebeiträge) and their capture }
  - { name: questions, description: Individual questions (Einzelfragen) and their workflow }
  - { name: stage, description: Podium view (Bühne) and podium seats (Bühnenplätze) }
  - { name: events, description: Append-only event feed for neighbouring systems and the history }
  - { name: admin, description: 'Administration of a meeting (Jahrgang) — master data, podium seats, role assignments, configuration freeze' }
  - { name: auth, description: 'Sign-in through the BFF (ADR 0004): session cookie, never a token in the browser' }
  - { name: operations, description: 'Health, readiness and metrics for the platform (ADR 0013): no personal data, no question text' }
  - { name: demo, description: 'Demo-only operations, never deployed to production' }
security:
  - demoActor: []
  - session: []
paths:
  # ---- alias paths for the current meeting (aktuelle HV) — veraltet seit 0.3.0, entfallen mit 0.5 ----
  /meeting:
    get:
      tags: [meeting]
      operationId: getMeeting
      summary: Get the current meeting (alias)
      deprecated: true
      description: >-
        Alias for the current meeting (aktuelle HV): the same resource as `GET /meetings/{meetingId}`
        with the id of the current meeting — the meeting in status `running` with the latest `date`
        (several running: the latest `date` wins, ties: the latest `MeetingCreated`); when none is
        running, the meeting with the latest `date` regardless of status. `404` when no meeting exists
        at all (today's behaviour before the first seed; every other alias resolves the same way from
        slice 025). Veraltet seit 0.3.0, entfällt mit Vertrag 0.5 (Plan 3, "Jahrgang und
        Tagesordnung"; no slice in Plan 5 names the removal yet). Served unchanged until then.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PersistenceBusy' }
  /agenda-items:
    get:
      tags: [meeting]
      operationId: listAgendaItems
      summary: List agenda items (Tagesordnungspunkte) of the current meeting (alias)
      deprecated: true
      description: >-
        Alias for `GET /meetings/{meetingId}/agenda-items` of the current meeting. Veraltet seit 0.3.0,
        entfällt mit Vertrag 0.5.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PersistenceBusy' }
  /units:
    get:
      tags: [meeting]
      operationId: listUnits
      summary: List answering units (Fachbereiche) of the current meeting (alias)
      deprecated: true
      description: >-
        Alias for `GET /meetings/{meetingId}/units` of the current meeting. Veraltet seit 0.3.0,
        entfällt mit Vertrag 0.5.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Unit' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PersistenceBusy' }
  /speakers:
    get:
      tags: [speakers]
      operationId: listSpeakers
      summary: List speakers (Wortmeldeliste) of the current meeting, ordered by round and position (alias)
      deprecated: true
      description: >-
        Alias for `GET /meetings/{meetingId}/speakers` of the current meeting. Veraltet seit 0.3.0,
        entfällt mit Vertrag 0.5.
      parameters:
        - { $ref: '#/components/parameters/RoundFilter' }
        - { $ref: '#/components/parameters/SpeakerStatusFilter' }
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETagRequired' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Speaker' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PersistenceBusy' }
    post:
      tags: [speakers]
      operationId: registerSpeaker
      summary: Register a speaker (Wortmeldung aufnehmen) in the current meeting (alias)
      deprecated: true
      description: >-
        Alias for `POST /meetings/{meetingId}/speakers` of the current meeting. Veraltet seit 0.3.0,
        entfällt mit Vertrag 0.5.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatchRequired' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SpeakerRegistration' } } }
      responses:
        '201': { description: Created, headers: { ETag: { $ref: '#/components/headers/ETagRequired' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Speaker' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PersistenceBusy' }
  /speakers/order:
    put:
      tags: [speakers]
      operationId: reorderSpeakers
      summary: Set the order of speakers within a round (Reihenfolge ändern) of the current meeting (alias)
      deprecated: true
      description: >-
        Alias for `PUT /meetings/{meetingId}/speakers/order` of the current meeting. Veraltet seit
        0.3.0, entfällt mit Vertrag 0.5.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatchRequired' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SpeakerOrder' } } }
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETagRequired' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Speaker' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PersistenceBusy' }
  # ---- items with a global id: canonical as they are --------------------------------------------
  /speakers/{speakerId}:
    parameters: [ { $ref: '#/components/parameters/SpeakerId' } ]
    get:
      tags: [speakers]
      operationId: getSpeaker
      summary: Get a speaker
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Speaker' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PersistenceBusy' }
    patch:
      tags: [speakers]
      operationId: updateSpeaker
      summary: Change speaker status or round (Redner aufrufen, beenden, zurückziehen)
      description: >-
        Status changes follow the speaker state table (rule table R-SPK, slice 080). A body without any
        effective field (for example `{}`, or only a field removed in 0.4.0) writes no event and keeps
        the version (takt-015). `reason` is required only for `finished → waiting` (R-SPK-05, a
        follow-up question); since 0.4.0 it is in the contract (slice 043a).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatchRequired' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SpeakerUpdate' } } }
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETag' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Speaker' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Since 0.4.0 (slice 043a; served since slice 080): the speaker state table refuses the status
            change, rule id in `ruleId`. R-SPK-00: no row for this pair, or the same status again.
            R-SPK-GUARD-01: `finished → waiting` (R-SPK-05) without `reason: follow_up`.
          headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
          content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 409 } } } ] } } }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PersistenceBusy' }
  /contributions:
    get:
      tags: [contributions]
      operationId: listContributions
      summary: List speeches (Redebeiträge) of the current meeting (alias)
      deprecated: true
      description: >-
        Alias for `GET /meetings/{meetingId}/contributions` of the current meeting. Veraltet seit
        0.3.0, entfällt mit Vertrag 0.5.
      parameters:
        - { $ref: '#/components/parameters/SpeakerIdFilter' }
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Contribution' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PersistenceBusy' }
    post:
      tags: [contributions]
      operationId: captureContribution
      summary: Capture a speech (Redebeitrag erfassen) in the current meeting (alias)
      deprecated: true
      description: >-
        Alias for `POST /meetings/{meetingId}/contributions` of the current meeting. Veraltet seit
        0.3.0, entfällt mit Vertrag 0.5. Creates the immutable text of a speech. Questions are then
        atomised out of it with `captureQuestions`. Later, transcript segments arrive through the
        ingest interface and become contributions the same way.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatchRequired' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ContributionCapture' } } }
      responses:

      description: >-
        Since 0.3.0 (slice 028). Permission `question.claim`; only the holder releases. `409` when the
        question is not claimed or claimed by someone else.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/QuestionUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /stage:
    get:
      tags: [stage]
      operationId: getStage
      summary: Podium view (Bühne) of the current meeting — current question, queue, counters (alias)
      deprecated: true
      description: >-
        Alias for `GET /meetings/{meetingId}/stage` of the current meeting. Veraltet seit 0.3.0,
        entfällt mit Vertrag 0.5.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/StageView' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  # ---- global feeds: sequence numbers are global, the meeting is a filter --------------------------
  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Append-only event feed. Poll with `after` = last seen sequence number.
      description: >-
        Global feed: `seq` is global and gap-free across meetings (ADR 0011), so this path has no
        meeting prefix and `lastSeq` stays the global cursor. Permission `event.read`. A `meetingId`
        filter arrives with 0.4.0 (slice 043, ahead of 035): not in 0.3.0, because the unchanged
        service would accept the parameter and silently return unfiltered events (review 023).
      parameters:
        - { $ref: '#/components/parameters/After' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 } }
      responses:
        '200':
          description: OK
          headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
          content:
            application/json:
              schema:
                type: object
                required: [items, lastSeq]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Event' } }
                  lastSeq: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /stream:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Realtime event stream (Server-Sent Events) with resumption
      description: >-
        Since 0.3.0 (slice 035, ADR 0014). `text/event-stream`: every message carries one `Event`
        as JSON in `data:` and its `seq` in `id:`; a comment line is sent as heartbeat every 15 s.
        Resume with `after` or the `Last-Event-ID` header (the browser sends it on reconnect). When
        both are present, `Last-Event-ID` wins: it is the newer cursor on a reconnect, `after` applies
        to the first connection only (Codex on PR #25). The
        same read permission as `listEvents` applies per delivered event (`event.read` plus the read
        scopes of slice 010): no event reaches a reader who may not read it. Polling `/events` stays
        the fallback. In-app alarms (`NotificationRaised`, slice 085) travel on this stream later.
      parameters:
        - { $ref: '#/components/parameters/After' }
        - { $ref: '#/components/parameters/MeetingIdFilter' }
        - { $ref: '#/components/parameters/LastEventId' }
      responses:
        '200':
          description: Stream opened; messages follow until the client closes the connection
          headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
          content:
            text/event-stream:
              schema: { type: string, description: 'SSE framing; each `data:` line is one `Event` JSON document' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  # ---- meetings (Jahrgang) — canonical since 0.3.0 --------------------------------------------------
  /meetings:
    get:
      tags: [meeting]
      operationId: listMeetings
      summary: List meetings (Jahrgänge)
      description: >-
        Since 0.3.0 (slice 025). Every signed-in actor may read the list, like the meeting itself
        (Festlegung 1 of slice 010: master data needs no read permission of its own). Sorted by
        `date` descending.
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/MeetingStatus' } }
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Meeting' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    post:
      tags: [meeting, admin]
      operationId: createMeeting
      summary: Create a meeting (Jahrgang anlegen), optionally cloned from an earlier one
      description: >-
        Since 0.3.0 (slice 040). Permission `admin.meetings.manage`. With `cloneFromMeetingId` the
        master data of that meeting (agenda items, units, podium seats) is copied; speakers,
        contributions, questions and events are never copied. Emits `MeetingCreated` (payload
        `clonedFromMeetingId` when cloned). A second legal entity is not modelled (ADR 0011, B-list).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/MeetingCreate' } } }
      responses:
        '201': { description: Created, headers: { ETag: { $ref: '#/components/headers/ETagRequired' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [meeting]
      operationId: getMeetingById
      summary: Get a meeting (canonical form of `GET /meeting`)
      description: Since 0.3.0 (slice 025). The `ETag` is the meeting's `version` (admin writes send it as `If-Match`, slice 040).
      responses:
        '200': { description: OK, headers: { ETag: { $ref: '#/components/headers/ETagRequired' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { $ref: '#/components/schemas/Meeting' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /meetings/{meetingId}/agenda-items:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [meeting]
      operationId: listMeetingAgendaItems
      summary: List agenda items (Tagesordnungspunkte) of a meeting
      description: Since 0.3.0 (slice 025); canonical form of `GET /agenda-items`.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin, meeting]
      operationId: replaceMeetingAgendaItems
      summary: Set the agenda (Tagesordnung) of a meeting — the whole list
      description: >-
        Since 0.3.0 (slice 040). Permission `agenda.manage`. The list replaces the agenda; an item
        that keeps its `id` keeps its progress timestamps and its questions. `409` after the
        configuration freeze (R-ADM-03, slice 040) or when an item to be removed already has questions.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AgendaItemInput' } } } }
      responses:
        '200': { description: OK — the agenda after the change; `ETag` is the meeting's new version, headers: { ETag: { $ref: '#/components/headers/ETagRequired' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/AgendaItem' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}/agenda-items/{agendaItemId}/opening:
    parameters: [ { $ref: '#/components/parameters/MeetingId' }, { $ref: '#/components/parameters/AgendaItemId' } ]
    post:
      tags: [meeting]
      operationId: openAgendaItem
      summary: Call an agenda item (Tagesordnungspunkt aufrufen) — emits `AgendaItemOpened`
      description: >-
        Since 0.3.0 (slice 025, rule table R-MTG). Permission `agenda.manage`. `409` when the meeting
        is not running or the item is already open (rule id in `ruleId`).
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/AgendaItemUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}/agenda-items/{agendaItemId}/voting/opening:
    parameters: [ { $ref: '#/components/parameters/MeetingId' }, { $ref: '#/components/parameters/AgendaItemId' } ]
    post:
      tags: [meeting]
      operationId: openVoting
      summary: Open the voting on an agenda item (Abstimmung eröffnen) — emits `VotingOpened`
      description: Since 0.3.0 (slice 025, R-MTG). Permission `agenda.manage`. `409` when the item is not open.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/AgendaItemUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}/agenda-items/{agendaItemId}/voting/closure:
    parameters: [ { $ref: '#/components/parameters/MeetingId' }, { $ref: '#/components/parameters/AgendaItemId' } ]
    post:
      tags: [meeting]
      operationId: closeVoting
      summary: Close the voting on an agenda item (Abstimmung schließen) — emits `VotingClosed`
      description: Since 0.3.0 (slice 025, R-MTG). Permission `agenda.manage`. `409` when the voting is not open.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      responses:
        '200': { $ref: '#/components/responses/AgendaItemUpdated' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}/units:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [meeting]
      operationId: listMeetingUnits
      summary: List answering units (Fachbereiche) of a meeting
      description: Since 0.3.0 (slice 025); canonical form of `GET /units`.
      responses:
        '200': { description: OK, headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Unit' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [admin, meeting]
      operationId: replaceMeetingUnits
      summary: Set the answering units (Fachbereiche) of a meeting — the whole list
      description: >-
        Since 0.3.0 (slice 040). Permission `admin.units.manage`. A unit that keeps its `id` keeps its
        assignments; `409` after the configuration freeze (R-ADM-03) or when a unit to be removed
        still has assigned questions.
      parameters: [ { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/CsrfToken' }, { $ref: '#/components/parameters/IfMatch' } ]
      requestBody:
        required: true
        content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/UnitInput' } } } }
      responses:
        '200': { description: OK — the units after the change; `ETag` is the meeting's new version, headers: { ETag: { $ref: '#/components/headers/ETagRequired' }, X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Unit' } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /meetings/{meetingId}/stage-seats:
    parameters: [ { $ref: '#/components/parameters/MeetingId' } ]
    get:
      tags: [stage, meeting]
      operationId: listMeetingStageSeats
      summary: List the podium seats (Bühnenplätze) of a meeting
      description: >-

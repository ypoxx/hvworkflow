  # ---- global feeds: sequence numbers are global, the meeting is a filter --------------------------
  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: Append-only event feed. Poll with `after` = last seen sequence number.
      description: >-
        Global feed: `seq` is global and gap-free across meetings (ADR 0011), so this path has no
        meeting prefix and `lastSeq` stays the global cursor. Permission `event.read`. A `meetingId`
        filter arrives as the contract line of the slice that serves it, not with a contract-only
        release, because the unchanged service would accept the parameter and silently return
        unfiltered events (review 023). Since 0.4.0 (slice 043a): `payload.answer.refusalJustification`
        is never part of an `EventRead`, for any reader.
      parameters:
        - { $ref: '#/components/parameters/After' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 5000, default: 1000 } }
      responses:
        '200':
          description: OK
          headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
          content:
            application/json:
              schema:
                type: object
                required: [items, lastSeq]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/EventRead' } }
                  lastSeq: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/PersistenceBusy' }
  /stream:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Realtime stream (Server-Sent Events) with resumption, filtered per reader
      description: |
        Since 0.3.0 (slice 023, ADR 0014); message kinds, cursor rules, limits and stream end since
        0.3.11 (slice 035a; served from slice 035b). Polling `/events` stays the fallback. In-app alarms
        (`NotificationRaised`, slice 085) travel on this stream later.

        **Framing.** `text/event-stream`. The first line of every stream is `retry: 3000`. Every message
        is one SSE block with an `event:` line naming its kind and exactly one `data:` line holding one
        JSON document; `event`, `change` and `cursor` also carry an `id:` line, `reset` and `end` never
        do. A comment line is sent as heartbeat every 15 s. The kinds (schemas in `x-sse-messages` of
        the `200` response):
        - `event`: one `EventRead`, the same JSON `listEvents` returns for that `seq`; `id` = `seq`.
        - `change`: one `StreamChange`, a change signal without content; `id` = `seq` of the last event
          it covers (for a catch-up change: the head).
        - `cursor`: one `StreamCursor`; `id` = the current head (the highest global `seq`).
        - `reset`: one `StreamReset`, without `id`; the client must not derive a cursor from it. The
          service closes the stream after it.
        - `end`: one `StreamEnd` with a fixed `reason`, without `id`; the service closes the stream
          after it.

        **Rights per message (R-PERM-04).** Visibility is decided per event, per reader, with the
        reader's rights at delivery time, through the same permission check as the read operations
        (never by role name). A reader who holds `event.read` in any active meeting receives every
        event as an `event` message, masked exactly like `listEvents`; without a `meetingId` filter
        gap-free in `seq`. Every other
        reader receives `change` messages only: topics for which the reader holds a read permission
        (`meeting` for every reader with an active role assignment), and in `subjects` only the ids of
        items the reader may read before or after the change (live) or now (catch-up); counter changes
        arrive as a topic without ids. The events of one delivery are merged into one `change`. No
        message carries a payload, a text or an id the reader may not read; when nothing is visible,
        nothing is sent. Events without a meeting reach only readers with `event.read`. Since 0.4.0
        (slice 043a): an `event` message is an `EventRead` and never carries
        `payload.answer.refusalJustification`.

        **`meetingId` filter.** Since 0.3.12 (takt-040, as served since slice 035b): with a filter a
        reader with `event.read` receives every event of that meeting after the cursor exactly once and
        in ascending `seq`, as `event` messages, gap-free within the meeting; every other reader
        receives `change` messages for that meeting's events only, under the rules above (R-PERM-04).
        `id` stays the global `seq`. Between two `event` messages, gaps in `id` are events of other
        meetings. For readers who receive `change` messages, the `id`s can also skip events of the same
        meeting that they may not read, or that were merged into one `change` (its `id` is the last
        covered `seq`). Events without a meeting do not belong to the filter and are not sent under
        it, not even to readers with `event.read`. The head (and so the client's cursor) moves on
        through the `cursor` message (after the catch-up and with the heartbeat). The catch-up limit
        of 1000 events (below) counts the global range `(cursor, head]`, not only the meeting's events
        in it.

        **Cursor.** Resume with `after` or the `Last-Event-ID` header (the browser sends it on
        reconnect). When both are present, `Last-Event-ID` wins: it is the newer cursor on a reconnect,
        `after` applies to the first connection only (Codex on PR #25). Without either, the stream
        starts at the head. A `cursor` message is sent (a) as the first message after `retry:` when the
        stream is opened without a cursor, (b) right after a completed catch-up, also when the last
        catch-up message already carried the head as `id`, and (c) with the heartbeat when the head
        moved on through events the reader cannot see. So every connection holds a valid `id` right
        after it is established.

        **Catch-up and reset.** With a cursor, the events in `(cursor, head]` are caught up before live
        delivery: as `event` messages for readers with `event.read`, otherwise as at most one `change`
        with `replay: true`. The service sends `reset` instead of a catch-up when the range holds more
        than 1000 events, when the cursor lies beyond the head, or when the reader's view of an item
        may have left their read scope within the range (a catch-up only sees today's state). After
        `reset` the client discards its state, reloads by the read operations and reconnects **without**
        a cursor (neither `after` nor `Last-Event-ID`); it then receives `cursor` with the head as in
        (a). A client built on `EventSource` must create a new `EventSource` instance without
        `Last-Event-ID` after `reset`: the built-in reconnect would send the old `id` again and receive
        `reset` again.

        **Stream end.** `end` names why the service closes the stream: `session` (the session expired
        or was signed out; sign in again), `forbidden` (the reader has no active role assignment any
        more; do not reconnect), `roles_changed` (the reader's role assignments changed; reconnect
        with the last `id`), `rotate` (the service ends long connections; reconnect with the last `id`),
        `unavailable` (the service cannot deliver reliably now, e.g. the persistence; reconnect with
        the last `id` after a pause). A reconnect after `session` or `forbidden` is answered `401` or
        `403`, which ends an `EventSource` for good.

        **Limits.** A stream per session or per subject beyond the service's limit is `429`; beyond the
        service's global stream limit, or while the persistence is busy or not ready, it is `503`
        `StreamUnavailable`. Both carry `Retry-After`; since 0.3.12 (takt-040, as served since slice
        035b) its value is 30 on every `503` `StreamUnavailable` (global stream limit,
        migrations pending, persistence busy at open) and on the `429` for too many open streams. An
        `end` message, including `end` `unavailable`, carries no `Retry-After`: the header exists only
        on a refused open; after `end` `unavailable` the SSE `retry` value (3000 ms) or the client's
        own backoff applies.
      parameters:
        - { $ref: '#/components/parameters/StreamAfter' }
        - { $ref: '#/components/parameters/MeetingIdFilter' }
        - { $ref: '#/components/parameters/LastEventId' }
      responses:
        '200':
          description: >-
            Stream opened; messages follow until the client closes the connection or the service
            ends it with `reset` or `end`. `x-sse-messages` maps each SSE `event:` name to the schema
            of its single `data:` line and to the meaning of its `id:` line.
          headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
          content:
            text/event-stream:
              schema: { type: string, description: 'SSE framing: first line `retry: 3000`, then blocks of `event:`, optional `id:` and one `data:` line with JSON (see `x-sse-messages`); comment lines as heartbeat' }
              x-sse-messages:
                event: { id: 'seq of the event', data: { $ref: '#/components/schemas/EventRead' } }
                change: { id: 'seq of the last covered event (catch-up: the head)', data: { $ref: '#/components/schemas/StreamChange' } }
                cursor: { id: 'the head', data: { $ref: '#/components/schemas/StreamCursor' } }
                reset: { id: none, data: { $ref: '#/components/schemas/StreamReset' } }
                end: { id: none, data: { $ref: '#/components/schemas/StreamEnd' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Since 0.3.11 (slice 035a) the `meetingId` filter names no known meeting (Jahrgang).
          headers: { X-Server-Time: { $ref: '#/components/headers/X-Server-Time' } }
          content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 404 } } } ] } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '408': { $ref: '#/components/responses/RequestTimeout' }
        '429':
          description: >-
            Since 0.3.11 (slice 035a): the caller's session or subject already holds as many open streams
            as the service allows, or a read quota of the service is used up for the current window.
            `Retry-After` is required. `detail` is a fixed sentence, never the limit.
          headers:
            Retry-After: { $ref: '#/components/headers/RetryAfter' }
            X-Server-Time: { $ref: '#/components/headers/X-Server-Time' }
          content: { application/problem+json: { schema: { allOf: [ { $ref: '#/components/schemas/Problem' }, { properties: { status: { const: 429 } } } ] } } }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/StreamUnavailable' }

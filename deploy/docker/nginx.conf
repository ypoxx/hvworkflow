# Slice 037a: nginx in front of the service in the local stack. It serves the built interface, forwards `/v1/` and
# `/auth/` to the service like the Vite proxy, and sets the limits in front of the application (threat model
# T-G1-D-01, proxy part; hand-over from apps/api/src/server.ts, slice 034a). No CSP here: it comes in 037b together
# with the CSP report test. The image runs as user 101 with a read-only root file system; compose mounts tmpfs on
# /tmp and /var/cache/nginx.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # Path without query string: the sign-in callback carries code and state in the query, they stay out of the log.
    log_format hv '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout hv;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Limits in front of the application. Header and body timeouts as in the service (10 s); the body limit sits just
    # above BODY_LIMIT_BYTES of the service (262144), so the service's own 413 decides the limit and nginx only stops
    # anything larger. No limit_req: the limits per source and per subject are the service's (slice 034a).
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    keepalive_requests 1000;
    large_client_header_buffers 4 8k;
    client_max_body_size 257k;

    # The service shares the network namespace of Keycloak (compose.yaml), so its address is `keycloak:8787`.
    upstream hv_api {
        server keycloak:8787;
        keepalive 16;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Security headers: the three of netlify.toml, with `always` so they also stand on 4xx and 5xx of the proxy
        # (for example 502 while the service is stopped). nginx does not inherit `add_header` into a block that has its
        # own, so every location repeats all three.

        # Probes and metrics are not reachable through the web port; the checks run inside the container. Exact
        # locations, so they never fall back to index.html.
        location = /healthz {
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            return 404;
        }
        location = /readyz {
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            return 404;
        }
        location = /metrics {
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            return 404;
        }

        # No source maps (T-Q-I-02). nginx checks regex locations before plain prefix locations, so this also applies
        # to a path under /v1/ or /auth/ that ends in `.map`; the service has no such path. This is deliberate: never add
        # `^~` to the prefix locations below, and do not read this regex as a gap.
        location ~ \.map$ {
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            return 404;
        }

        # The event stream: no buffering, a read timeout well above the 15 s heartbeat, HTTP/1.1 without `Connection: close`.
        location /v1/stream {
            proxy_pass http://hv_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 120s;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # X-Forwarded-For is overwritten with the peer address, never appended to: the service trusts no proxy locally
        # (trusted-proxies=none), and a header from the browser must not travel on.
        location /v1/ {
            proxy_pass http://hv_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location /auth/ {
            proxy_pass http://hv_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Referrer-Policy;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # The interface: files of the build, otherwise index.html for the routes of the single-page application.
        location / {
            try_files $uri $uri/ /index.html;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }
    }
}

# Deterministic gates (docs/agentische-entwicklung-plan.md, section 5). Runs outside any agent
# session; a Stop hook can be overridden, this cannot.
name: gates
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: both path filters and Semgrep's changed-file scan diff against it
          persist-credentials: false # nothing later pushes or otherwise needs git write credentials
      # The pnpm version comes from `packageManager` in package.json (takt-001).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Slice 012 point 8: a doc-only commit (`docs/**`, `*.md`) skips the Chromium install and
      # Playwright below — nothing else. No `paths-ignore` at the workflow level: the job always
      # triggers and reports, so a later required status check never simply goes missing.
      #
      # Review rework round 1, major 4: a single extglob rule (`!(docs/**|*.md)`) under-matches
      # nested doc files on the picomatch version paths-filter pins (2.3.1) — a file changed only
      # under e.g. `docs/adr/**` could still count as "code". `predicate-quantifier: every` with two
      # separate negated rules requires a file to satisfy *both* ("not under docs/", "not a .md")
      # before it counts, which is exact rather than relying on one combined extglob.
      - name: Determine if only documentation changed
        id: docsfilter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!docs/**'
              - '!**/*.md'
      # A second, separate paths-filter step: `ts` needs the default "some" (OR-across-rules)
      # quantifier, which sharing the `every` setting above in one step would break (no file can
      # simultaneously match `**/*.ts` *and* `**/*.tsx`). `added|modified|renamed` excludes deleted
      # files — Semgrep exits 2 on a path that no longer exists (major 5) — and `**/*.{js,mjs,cjs}`
      # is added so a changed `scripts/*.mjs` is scanned on PRs too.
      - name: Determine changed source files
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          list-files: json
          filters: |
            ts:
              - added|modified|renamed: '**/*.ts'
              - added|modified|renamed: '**/*.tsx'
              - added|modified|renamed: '**/*.js'
              - added|modified|renamed: '**/*.mjs'
              - added|modified|renamed: '**/*.cjs'
      - name: Contract types are up to date
        run: pnpm contract:types && git diff --exit-code -- packages/contract/src/types.ts
      - name: Contract lint, typecheck, lint, unit tests, vocabulary, architecture, role-literals, now-check, plan-honesty, build
        run: pnpm gates
      - name: Policy truth table is committed
        run: git diff --exit-code -- packages/domain/policy-truth-table.md
      - name: Semgrep
        env:
          # Minor 13: the changed-file list travels through `env`, never spliced with `${{ }}`
          # straight into the shell — a crafted PR file name must not become a shell argument by
          # string interpolation.
          TS_FILES_JSON: ${{ steps.changes.outputs.ts_files }}
        run: |
          mapfile -t FILES < <(echo "$TS_FILES_JSON" | jq -r '.[]')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "Semgrep: no added/modified/renamed .ts/.tsx/.js/.mjs/.cjs files — nothing to scan."
            exit 0
          fi
          pip install --quiet 'semgrep==1.177.0'
          # Hints (e.g. Math.random) are reported but never block, per the slice spec.
          semgrep --config scripts/semgrep/rules.yml --metrics=off --disable-version-check --severity INFO --quiet -- "${FILES[@]}" || true
          # WARNING and ERROR block (docs/agentische-entwicklung-plan.md 5.2 "ab Schwere WARNING").
          semgrep --config scripts/semgrep/rules.yml --metrics=off --disable-version-check --severity WARNING --severity ERROR --error -- "${FILES[@]}"
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: scripts/gitleaks.toml
      - name: pnpm audit
        run: pnpm audit:check
      - name: Install Chromium for Playwright
        if: steps.docsfilter.outputs.code == 'true'
        run: pnpm --filter @hv/web exec playwright install --with-deps chromium
      - name: End-to-end acceptance scenario
        if: steps.docsfilter.outputs.code == 'true'
        run: pnpm --filter @hv/web e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            docs/evidence/
            apps/web/playwright-report/
          if-no-files-found: ignore
